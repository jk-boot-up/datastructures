  ["Append", "O(1) amortised", "O(1) amortised", "overflow when full"],
  ["Insert or delete at the front", "O(n) shifts", "O(n) shifts", "O(n) shifts"],
  ["Moves elements with", "memcpy of elem_size bytes", "pointer assignment", "memcpy"],
  ["Type checked by the compiler", "no: void *", "yes", "no: void *"],
]

pros = [
  "One implementation for every element type.",
  "O(1) access, O(1) amortised appends, and it shrinks again when mostly deleted.",
  "Structs are stored inside the block itself: no separate allocation per element.",
]
cons = [
  "No type checking through `void *`.",
  "A resize still pauses for O(n) copies, and needs the old and new blocks at once.",
  "Insertion and deletion at the front shift every element.",
]

[[mistake]]
mistake = "The wrong element size"
happens = "Elements overlap or are cut short, and neighbours overwrite each other."
fix = "Pass `sizeof` of the element type itself: `create(&a, sizeof(Song))`."
[[mistake]]
mistake = "Keeping a pointer into the block across an append"
happens = "A resize moves every element to a new block and frees the old one: the pointer now points at freed memory."
fix = "Keep indexes, not pointers, or fetch the address again after every append."
[[mistake]]
mistake = "Forgetting to free the old block in a resize"
happens = "Every resize leaks the old block."
fix = "`free` it after copying, as `resize` does, or use `realloc`, which does both."
[[mistake]]
mistake = "Growing by a fixed amount"
happens = "Appending near the limit copies everything each time: about n squared over 2 copies."
fix = "Grow by a factor: double, or one and a half."

[[exercise]]
level = "easy"
question = """Write `int contains(const GenericDynamicArray *a, const void *key, CompareFn compare)` using `linear_search`. What does it return for `Song {"Echoes", 201}` on the demo's playlist, and why?"""
answer = """```c
int contains(const GenericDynamicArray *a, const void *key, CompareFn compare) {
    return linear_search(a, key, compare) >= 0;
}
```
It returns 1: `compare_song` compares title and length, and a song with that title and length is in the playlist. O(n) time, O(1) space."""
[[exercise]]
level = "medium"
question = """Write `int delete_by_key(GenericDynamicArray *a, const void *key, CompareFn compare)`, deleting the first element equal to `key`. What does it cost?"""
answer = """```c
int delete_by_key(GenericDynamicArray *a, const void *key, CompareFn compare) {
    int i = linear_search(a, key, compare);
    if (i < 0) return 0;
    unsigned char gone[64];                 /* room for one element; assumes elem_size <= 64 */
    delete_at(a, i, gone);
    return 1;
}
```
One comparison per element examined, plus one shift per element after the one deleted: one pass, O(n). A general version would `malloc(a->elem_size)` for the deleted element instead of a fixed buffer."""
[[exercise]]
level = "harder"
question = """Rewrite `resize` using `realloc`. What can `realloc` do that the copying loop cannot, and what must you be careful of when it fails?"""
answer = """```c
static Status resize(GenericDynamicArray *a, int new_capacity) {
    unsigned char *bigger = realloc(a->data, (size_t) new_capacity * a->elem_size);
    if (bigger == NULL) return STATUS_NO_MEMORY;   /* a->data is still valid */
    a->data = bigger;
    a->capacity = new_capacity;
    return STATUS_OK;
}
```
`realloc` may grow the block in place when the memory after it is free, copying nothing. If it fails it returns `NULL` and leaves the old block alone, so the result must go into a new variable: `a->data = realloc(a->data, ...)` would lose the only pointer to the old block."""

