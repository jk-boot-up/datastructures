speech = """Now the playlist fills up. [[slnc 400]] Appending a fifth song needs a bigger block: room for eight songs. [[slnc 400]] Four songs are copied across, eighty bytes. [[slnc 400]] The old block is freed. [[slnc 500]] Nine songs end in a block of sixteen places."""
