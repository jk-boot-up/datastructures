detail = """Inserting an intro at the front shifts all 9 songs one place right, 20 bytes each; deleting "Paper Moon" at index 5 shifts the 4 after it left. Searching needs a comparison function: `compare_song` compares the title with `strcmp` and then the length. Echoes at 3:21 is found at index 6 after 7 comparisons; Echoes at 3:20 is not found, because to this comparison function it is a different song."""
speech = """Now the middle. [[slnc 400]] Inserting an intro shifts nine songs. [[slnc 300]] Deleting at index five shifts four. [[slnc 500]] To search, the array needs a comparison function. [[slnc 400]] Ours compares the title, then the length. [[slnc 400]] Echoes, three minutes twenty one, is found at index six. [[slnc 300]] Echoes, three minutes twenty, is not: a different song."""
