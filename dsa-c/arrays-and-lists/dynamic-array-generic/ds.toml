narration = """Hello, and welcome. [[slnc 400]] This video explains the generic dynamic array, in C. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] It is an array that grows by itself, written once for any type of element. [[slnc 400]] It is a block of bytes with an element size, and when it is full, it moves into a block twice as big. [[slnc 700]] Our example is a music playlist of songs. [[slnc 400]] By the end, you will know how C builds a growable container for any type, and what it costs."""

[[scene]]
key = "02-idea"
kind = "structure"
title = "The Everyday Idea"
caption = "The removals firm knows only the box size, never the contents"
picture = { type = "group", items = [ { type = "array", cells = ["box", "box", "box", "box"], title = "van: full" }, { type = "array", cells = ["box", "box", "box", "box", "", "", "", ""], size = 4, marks = { "0" = "new", "1" = "new", "2" = "new", "3" = "new" }, title = "a van twice as big" } ], vertical = true }
narration = """Picture moving house with boxes. [[slnc 400]] The removals firm does not need to know what is in the boxes, only that every box is the same size. [[slnc 500]] When the van is full, they bring one twice as big, and carry every box across. [[slnc 500]] To find a particular box, they ask you, because you know what is inside. [[slnc 400]] That is a generic dynamic array."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["elem_size: bytes per element", "size and capacity: in use, and available", "resize: a new block, every element's bytes copied", "memcpy: copy bytes without knowing their type", "", "compare(a, b): the function that knows the type"]
narration = """The words. [[slnc 400]] The element size is how many bytes one element takes. [[slnc 400]] Size is how many are in use, and capacity how many fit. [[slnc 400]] A resize makes a new block, and copies every element's bytes. [[slnc 400]] Mem copy copies bytes without knowing their type. [[slnc 400]] And the comparison function is the one piece that knows the type."""

