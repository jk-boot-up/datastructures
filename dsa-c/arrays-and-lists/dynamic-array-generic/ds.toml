# ---------------------------------------------------------------- act 5
[[act]]
title = "The bill"
summary = "1,000 appends copy 1,020 elements, about one each; deleting down to 256 of 1,024 halves the capacity; the costs equal the char * version's."
detail = """A thousand appends of ints copy 4 + 8 + ... + 512 = 1,020 elements in total, about one per append: O(1) amortised, as in the `char *` version. Deleting from the end down to 256, a quarter of 1,024, halves the capacity to 512. `void *` changes the element type, not the algorithm or its costs; `realloc` does the grow-and-copy for any block of bytes."""
speech = """And the bill. [[slnc 400]] A thousand appends copy one thousand and twenty elements. [[slnc 300]] About one per append. [[slnc 400]] Deleting down to a quarter halves the capacity. [[slnc 500]] Every cost is the same as before. [[slnc 400]] The void pointer changes the type, not the algorithm."""
