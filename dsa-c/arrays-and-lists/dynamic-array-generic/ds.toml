# tools/dskit turns it into the README, docs, pictures, animation and video scenes.

[project]
slug = "dynamic-array-generic"
category = "arrays-and-lists"
title = "Dynamic Array (Generic)"
package = "generic_dynamic_array"
main_class = "demo"
example = "A playlist of Song structs, beside the same code holding titles and play counts"
tagline = "A growable array for any type, the C way"
bold = "A generic dynamic array in C is a block of bytes with an element size, a size and a capacity: appending copies elem_size bytes into the next place, a full block is replaced by one twice as big with every element's bytes copied across, and comparisons go through a function pointer; the costs are those of any dynamic array."
analogy_short = "Moving house with boxes of any size, as long as they are all the same size"
jdk = "`realloc` in `<stdlib.h>`, which grows any block of bytes by copying it"
thumb_lines = ["DYNAMIC ARRAY", "GENERIC void *"]
thumb_code = "memcpy(data + size * elem_size, ...)"
youtube_title = "Generic Dynamic Array in C - A Growable Array for Any Type"
youtube_tags = ["dynamic array in c", "generic array", "void pointer", "memcpy", "realloc", "amortized"]
youtube_description = """Generic Dynamic Array in C, explained with a playlist of Song structs, beside the same code holding titles and play counts. We see what the array holds: a block of bytes, an element size of 8, 4 or 20 bytes, a size and a capacity. We append until the block is full and watch a resize copy 4 songs, 80 bytes, into a block twice as big. We insert at the front with 9 shifts, delete from the middle with 4, and find a song by title and length with a comparison function, while a song of a different length is not found. We shrink to fit, and finish with the bill: 1,020 elements copied for 1,000 appends, and the capacity halving when a quarter full. The char * version is the Dynamic Array project."""

[readme]
intro = """A **generic dynamic array** is the `dynamic-array` project written once for **any element type**, the way C's standard library handles any type. The array is a block of bytes with an **element size**, `elem_size`, a **size** (elements in use) and a **capacity** (places in the block). Element i starts at `data + i x elem_size`. Appending copies `elem_size` bytes into the next place with **`memcpy`**; when the block is full, a new block of twice the capacity is allocated, every element's bytes are copied across, and the old block is freed. When deletions leave it a quarter full, it is halved. Searching takes a **comparison function**. Every cost is that of the `dynamic-array` project; what changes is that the array knows only sizes, never types."""
analogy = """Picture moving house with boxes: the removals firm does not need to know what is in the boxes, only that every box is the same size, 20 centimetres, say. When the van is full, the firm brings one twice as big and carries every box across. To find "the box with the Echoes record", the firm asks you, the person who knows what is inside, to check each box."""
example = """The music app's playlist holds `Song` structs, each a title and a length in seconds, 20 bytes per song. The same code also holds the titles as `char *` pointers and the play counts as `int`s. The demo grows the playlist until it resizes, inserts an intro, deletes a song, searches with a comparison function, deletes from the end, shrinks to fit, and measures a thousand appends."""
why = """A playlist of songs, a list of titles and a list of play counts should not need three copies of the dynamic-array code. With a byte block, an element size and comparison functions, one implementation serves every type. It is how C code builds growable containers, and it is what `realloc` makes cheap to write."""
when_use = [
  "A growing list of values of one type, in C, where the type varies from use to use.",
  "Mostly appending at the end and reading by index.",
]
when_not = [
  "Only one element type is ever needed: the typed version is simpler and checked by the compiler.",
  "Frequent insertion and deletion at the front: every element shifts; use a linked list or a deque.",
]
met_before = [
  "`realloc` growing a buffer in any C program.",
  "Java's `ArrayList<E>` and C++'s `std::vector<T>`, the typed equivalents in other languages.",
]

