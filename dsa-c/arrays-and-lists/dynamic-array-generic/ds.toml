listing_intro = """The generic parts, exactly as they appear in `src/generic_dynamic_array.c`. Compare them with the `dynamic-array` project: the growing and shrinking logic is the same; each assignment has become a `memcpy` of `elem_size` bytes."""
[[listing]]
op = "Resize: copying bytes"
method = "generic_dynamic_array#resize"
note = """A new block of `new_capacity x elem_size` bytes, each element's bytes copied with `memcpy`, and the old block freed. The array never knows whether it is copying songs, numbers or pointers."""
[[listing]]
op = "Insertion at the end"
method = "generic_dynamic_array#append"
note = """If `size == capacity` the block is full, so it is replaced by one twice as big first; then `elem_size` bytes are copied into place `size`. Most appends are one `memcpy`; the rare one that resizes costs O(n)."""
[[listing]]
op = "Linear search with a comparison function"
method = "generic_dynamic_array#linear_search"
note = """`compare(element_at(a, i), key) == 0` asks the function passed in whether two elements are equal. `compare_song` compares the title with `strcmp` and then the length, so a song of the same title but a different length is a different song."""

