[[scene]]
key = "costs"
kind = "bullets"
title = "Time and Space Complexity"
body = ["append: O(1) amortised, O(n) on a resize", "get, update: O(1)", "insert_at, delete_at: O(n) at the front", "linear search: O(n)", "", "the same as the char * version"]
narration = """Here are the costs. [[slnc 400]] Append is order one amortised, and order n when it resizes. [[slnc 400]] Get and update are order one. [[slnc 400]] Insert and delete at the front are order n. [[slnc 400]] Linear search is order n. [[slnc 500]] Every one is the same as the version for text only."""

[[scene]]
key = "compare"
kind = "bullets"
title = "Compared With Related Structures"
body = ["char * version: the same costs, one type, type checked", "generic static array: any type, fixed capacity", "", "realloc: the grow-and-copy, done for you"]
narration = """How does it compare? [[slnc 400]] The version for text has the same costs, for one type, checked by the compiler. [[slnc 400]] The generic static array holds any type, but cannot grow. [[slnc 400]] And real C code often lets realloc do the growing and copying."""

[[scene]]
key = "mistakes"
kind = "bullets"
title = "Common Mistakes"
body = ["the wrong element size", "a pointer into the block kept across an append", "forgetting to free the old block", "growing by a fixed amount"]
narration = """Four mistakes to watch for. [[slnc 400]] Passing the wrong element size. [[slnc 400]] Keeping a pointer into the block across an append: a resize moves everything. [[slnc 400]] Forgetting to free the old block. [[slnc 400]] And growing by a fixed amount instead of doubling."""

