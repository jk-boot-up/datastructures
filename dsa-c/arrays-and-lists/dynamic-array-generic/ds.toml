summary = "16 places, 9 in use; delete_at_end copies the last song out to the caller; shrink_to_fit copies 8 songs into exactly 8 places."
detail = """With 9 songs in 16 places, 7 are spare. `delete_at_end` copies "Last Train" out to the caller's variable, since the array's own bytes may be reused or freed. `shrink_to_fit` then resizes to exactly 8 places, copying 8 songs and freeing the larger block."""
