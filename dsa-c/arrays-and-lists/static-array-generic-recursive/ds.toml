[[mistake]]
mistake = "No base case, or no progress towards it"
happens = "The function calls itself until the stack overflows and the program is stopped."
fix = "Write the base case first; make every call work on `i + 1` or a smaller half."
[[mistake]]
mistake = "Comparing strings or structs with `==`"
happens = "`==` compares addresses, or does not compile for structs."
fix = "Compare through the comparison function."
[[mistake]]
mistake = "The wrong element size"
happens = "Elements overlap or are cut short."
fix = "Pass `sizeof` of the element type itself."
[[mistake]]
mistake = "Linear recursion on large data"
happens = "One frame per element: a million elements overflow the call stack."
fix = "Recurse where the depth is logarithmic; loop over long linear passes."

[[exercise]]
level = "easy"
question = """Write a recursive `int count_equal(const GenericArray *a, const void *key, CompareFn compare, int i)`. Name its base case and its extra space."""
answer = """```c
int count_equal(const GenericArray *a, const void *key, CompareFn compare, int i) {
    if (i == a->n) return 0;                                        /* base case */
    return (compare(element_at(a, i), key) == 0) + count_equal(a, key, compare, i + 1);
}
```
Called with `i = 0`. The base case is `i == n`. O(n) time and O(n) stack, one frame per element."""
[[exercise]]
level = "medium"
question = """Write a recursive `int is_sorted(const GenericArray *a, CompareFn compare, int i)`. How deep does it go on the day names in week order, [Mon, Tue, Wed, Thu, Fri, Sat, Sun]?"""
answer = """```c
int is_sorted(const GenericArray *a, CompareFn compare, int i) {
    if (i >= a->n - 1) return 1;                                     /* zero or one element left */
    if (compare(element_at(a, i), element_at(a, i + 1)) > 0) return 0;
    return is_sorted(a, compare, i + 1);
}
```
The first call finds "Mon" before "Tue", the second "Tue" before "Wed", and the third finds "Wed" after "Thu" and returns 0. Depth 3."""
[[exercise]]
level = "harder"
question = """Write a recursive `int find_min(const GenericArray *a, CompareFn compare, int i)`. Then write a comparison function that orders readings by day name, and say what `find_min` returns on the readings without changing `generic_array.c`."""
answer = """```c
int find_min(const GenericArray *a, CompareFn compare, int i) {
    if (i == a->n - 1) return i;
    int rest_min = find_min(a, compare, i + 1);
    return compare(element_at(a, i), element_at(a, rest_min)) <= 0 ? i : rest_min;
}

int compare_reading_by_day(const void *a, const void *b) {
    return strcmp(((const Reading *) a)->day, ((const Reading *) b)->day);
}
```
With readings ordered by day name, the smallest is "Fri" (24 C), the first alphabetically. The array code is unchanged: the comparison function decides the order."""

