narration = """Four mistakes to watch for. [[slnc 400]] A recursion with no base case, or no progress towards it. [[slnc 400]] Comparing strings or structs with double equals. [[slnc 400]] Passing the wrong element size. [[slnc 400]] And linear recursion on large data, which overflows the stack."""

