[[scene]]
key = "costs"
kind = "bullets"
title = "Time and Space Complexity"
body = ["get, update: O(1), not recursive", "traverse, linear search, max: O(n) time, O(n) stack", "binary search: O(log n) time and stack", "insert, delete: O(n) time and stack at the front", "", "the loop versions: the same time, O(1) space"]
narration = """Here are the costs. [[slnc 400]] Get and update are order one, and not recursive. [[slnc 400]] Traversal, linear search and find max take order n time, and order n stack. [[slnc 400]] Binary search takes order log n time and stack. [[slnc 400]] Insertion and deletion at the front take order n time and stack. [[slnc 500]] The loop versions take the same time, with order one extra space."""

[[scene]]
key = "compare"
kind = "bullets"
title = "The Four Static Arrays"
body = ["int, loops: the fastest, type checked", "int, recursive: O(depth) stack", "generic, loops: any type, no type checks", "generic, recursive: any type, O(depth) stack", "", "void *: what is stored; recursion: how much stack"]
narration = """How do the four static arrays compare? [[slnc 400]] The int array with loops is the fastest, and the compiler checks its type. [[slnc 400]] The recursive int array adds a stack frame per waiting call. [[slnc 400]] The generic array with loops holds any type, without type checks. [[slnc 400]] And this one does both. [[slnc 500]] The void pointer changes what is stored. [[slnc 300]] Recursion changes how much stack is used."""

