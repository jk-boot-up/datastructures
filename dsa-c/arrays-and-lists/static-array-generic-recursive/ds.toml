[project]
slug = "static-array-generic-recursive"
category = "arrays-and-lists"
title = "Static Array (Generic, Recursive)"
package = "generic_array"
main_class = "demo"
example = "One week held as day names, ints and readings, every operation recursive"
tagline = "Any type, one element per call"
bold = "The generic recursive static array in C holds any type as a block of bytes with an element size, compares through comparison functions, and writes every walk as a function that handles one element or one half and calls itself for the rest; the time is unchanged and the extra space is the recursion depth."
analogy_short = "A queue of helpers, each comparing one box with a rule you hand them"
jdk = "Nothing recursive: `qsort` and `bsearch` in `<stdlib.h>` take the same block, size and comparison function"
thumb_lines = ["STATIC ARRAY", "GENERIC + RECURSIVE"]
thumb_code = "search_from(a, key, i + 1)"
youtube_title = "Generic Recursive Static Array in C - void *, Comparison Functions and the Call Stack"
youtube_tags = ["recursion in c", "generic array in c", "void pointer", "function pointer", "call stack", "stack overflow"]
youtube_description = """Generic Recursive Static Array in C, explained with one week held as day names, ints and Reading structs by the same code. We trace a recursive linear search for "Thu" call by call, each call asking the comparison function and passing the rest of the array to the next call, until the match at depth 4. We traverse all three element types at depth 7, binary search the sorted day names in 3 comparisons and 3 calls, and find the hottest reading with a comparison on the way back up the call stack. We insert, delete and reverse recursively, moving whole elements with memcpy, and finish at the limit: binary search on a million ints goes only 20 calls deep, while linear search overflows the call stack and the child process running it is stopped."""

[readme]
intro = """This project combines the two variations of the **static array** in C. Like `static-array-generic`, it holds **any type** as a block of bytes with an **element size**, copies elements with **`memcpy`**, and compares them through **comparison functions**, `int compare(const void *, const void *)`, as `qsort` and `bsearch` do. Like `static-array-recursive`, every walk is a **recursion**: a function handles one element or one half, **calls itself** for the rest, and stops at a **base case**, while each call still waiting keeps a **frame** on the **call stack**. Every operation takes the same time as in the plain static array; the extra space of each recursive operation is its **recursion depth**: O(n) for traversal, linear search, maximum and shifting, O(log n) for binary search."""
analogy = """Picture a queue of seven helpers, each standing by one box. You hand the first helper a card describing what you are looking for, and a rule for comparing a box with the card. If the helper's box does not match, the helper passes the card and the rule to the next helper, and waits. The boxes could hold anything; the rule is what knows how to compare them. When someone finds a match, or the queue runs out, the answer travels back to you."""
example = """The weather station's week is stored three ways by the same code: day names as `char *`, temperatures as `int`, and `Reading` structs ordered by temperature. The demo traces a recursive search for "Thu", traverses all three arrays, binary searches the sorted day names, finds the hottest reading and the last day name with one recursive `find_max`, inserts, deletes and reverses recursively, and finally overflows the call stack on a million elements, in a child process."""
why = """The generic version answers "how do I write the structure once for every type in C?"; the recursive version answers "how do the textbook's recursive definitions run?". Much of real C code needs both: recursive functions over data they do not own the type of, driven by callbacks, as in tree and sorting libraries. Seeing the two together on the simplest structure prepares for the trees and heaps later in the course."""
when_use = [
  "The structure must hold several element types, and the algorithm is naturally recursive.",
  "The recursion depth is logarithmic, as in binary search.",
  "Learning: this is the shape of generic recursive C code for trees and divide-and-conquer.",
]
when_not = [
  "Linear recursion over large arrays: a million elements overflow the call stack; use the loops of `static-array-generic`.",
  "Only one element type is needed: the typed version is simpler and checked by the compiler.",
]
met_before = [
  "`qsort` and `bsearch` in `<stdlib.h>`: a block, an element size and a comparison function.",
  "Recursive functions in textbooks, such as a recursive binary search.",
  "A program stopped by `SIGSEGV` after a function called itself too deeply.",
]

