# ---------------------------------------------------------------- act 5
[[act]]
title = "The limit of recursion"
summary = "On 1,000,000 ints, recursive binary search makes 20 comparisons, 20 calls deep; recursive linear search overflows the call stack, and the child process running it is stopped by SIGSEGV."
detail = """Generics do not change the depth. Binary search on a million sorted ints makes 20 comparisons, 20 calls deep, and is always safe. Linear search on the same array needs one frame per element, and the call stack runs out long before a million: the operating system stops the program with `SIGSEGV`. C cannot catch that, so the demo runs the search in a child process and reports how the child ended. The loop version in `static-array-generic` searches the million with O(1) extra space. `void *` changes what is stored; recursion changes how much stack is used; neither changes the time."""
speech = """And the limit. [[slnc 400]] Binary search on a million integers is only twenty calls deep. [[slnc 500]] Linear search needs one frame per element, and the call stack runs out. [[slnc 400]] The operating system stops the program. [[slnc 300]] So the demo ran it in a separate child process. [[slnc 500]] Generics change what is stored. [[slnc 300]] Recursion changes how much stack is used."""
console = [["binary_search on 1,000,000 ints: index 666666, 20 comparisons, depth 20", "ok"], ["linear_search on 1,000,000: the child process was killed by SIGSEGV: the call stack overflowed", "bad"], ["void * changes what is stored; recursion changes how much stack is used; neither changes the time", "muted"]]
[[act.frame]]
