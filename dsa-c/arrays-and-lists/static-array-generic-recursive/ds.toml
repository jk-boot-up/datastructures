meaning = "The input answered without another call: no elements left, a match found, or an empty range."
[[word]]
term = "recursive case"
meaning = "One element's work, then a call on the rest: `linear_search_from(a, key, compare, i + 1)`."
[[word]]
term = "call stack and frame"
meaning = "C keeps one frame, holding a call's parameters and local variables, for every call that has not returned."
[[word]]
