[[scene]]
key = "01-poster"
kind = "poster"
title = "Static Array (Generic, Recursive)"
narration = """Hello, and welcome. [[slnc 400]] This video explains the generic, recursive static array, in C. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] It is a static array written once for any element type, as bytes with an element size, whose operations call themselves. [[slnc 400]] Each call handles one element, asks a comparison function, and passes the rest to the next call, until a base case stops it. [[slnc 700]] Our example is a weather station's week, as day names, temperatures, and readings. [[slnc 400]] By the end, you will know how generic code and recursion work together in C, and what each one costs."""

[[scene]]
key = "02-idea"
kind = "structure"
title = "The Everyday Idea"
caption = "Each helper compares one box with the rule, or passes the card on and waits"
picture = { type = "array", cells = ["you", "box", "box", "box", "box", "box", "last"], marks = { "6" = "ok" }, pointers = [[0, "asks"], [6, "base case"]], title = "a queue of helpers, one box each" }
narration = """Picture a queue of seven helpers, each standing by one box. [[slnc 400]] You hand the first helper a card, and a rule for comparing a box with the card. [[slnc 400]] If the box does not match, the helper passes the card and the rule to the next helper, and waits. [[slnc 500]] The boxes could hold anything. [[slnc 300]] The rule is what knows how to compare them. [[slnc 500]] When someone finds a match, or the queue runs out, the answer travels back to you."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["elem_size: bytes per element", "compare(a, b): negative, zero or positive", "base case: no call; recursive case: call on the rest", "", "recursion depth = frames at once = extra space"]
narration = """The words. [[slnc 400]] The element size is how many bytes one element takes. [[slnc 400]] A comparison function returns negative, zero, or positive. [[slnc 400]] The base case answers without calling again. [[slnc 300]] The recursive case handles one element and calls itself on the rest. [[slnc 500]] And the recursion depth, the number of frames at once, is the extra memory used."""

