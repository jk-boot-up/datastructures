listing_intro = """Each operation is a public function and a `static` helper that calls itself. Compare them with `static-array-recursive`: the recursion is identical; `arr[i]` has become `element_at(a, i)`, assignment has become `memcpy`, and `==` and `<` have become calls to the comparison function."""
[[listing]]
op = "Linear search with a comparison function"
method = "generic_array#linear_search,linear_search_from"
note = """Two base cases: no elements left (-1), and a match, found by `compare(...) == 0`. Otherwise the call passes the rest of the array, `i + 1`, to the next call. One frame per element examined."""
[[listing]]
op = "Binary search"
method = "generic_array#binary_search,binary_search_range"
note = """The comparison function's sign decides the half. The base case is an empty range. Each call halves the range, so the depth is at most about log2(n) + 1: 3 for 7 names, 20 for a million."""
[[listing]]
op = "Find maximum"
method = "generic_array#find_max,find_max_from"
note = """The base case is the last element. Every other call first finds the maximum of the rest, then compares it with its own element on the way back up. The comparison function decides the order: temperature for readings, alphabetical for names."""
[[listing]]
op = "Insertion"
method = "generic_array#insert_at,shift_right"
note = """`shift_right` copies element i one place right with `memcpy` and recurses on `i - 1`, starting at the last element, so nothing is overwritten before it has moved."""

