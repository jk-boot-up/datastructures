[[scene]]
key = "01-poster"
kind = "poster"
title = "Static Array (Generic)"
narration = """Hello, and welcome. [[slnc 400]] This video explains the generic static array, in C. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] C has no type parameters. [[slnc 300]] So a generic array is a block of bytes, with an element size, and comparison functions passed in. [[slnc 400]] It is exactly how the standard library's quick sort works. [[slnc 700]] Our example is a weather station's week, stored three different ways by the same code. [[slnc 400]] By the end, you will know how to hold any type in C, how comparison functions work, and what it costs."""

[[scene]]
key = "02-idea"
kind = "structure"
title = "The Everyday Idea"
caption = "The caretaker knows only the box size; a helper compares the contents"
picture = { type = "array", cells = ["box", "box", "box", "box", ""], size = 4, pointers = [[3, "3 x 12 cm"]], title = "lockers for boxes 12 cm wide" }
narration = """Picture a row of identical lockers, and a caretaker who is told only one thing: every box here is twelve centimetres wide. [[slnc 400]] The caretaker finds locker three at once, three times twelve centimetres along. [[slnc 400]] And can move boxes along, without knowing what is inside. [[slnc 500]] To compare two boxes, the caretaker needs a helper who knows the contents. [[slnc 400]] That helper is the comparison function."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["void *: a pointer to memory of unknown type", "elem_size: bytes per element, from sizeof", "memcpy: copy bytes without knowing their type", "compare(a, b): negative, zero or positive", "", "type safety: what void * gives up"]
narration = """The words. [[slnc 400]] Void pointer: a pointer to memory of unknown type. [[slnc 400]] Element size: how many bytes one element takes. [[slnc 400]] Mem copy: copies bytes without knowing what they mean. [[slnc 400]] A comparison function returns negative, zero, or positive. [[slnc 500]] And type safety is what the void pointer gives up."""

