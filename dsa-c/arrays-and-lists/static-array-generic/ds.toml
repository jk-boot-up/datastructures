method = "generic_array#element_at"
note = """The whole idea in one line. `data` is an `unsigned char *`, so adding to it counts in bytes: element i is `i x elem_size` bytes from the start. This is what the compiler does for you with `arr[i]` when it knows the type; here the code does it by hand."""
[[listing]]
op = "Insertion"
method = "generic_array#insert_at"
note = """The same shift as the int version, from the end down to `pos`, but each shift is a `memcpy` of `elem_size` bytes, because the array does not know what the bytes mean."""
[[listing]]
op = "Linear search with a comparison function"
