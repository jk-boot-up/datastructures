pros = [
  "One implementation for every element type, as `qsort` and `bsearch` do it.",
  "O(1) access and every other cost of the static array.",
  "Each type brings its own order through the comparison function passed in.",
]
cons = [
  "No type safety: the compiler cannot catch a wrong type passed through `void *`.",
  "A function call for every comparison, and `memcpy` for every move: slower than working on `int`s directly.",
  "Casting inside comparison functions is easy to get wrong, especially for arrays of pointers.",
  "The capacity is still fixed; a full array overflows.",
]

[[mistake]]
mistake = "The wrong element size"
happens = "`create(&a, 10, sizeof(Reading *))` instead of `sizeof(Reading)` makes every element 8 bytes: structs are cut short and neighbours overwrite each other."
fix = "Pass `sizeof` of the element type itself."
[[mistake]]
mistake = "One dereference too few in a comparison of pointers"
happens = "In an array of `char *`, treating `a` as the text (`strcmp(a, b)`) compares the bytes of the pointers, not the strings."
fix = "Convert to `const char *const *` and dereference once: `strcmp(*(const char *const *) a, *(const char *const *) b)`."
[[mistake]]
mistake = "Returning x - y from a comparison"
happens = "For large values of opposite sign, `x - y` overflows `int` and the sign is wrong."
fix = "Return `(x > y) - (x < y)`."
[[mistake]]
mistake = "Comparing strings with `==`"
happens = "`==` compares addresses, so equal text stored in two places is reported as different."
fix = "Use `strcmp`, through the comparison function."

[[exercise]]
level = "easy"
question = """Write `int count_equal(GenericArray *a, const void *key, CompareFn compare)`, which counts the elements equal to `key`. Why does it need the comparison function?"""
answer = """```c
int count_equal(GenericArray *a, const void *key, CompareFn compare) {
    int count = 0;
    for (int i = 0; i < a->n; i++) {
        if (compare(element_at(a, i), key) == 0) count++;
    }
    return count;
}
```
The array does not know what its bytes mean, so only the comparison function can say whether two elements are equal. O(n) time, O(1) space."""
[[exercise]]
level = "medium"
question = """Write `int compare_reading_by_day(const void *a, const void *b)` that orders readings by day name. What does `find_max` then return on the week, and did you change `generic_array.c`?"""
answer = """```c
int compare_reading_by_day(const void *a, const void *b) {
    const Reading *x = a, *y = b;
    return strcmp(x->day, y->day);
}
```
`find_max(&week, compare_reading_by_day)` returns the reading whose day name is last alphabetically, "Wed" (19 C). `generic_array.c` is unchanged: the order lives entirely in the function passed in."""
[[exercise]]
level = "harder"
question = """Sort the readings by temperature with the standard library's `qsort`, then find 24 C with `bsearch`. What do `qsort` and `bsearch` need that `GenericArray` already has?"""
answer = """```c
qsort(week.data, week.n, week.elem_size, compare_reading);
Reading key = {"", 24};
Reading *hit = bsearch(&key, week.data, week.n, week.elem_size, compare_reading);
```
Both take the same three things `GenericArray` keeps: the block (`data`), the number of elements and the element size, plus a comparison function. After sorting, `hit` points at "Fri 24 C". O(n log n) to sort, O(log n) to search."""

