[project]
slug = "static-array-generic"
category = "arrays-and-lists"
title = "Static Array (Generic)"
package = "generic_array"
main_class = "demo"
example = "One week of temperatures held as ints, as day names and as readings"
tagline = "One array for any type, the C way"
bold = "A generic static array in C is a block of bytes and an element size: element i starts at data + i x elem_size, elements are copied in and out with memcpy, and comparisons are done by a function pointer, exactly as qsort and bsearch work; every cost of the static array is unchanged, and the price is that the compiler can no longer check the element type."
analogy_short = "A row of equal lockers that holds whatever size of box you declare"
jdk = "`qsort` and `bsearch` in `<stdlib.h>`, which take the same three things: a `void *` block, an element size and a comparison function"
thumb_lines = ["STATIC ARRAY", "GENERIC void *"]
thumb_code = "data + i * elem_size"
youtube_title = "Generic Static Array in C - void *, Element Size and Comparison Functions"
youtube_tags = ["generic array in c", "void pointer", "function pointer", "qsort", "memcpy", "static array"]
youtube_description = """Generic Static Array in C, explained with one week of temperatures stored three ways by the same code: as ints, as day names (char pointers), and as Reading structs of our own. We see what the array really is, a block of bytes and an element size, and compute the address of element 3 by hand: data + 3 x 12. We search with comparison functions, the way qsort and bsearch do, and see why strcmp finds a day name typed by the user while == compares addresses and fails. We insert and delete with shifts of whole elements, hit the overflow, and finish with one find_max giving the hottest reading or the last day name, depending only on the comparison function passed in. The int-only version is the Static Array project."""

[readme]
intro = """A **generic static array** in C holds elements of **any type** with one set of functions. C has no type parameters, so it does what the C standard library itself does in `qsort` and `bsearch`: the array is a block of **bytes** with an **element size**, `elem_size`, given when it is created (`sizeof(int)`, `sizeof(Reading)`). Element i starts at `data + i x elem_size`, so access is still one address calculation. Elements are copied in and out with **`memcpy`**, and anything that must compare two elements is given a **comparison function**, `int compare(const void *a, const void *b)`, which returns negative, zero or positive. The array's structure and every cost are those of the `static-array` project. What changes is who knows the type: only the comparison and print functions do. The compiler cannot check that the right type is passed through `void *`, and that loss of type safety is the price of the approach."""
analogy = """Picture a row of identical lockers where the caretaker is told only one thing: every box stored here is 12 centimetres wide. The caretaker can find locker 3 at once, 3 x 12 centimetres from the start, and can move boxes along, without ever knowing what is inside them. To answer "is this the box of the fountain?" the caretaker needs someone who knows the contents: a helper you hand over, who compares two boxes. Hand over the wrong helper, or a box of the wrong size, and the caretaker cannot tell."""
example = """The weather station stores its week three ways with the same functions: the temperatures as `int`s, the day names as `char *` pointers to text, and each day as a `Reading` struct with a day name and a temperature. The demo computes an element's address by hand, searches each array with its own comparison function, inserts and deletes readings, and runs the same `find_max` with two different comparison functions."""
why = """Without a generic array, a C program needs one array implementation per element type, all with the same loops. With `void *`, an element size and comparison functions, one implementation serves every type, which is exactly why `qsort` and `bsearch` are written that way. Understanding it explains the standard library, callback functions, and why C code must be careful about types."""
when_use = [
  "The same structure is needed for several element types, in C.",
  "The element types are plain data that can be copied with `memcpy`, such as numbers, structs, or pointers.",
  "You are calling `qsort` or `bsearch` and want to know what they do inside.",
]
when_not = [
  "Only one element type is ever used: the plain `static-array` version is simpler and type-checked.",
  "Speed on large amounts of plain numbers matters most: a call through a function pointer for every comparison costs time.",
  "The number of elements changes: use a dynamic array (`dynamic-array-generic`).",
]
met_before = [
  "`qsort(base, n, size, compare)` and `bsearch(key, base, n, size, compare)` in `<stdlib.h>`.",
  "`memcpy(dest, src, n)` in `<string.h>`.",
  "Callbacks: any function that takes another function as a parameter.",
]

[[word]]
term = "void *"
meaning = "A pointer to memory of unknown type. Any object pointer converts to it; to use the memory, it must be converted back to the right type."
[[word]]
term = "element size"
meaning = "`elem_size`: how many bytes one element takes, from `sizeof`. Element i starts at `data + i x elem_size`."
[[word]]
term = "memcpy"
meaning = "Copies a given number of bytes from one place to another; used to move elements whose type the array does not know."
[[word]]
term = "comparison function"
meaning = "`int compare(const void *a, const void *b)`: negative if a comes first, zero if equal, positive if a comes after, as `qsort` expects."
[[word]]
term = "function pointer"
meaning = "A variable holding the address of a function, such as `CompareFn compare`; calling `compare(x, y)` runs whichever function was passed."
[[word]]
term = "type safety"
meaning = "The compiler checking that values have the types the code expects. Through `void *`, it cannot."

