detail = """The array knows only the element size: 4 bytes for an `int`, 8 for a `char *` on a 64-bit machine, 12 for a `Reading`. Element 3 of the readings is at `data + 3 x 12 = data + 36`: the address calculation that `arr[3]` does automatically, done here by hand. Copying an array copies bytes. For the names, those bytes are pointers, so after `copy_with_capacity` both arrays point at the very same text: 7 elements copied, and no string was duplicated."""
speech = """What does the array really hold? [[slnc 400]] Bytes, and an element size. [[slnc 400]] Four bytes for an integer, eight for a pointer to text, twelve for a reading. [[slnc 500]] Element three of the readings starts three times twelve bytes from the beginning: byte thirty six. [[slnc 500]] And copying the array of names copies the pointers, so both arrays point at the same text."""
