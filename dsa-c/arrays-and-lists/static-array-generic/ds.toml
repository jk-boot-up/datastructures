title = "Common Mistakes"
body = ["the wrong element size", "one dereference too few for pointers", "returning x - y from a comparison", "comparing strings with =="]
narration = """Four mistakes to watch for. [[slnc 400]] Passing the wrong element size, such as the size of a pointer instead of the struct. [[slnc 400]] In an array of pointers, forgetting to dereference once in the comparison. [[slnc 400]] Returning x minus y, which can overflow. [[slnc 400]] And comparing strings with double equals."""

