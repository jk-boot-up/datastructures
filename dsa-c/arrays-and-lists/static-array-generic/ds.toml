[[scene]]
key = "costs"
kind = "bullets"
title = "Time and Space Complexity"
body = ["access, update: O(1)", "traverse, linear search, max, reverse: O(n)", "binary search (sorted): O(log n)", "insert, delete: O(n) at the front", "", "the same as the int array, plus a call per comparison"]
narration = """Here are the costs. [[slnc 400]] They are the same as the int array. [[slnc 400]] Access and update are order one. [[slnc 400]] Traversal, linear search, maximum and reverse are order n. [[slnc 400]] Binary search is order log n. [[slnc 400]] Insertion and deletion at the front are order n. [[slnc 500]] Each comparison is now a function call, which costs a little time."""

[[scene]]
key = "compare"
kind = "bullets"
title = "Compared With Related Structures"
body = ["int array: typed, checked, direct ==", "generic array: any type, no checks", "Java generics: any type, checked by the compiler", "", "static: fixed; dynamic generic: grows"]
narration = """How does it compare? [[slnc 400]] The int array is typed, and the compiler checks it. [[slnc 400]] The generic array holds any type, and the compiler cannot check it. [[slnc 400]] Java's generics hold any type and are checked, because the language has type parameters. [[slnc 400]] And like every static array, the capacity is fixed."""

