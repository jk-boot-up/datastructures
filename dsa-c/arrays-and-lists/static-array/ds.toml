]

[[mistake]]
mistake = "Counting indexes from 1"
happens = "Monday is read from `arr[1]` and skipped, and the last read goes past the end."
fix = "The first index is 0 and the last is n - 1."
[[mistake]]
mistake = "Looping with `i <= n`"
happens = "The last pass reads `arr[n]`, beyond the elements (or beyond the array, which in C is undefined behaviour: it may read garbage or crash)."
fix = "Loop with `i < n`."
[[mistake]]
mistake = "Shifting in the wrong direction on insertion"
happens = "Shifting from `pos` upwards copies `arr[pos]` into every later place, overwriting the data."
fix = "Insertion shifts from the end down to `pos`; deletion shifts from `pos` up to the end."
[[mistake]]
mistake = "Binary search on unsorted data"
happens = "It discards the half that actually holds the key and reports -1."
fix = "Sort first, or use linear search."
[[mistake]]
mistake = "`mid = (low + high) / 2`"
happens = "For very large arrays `low + high` overflows `int` and becomes negative."
fix = "`mid = low + (high - low) / 2`."

[[exercise]]
level = "easy"
question = """Write `int count_above(StaticArray *a, int limit)` that returns how many elements are greater than `limit`. What is its time and space complexity?"""
answer = """```c
int count_above(StaticArray *a, int limit) {
    int count = 0;
    for (int i = 0; i < a->n; i++) {
        if (a->arr[i] > limit) count++;
    }
    return count;
}
```
One pass over n elements: O(n) time, O(1) extra space (one counter)."""
[[exercise]]
level = "medium"
question = """Write `Status insert_sorted(StaticArray *a, int x)`, which inserts `x` into an array that is sorted ascending so that it stays sorted. How many shifts does inserting 22 into [19, 20, 21, 23, 24, 25, 26] take?"""
answer = """```c
Status insert_sorted(StaticArray *a, int x) {
    if (a->n == a->capacity) return STATUS_OVERFLOW;
    int i = a->n - 1;
    while (i >= 0 && a->arr[i] > x) {
        a->arr[i + 1] = a->arr[i];
        i--;
    }
    a->arr[i + 1] = x;
    a->n++;
    return STATUS_OK;
}
```
It shifts every element greater than x one place right, starting from the end: 23, 24, 25 and 26, four shifts, then stores 22 at index 3. This is also the inner step of insertion sort."""
[[exercise]]
level = "harder"
question = """Binary search in this project returns any index holding the key. Write `int first_occurrence(StaticArray *a, int key)` that returns the lowest index holding `key` in a sorted array with duplicates, still in O(log n)."""
answer = """```c
int first_occurrence(StaticArray *a, int key) {
    int low = 0, high = a->n - 1, result = -1;
    while (low <= high) {
        int mid = low + (high - low) / 2;
        if (a->arr[mid] == key) {
            result = mid;          /* remember it, but keep looking to the left */
            high = mid - 1;
        } else if (a->arr[mid] < key) {
            low = mid + 1;
        } else {
            high = mid - 1;
        }
    }
    return result;
}
```
When the middle equals the key, it is recorded and the search continues in the left half, so the loop still halves the range each time: O(log n)."""

