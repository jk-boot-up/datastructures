[docs.session]
objectives = [
  "Explain why access by index is O(1), using base address + i x size.",
  "Implement insertion and deletion with shifts in the correct direction.",
  "Implement linear and binary search, and state their best, average and worst cases.",
  "Compare the static array with the dynamic array and the linked list.",
]
walkthrough = """Start with the lockers analogy and draw ten boxes with indexes. Run the demo; in act two, compute the address of arr[3] on the board. In act three, trace linear search and then binary search on the sorted week, counting comparisons. In act four, perform insert_at(2, 18) on paper, shifting from the end, and ask what goes wrong when shifting from the front. Finish with the complexity table and the comparison table, and point to the static-array-recursive project for the same operations written recursively."""

[docs.explained]
sentence = """A static array stores elements of one type in consecutive memory locations, so arr[i] is found in O(1) by base address + i x element size, while its capacity is fixed, insertion and deletion shift elements in O(n), and a full array overflows."""
verdict = """Use a static array when the number of elements is known and access by index matters: it is the fastest and smallest structure there is, and binary search makes sorted data quick to search. When the size changes, use a dynamic array; when you insert and delete at the front often, a linked list; when you look things up by key, a hash table."""
recognise = [
  "`int arr[MAX];` (or a block from `malloc`) with a separate count `n` of elements in use.",
  "Loops `for (int i = n - 1; i >= pos; i--) arr[i + 1] = arr[i];` (insertion) and the mirror loop (deletion).",
  "`low`, `high` and `mid` variables: binary search.",
]

[spec]
purpose = """Teach the static array with the operations of a data-structures textbook, written iteratively, with the time and space complexity of each."""
requirements = [
  "Written by hand on a block of `int`s taken once with `malloc`: no libraries.",
  "Fixed capacity; n elements in arr[0..n-1]; overflow and underflow reported.",
  "traverse, get, update, insert_at, delete_at, linear_search, binary_search, find_max, sum, reverse, copy_with_capacity, all iterative.",
  "Pure textbook code: nothing in the structure measures itself; the demo works its counts out from what the operations return.",
  "The demo prints five acts whose numbers the tests assert.",
]
nongoals = ["Recursive versions (the static-array-recursive project)", "Generic element types (the static-array-generic project)", "Growing automatically (the dynamic-array project)"]

