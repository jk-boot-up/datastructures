# ds.toml: everything about this project that is not C code.
# tools/dskit turns it into the README, docs, pictures, animation and video scenes.

[project]
slug = "static-array"
category = "arrays-and-lists"
title = "Static Array"
package = "static_array"
main_class = "demo"
example = "A week of daily temperatures, one element per day"
tagline = "Any element in one step"
bold = "A static array stores its elements in consecutive memory locations, so arr[i] is found by one address calculation in O(1); its capacity is fixed when it is created, so insertion and deletion shift elements and a full array overflows."
analogy_short = "A row of numbered lockers"
jdk = "C's own arrays (`int arr[MAX]`), and `qsort` and `bsearch` in `<stdlib.h>` for sorting and binary search"
thumb_lines = ["STATIC", "ARRAY"]
thumb_code = "arr[i]  O(1)"
youtube_title = "Static Array in C - Operations and Complexity"
youtube_tags = ["static array", "array operations", "linear search", "binary search", "array insertion deletion", "time complexity"]
youtube_description = """Static Array in C, explained with a week of daily temperatures stored in int arr[10] with n = 7 elements. We start with seven separate variables and see why every question needs code written out by hand, then store the week in one array and compute the address of arr[3] with base + i x size. We count the real cost of each textbook operation: access and update in one step, linear search in n comparisons, binary search on a sorted array in 3, insertion and deletion shifting 5 and 7 elements, and an overflow when the array is full. We finish with binary search on a million elements in 20 comparisons and the bill: a capacity that never changes. Every operation here is iterative, using O(1) extra space."""

[readme]
intro = """A **static array** is a collection of elements of the same type stored in **consecutive memory locations**, each identified by an **index** from 0 to `capacity - 1`. In C it is `int arr[MAX]`, or a block of `capacity` ints taken once with `malloc`. Because the elements are consecutive, the address of `arr[i]` is computed as `base address + i x element size`, so any element is reached in O(1). The capacity is fixed when the array is created. This project keeps `n` elements in `arr[0..n-1]` and implements the operations a data-structures textbook lists for arrays: traversal, access, update, insertion, deletion, linear search, binary search, finding the maximum, and reversal. Every operation is written iteratively, with loops; the `static-array-recursive` project writes the same operations recursively."""
analogy = """Picture a row of numbered lockers in a school corridor: locker 0, locker 1, locker 2, all the same size and all touching. If someone says "open locker 3", you do not search; you walk straight to it, because you know where locker 3 is. That is array access by index. To fit a new locker into the middle, every locker after it would have to move one place along, and the corridor has a fixed length: when it is full, there is no room for another."""
example = """A weather station records one temperature a day, in whole degrees Celsius. The week is stored in `int arr[10]`: Monday at index 0 through Sunday at index 6, so n = 7, with 3 spare places for corrections. The demo asks the station's questions: the temperature on a given day, correcting a reading, whether it ever reached 24 or 30 degrees, inserting a late reading, deleting a wrong one, and what happens when the array fills up."""
why = """Without an array, seven days are seven separate variables, and every question has to name them all: finding the maximum needs six comparisons written out by hand, and "the temperature on day 3" needs a switch with a branch for each day. An array gives the seven values one name and an index, so one loop answers every question for 7 values or 7 million, and any single value is one address calculation away."""
when_use = [
  "The number of elements is known in advance and does not change much.",
  "You access elements by index, and need that access to be O(1).",
  "Memory must be compact: an array stores nothing but the elements.",
  "The data is sorted and searched often: binary search needs O(1) access to the middle.",
]
when_not = [
  "The number of elements grows without a known limit: use a dynamic array.",
  "You insert or delete at the front or middle often: every later element shifts; a linked list does it in O(1) once positioned.",
  "Elements are looked up by a key rather than an index: use a hash table.",
]
met_before = [
  "`char *argv[]` in every C `main` function.",
  "Pixels of an image, the squares of a chess board, the days of a month.",
  "Inside C's `ArrayList`, `HashMap` and `ArrayDeque`, which all store their data in arrays.",
]

