[[scene]]
key = "01-poster"
kind = "poster"
title = "Static Array"
narration = """Hello, and welcome. [[slnc 400]] This video explains the static array, in C. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A static array stores elements of the same type in consecutive memory locations. [[slnc 300]] Each element has an index, starting from zero. [[slnc 400]] Because the elements are consecutive, the address of any element is calculated in one step. [[slnc 400]] And the capacity is fixed when the array is created. [[slnc 700]] Our example is a weather station, storing one temperature a day. [[slnc 400]] By the end, you will know every textbook array operation, what each one costs in time and in space, and how the array compares with a dynamic array and a linked list."""

[[scene]]
key = "02-idea"
kind = "structure"
title = "The Everyday Idea"
caption = "A row of numbered lockers: walk straight to locker 3"
picture = { type = "array", cells = ["", "", "", "", "", "", ""], size = 7, marks = { "3" = "hi" }, pointers = [[3, "locker 3"]], title = "seven lockers, numbered from 0" }
narration = """Think of a row of numbered lockers in a school corridor. [[slnc 400]] Locker zero, locker one, locker two, all the same size and all touching. [[slnc 400]] If someone says, open locker three, you do not search. [[slnc 300]] You walk straight to it. [[slnc 500]] But to fit a new locker into the middle, every locker after it would have to move. [[slnc 400]] And when the corridor is full, there is no room for another. [[slnc 500]] That is an array."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["index: 0 to capacity - 1", "base address: where arr[0] starts", "capacity (MAX): places, fixed", "n: elements stored, arr[0..n-1]", "", "overflow: insert into a full array", "underflow: delete from an empty one"]
narration = """The words a textbook uses. [[slnc 400]] An index is an element's position, from zero. [[slnc 400]] The base address is where element zero starts in memory. [[slnc 400]] The capacity is the number of places, fixed when the array is created. [[slnc 300]] And n is the number of elements actually stored. [[slnc 500]] Inserting into a full array is an overflow. [[slnc 300]] Deleting from an empty one is an underflow."""

[[scene]]
key = "acts"
kind = "acts"
title = "acts"
narration = ""

[[scene]]
key = "costs"
kind = "bullets"
title = "Time and Space Complexity"
body = ["access, update: O(1)", "traverse, linear search, max, reverse: O(n)", "binary search (sorted): O(log n)", "insert, delete: O(n) at the front, O(1) at the end", "", "extra space: O(1) for every loop"]
narration = """Here are the costs in time and space. [[slnc 400]] Access and update are order one. [[slnc 400]] Traversal, linear search, finding the maximum, and reversal are order n. [[slnc 400]] Binary search on a sorted array is order log n. [[slnc 400]] Insertion and deletion are order n at the front, because of the shifts, and order one at the end. [[slnc 500]] And every operation here is a loop, so the extra space is order one."""

[[scene]]
key = "compare"
kind = "bullets"
title = "Compared With Related Structures"
body = ["access i: array O(1), linked list O(n)", "insert at front: array O(n), linked list O(1)", "size: static fixed, dynamic grows by copying", "memory: array consecutive, list scattered with pointers", "", "sorted search: only arrays can binary search"]
narration = """How does the static array compare? [[slnc 400]] Access by index is order one in an array, and order n in a linked list. [[slnc 400]] Insertion at the front is order n in an array, and order one in a linked list. [[slnc 400]] A static array's size is fixed, while a dynamic array grows by copying. [[slnc 400]] And only an array can binary search, because only an array can jump to its middle."""

[[scene]]
key = "mistakes"
kind = "bullets"
title = "Common Mistakes"
body = ["indexes from 1: the first index is 0", "i <= n: one past the last element", "shifting the wrong way on insertion", "binary search on unsorted data", "mid = (low + high) / 2 can overflow"]
narration = """Five mistakes to watch for. [[slnc 400]] Counting indexes from one. [[slnc 400]] Looping while i is less than or equal to n, which goes one past the last element. [[slnc 400]] Shifting in the wrong direction on insertion, which overwrites the data. [[slnc 400]] Binary search on unsorted data. [[slnc 400]] And computing the middle as low plus high over two, which can overflow."""

