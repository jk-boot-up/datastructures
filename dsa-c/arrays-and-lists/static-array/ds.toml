# ---------------------------------------------------------------- act 5
[[act]]
title = "The bill"
summary = "Binary search on 1,000,000 elements: 20 comparisons; linear search: 1,000,000, with O(1) extra space; growing from 7 to 31 places means a new array and 7 copies."
detail = """The strengths and the costs show at scale. On a million sorted elements, binary search needs only 20 comparisons, while linear search needs a million; both use O(1) extra space, because they are loops that keep only a few index variables. The capacity is the cost: to hold a month instead of a week, the array cannot grow in place, so a new array of 31 places is allocated and the 7 elements copied across. C's own `int arr[n]` is this structure; the standard library's `realloc` does the grow-by-copying above for memory taken with `malloc`, and `qsort` and `bsearch` sort and binary search. The same operations written recursively are in the `static-array-recursive` project."""
speech = """And the bill. [[slnc 400]] On a million sorted elements, binary search needs twenty comparisons. [[slnc 300]] Linear search needs a million. [[slnc 400]] Both are loops, so both use only a few extra variables: order one extra space. [[slnc 500]] And the capacity never changes. [[slnc 300]] To grow from seven to thirty one places, we allocate a new array and copy every element."""
