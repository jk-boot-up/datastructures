listing_intro = """These are the five operations every textbook array chapter shows, exactly as they appear in `src/static_array.c`. Each is a loop, and each uses O(1) extra space: a few index variables, whatever the size of the array."""
[[listing]]
op = "Traversal"
method = "static_array#traverse"
note = """One loop from 0 to n - 1: every element is visited exactly once, so traversal is O(n) time and O(1) space."""
[[listing]]
op = "Insertion at a position"
method = "static_array#insert_at"
note = """The loop runs from the last element down to `pos`, so each element moves into the empty place to its right; running it from `pos` upwards would overwrite elements before they are moved. The number of shifts is n - pos: the whole array for pos = 0, nothing for pos = n."""
[[listing]]
op = "Deletion at a position"
method = "static_array#delete_at"
note = """The mirror image of insertion: the loop runs upwards from `pos`, each element moving into the place to its left, n - pos - 1 shifts."""
[[listing]]
op = "Linear search"
method = "static_array#linear_search"
note = """Compare with each element in turn and stop at the first match: 1 comparison in the best case, n in the worst, and n when the key is absent."""
[[listing]]
op = "Binary search"
method = "static_array#binary_search"
note = """Only for a sorted array. Each comparison with the middle element discards half of the remaining range, so at most about log2(n) + 1 comparisons: 20 for a million elements. `mid` is computed as `low + (high - low) / 2`, because `(low + high) / 2` can overflow when both are large."""

