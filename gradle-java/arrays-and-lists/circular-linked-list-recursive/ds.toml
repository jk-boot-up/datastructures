# ---------------------------------------------------------------- act 1
[[act]]
title = "The base case is last, not null"
summary = "count(Ann) = 1 + count(Ben), and so on until count(Dan) = 1, because Dan is last: count() = 4 at depth 4."
detail = """Counting recursively round the table: `count(Ann) = 1 + count(Ben)`, `count(Ben) = 1 + count(Cat)`, `count(Cat) = 1 + count(Dan)`. Dan is `last`, the end of the lap, so `count(Dan)` is simply 1: the base case. The answer is 4, with four calls waiting at the deepest point. A recursion written for a straight list, waiting for `null`, would go round the circle for ever and overflow the call stack."""
speech = """First, the base case. [[slnc 400]] Count of Ann is one, plus count of Ben. [[slnc 300]] Count of Ben is one, plus count of Cat. [[slnc 300]] And so on, to Dan. [[slnc 400]] Dan is last, the end of the lap. [[slnc 300]] So count of Dan is just one. [[slnc 500]] In a circle there is no null. [[slnc 300]] A recursion waiting for null would go round for ever."""
