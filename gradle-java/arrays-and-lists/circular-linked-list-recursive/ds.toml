# ---------------------------------------------------------------- act 3
[[act]]
title = "Find recursively, link in O(1)"
summary = "search(\"Dan\"): 5 comparisons, depth 5; insertAtPosition(3): depth 2; deleteByKey(\"Cat\"): 5 comparisons, depth 5; deleteAtEnd: the node before last at depth 4."
detail = """Operations inside the circle find their node recursively and then link it. `search("Dan")` compares five players, five calls deep. `insertAtPosition(3, "Gus")` finds Ben, the node before the position, two calls deep, and links Gus with two pointers. `deleteByKey("Cat")` looks for the node before Cat, starting from `last`: five comparisons. `deleteAtEnd` finds Dan, the node before Fay, four calls deep; Dan then points to Eve and becomes `last`."""
speech = """Inside the circle, find first, then link. [[slnc 400]] Search for Dan: five comparisons, five calls deep. [[slnc 400]] Insert Gus at position three: the node before found two calls deep. [[slnc 400]] Delete Cat: five comparisons. [[slnc 400]] Delete at the end: the node before last found four calls deep."""
console = [["search(\"Dan\") = position 4: 5 comparisons, depth 5", "amber"], ["insertAtPosition(3, \"Gus\"): the node before found at depth 2, 2 pointers changed", "ok"], ["deleteByKey(\"Cat\"): 5 comparisons, depth 5", "ok"], ["deleteAtEnd() removed Fay: the node before last found at depth 4", "amber"], ["Eve -> Ann -> Ben -> Gus -> Dan -> (back to Eve)", "muted"]]
[[act.frame]]
caption = "After the changes: Gus in, Cat and Fay out; Dan is last"
say = """Here is the table now. [[slnc 300]] Dan is last, and points back to Eve."""
