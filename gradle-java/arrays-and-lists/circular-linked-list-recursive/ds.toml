[project]
slug = "circular-linked-list-recursive"
category = "arrays-and-lists"
title = "Circular Linked List (Recursive)"
package = "circularlinkedlistrecursive"
main_class = "RecursiveCircularLinkedListDemo"
example = "Players round a board game, every lap walked recursively"
tagline = "A recursion that stops at last, not null"
bold = "A recursion over a circular linked list cannot stop at null, because there is none: its base case is reaching last, the end of one lap; work at both ends needs no recursion, finding a node is recursive, and the counting-out winner has a recursive formula of its own."
analogy_short = "Asking round the table until the question comes back to the dealer"
jdk = "Nothing: no circular list in `java.util`"
thumb_lines = ["CIRCULAR LIST", "RECURSIVE"]
thumb_code = "node == last ? 1 : ..."
youtube_title = "Circular Linked List in Java, Recursively - Base Case, Laps and Josephus"
youtube_tags = ["circular linked list", "recursion", "josephus problem", "base case", "call stack", "stack overflow"]
youtube_description = """Circular Linked List in Java, written recursively, explained with players taking turns round a board game. We trace count(Ann) = 1 + count(Ben) round the table and see why the base case must be reaching last, the end of one lap: a recursion waiting for null would never stop. We display one lap recursively, insert at both ends with no recursion, and find nodes recursively before linking them in O(1): search, insertAtPosition, deleteByKey and deleteAtEnd, each with its depth. Then we solve the counting-out game without the list, by the recursive Josephus formula J(n) = (J(n - 1) + k) mod n, and finish at the limit: counting a million players recursively throws a real StackOverflowError."""

[readme]
intro = """A **circular linked list** points its last node back to its first and keeps a single pointer, **last**; the first node is `last.next`. This project writes its walks **recursively**. The important difference from other lists is the **base case**: there is no `null` in a circle, so a recursion stops when it reaches **last**, the end of one **lap**. Work at the beginning and the end needs no recursion. Finding a node (to search, to insert at a position, to delete by key, or to find the node before last) is recursive, and linking it is O(1). The counting-out game gets a second, recursive solution: the **Josephus formula**, which finds the winner without building the circle at all. Every recursive lap uses one call-stack frame per node."""
analogy = """Picture the players round the table, and the dealer wants to know how many are playing. The dealer asks the player on the left, "how many from you round to me?", and waits. Each player asks the next and waits. The player just before the dealer, the last one, answers "one: just me", and does not ask further: that is the base case. If the players waited for someone with nobody to their left, the question would go round for ever."""
example = """The board game from `circular-linked-list`: Ann, Ben, Cat and Dan round the table, then Eve, Fay and Gus. The demo traces a recursive count, displays one lap, works at both ends, searches, inserts, deletes by key and at the end recursively, solves counting-out by formula, and counts a million players."""
why = """Every recursion needs a base case the recursion is sure to reach. On a straight list that is `null`; on a circular list it cannot be, and choosing the wrong one means infinite recursion and a stack overflow. Writing the circular list recursively forces that choice into the open. The Josephus formula also shows that some problems stated on a circle have a recursive solution that needs no list at all."""
when_use = [
  "Learning how to choose a base case when there is no null.",
  "Short circles, such as the players at one table.",
  "The counting-out winner for any n, by the O(n) recursive formula.",
]
when_not = [
  "Long circles: one frame per node overflows the call stack. Use the do-while loops of `circular-linked-list`.",
]
met_before = [
  "`circular-linked-list`: the same structure with do-while loops.",
  "The Josephus problem, from recreational mathematics.",
]

