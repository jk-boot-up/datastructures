# ---------------------------------------------------------------- act 4
[[act]]
title = "Counting out, by a recursive formula"
summary = "J(1) = 0, J(n) = (J(n - 1) + k) mod n gives position 3, Dan, for 5 players and k = 3, depth 5; for 41 players, position 30, depth 41."
detail = """The counting-out game can be solved without the circle. With one player, the winner is at position 0. With n players, the first to leave is at position k - 1, and the game carries on with n - 1 players starting just after; so the winner is J(n - 1) places further on, wrapped round with mod n. For five players and k = 3 the formula gives position 3: Dan, the same winner the list simulation finds. For 41 players it gives position 30, the classic answer, 41 calls deep."""
speech = """The counting-out game has a recursive formula. [[slnc 400]] With one player, the winner is at position zero. [[slnc 400]] With n players, the winner is the winner for n minus one, moved on k places, round the circle. [[slnc 500]] For five players, counting in threes, the formula says position three: Dan. [[slnc 400]] The same winner, without building the circle."""
