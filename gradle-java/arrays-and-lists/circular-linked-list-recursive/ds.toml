# ---------------------------------------------------------------- act 5
[[act]]
title = "The limit of recursion"
summary = "A million players joined with insertAtEnd (no recursion); a recursive count throws StackOverflowError."
detail = """A million `insertAtEnd` calls use `last` and never recurse. A recursive count of the million needs one frame per player in the lap, and Java throws `StackOverflowError`. The do-while loops of `circular-linked-list` go round in O(1) extra space, and the Josephus formula can be rewritten as a loop the same way."""
speech = """And the limit. [[slnc 400]] A million players join with no recursion. [[slnc 400]] Counting them recursively needs a million frames, and the stack overflows. [[slnc 400]] The loop version goes round with order one extra space."""
