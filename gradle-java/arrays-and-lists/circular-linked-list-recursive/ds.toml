listing_intro = """The recursive methods of the circular list. In each, the base case is reaching `last` (or the node wanted), never `null`."""
[[listing]]
op = "Count"
method = "RecursiveCircularLinkedList#count"
note = """`count(last)` is 1: the end of the lap. Every other node counts 1 plus the rest of the lap. Writing `if (node == null)` instead would never be true, and the recursion would go round until the call stack overflowed."""
[[listing]]
op = "Search"
method = "RecursiveCircularLinkedList#search"
note = """Two base cases: a match, and reaching `last` without one. The lap is searched once."""
[[listing]]
op = "Deletion at the end"
method = "RecursiveCircularLinkedList#deleteAtEnd,nodeBeforeLast"
note = """`nodeBeforeLast` recurses until the next node is `last`. That node points to the first node and becomes the new `last`: O(n), because a singly linked circle cannot step back."""
[[listing]]
op = "The Josephus formula"
method = "RecursiveCircularLinkedList#winnerPosition"
note = """With one player, the winner is at position 0. With n players, the first to leave is at position k - 1; the game then continues with n - 1 players starting just after, so the winner is J(n - 1) positions further on, wrapped round with mod n. No list is needed, and the recursion is n deep."""

