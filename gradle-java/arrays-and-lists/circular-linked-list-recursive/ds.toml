detail = """`display` appends each player and recurses on the next until it has appended `last`: one lap, four calls deep. Inserting "Eve" at the beginning and "Fay" at the end uses `last` and `last.next` directly: depth 0, 5 pointer changes."""
speech = """Display goes one lap, four calls deep, and stops at the last player. [[slnc 500]] Inserting at the beginning and at the end needs no recursion at all: the last pointer reaches both."""
console = [["display(): Ann -> Ben -> Cat -> Dan -> (back to Ann), depth 4", "ok"], ["insertAtBeginning(\"Eve\") and insertAtEnd(\"Fay\"): depth 0, 5 pointer changes", "ok"]]
[[act.frame]]
