# ---------------------------------------------------------------- act 3
[[act]]
title = "Turns, insertion and deletion"
summary = "6 turns in 6 steps; insertAtBeginning and insertAtEnd in 0 steps; insertAtPosition(3) in 2 steps; deleteAtBeginning 1 pointer; deleteAtEnd 4 steps; deleteByKey 4 comparisons."
detail = """Six turns take six steps, with no special case: after Dan comes Ann. `insertAtBeginning("Eve")` puts Eve between Dan and Ann: 2 pointer changes. `insertAtEnd("Fay")` does the same and then moves `last` on to Fay: 3 pointer changes, no walking. `insertAtPosition(3, "Gus")` walks 2 steps to Ben and links Gus in after Ben. `deleteAtBeginning` removes Eve by pointing `last` past Eve's node: 1 pointer. `deleteAtEnd` must find the node before Fay, walking 4 steps round from Ann to Dan, because a singly linked circle cannot step back. `deleteByKey("Cat")` goes round comparing: 4 comparisons, 1 pointer change."""
speech = """Now the textbook operations. [[slnc 400]] Six turns take six steps, with no special case. [[slnc 400]] Inserting at the beginning or at the end walks nowhere. [[slnc 300]] At the end, it inserts at the beginning, and then moves last on. [[slnc 500]] Deleting at the beginning changes one pointer. [[slnc 400]] But deleting at the end must walk round to the node before last."""
