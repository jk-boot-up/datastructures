[[scene]]
key = "01-poster"
kind = "poster"
title = "Circular Linked List"
narration = """Hello, and welcome. [[slnc 400]] This video explains the circular linked list, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A circular linked list is a linked list whose last node points back to the first. [[slnc 400]] There is no end, and no null. [[slnc 400]] The list keeps one pointer, to the last node, and the first node is the one after it. [[slnc 700]] Our example is players taking turns round a board game. [[slnc 400]] By the end, you will know every textbook operation on a circular list, what each one costs, and the loop that never stops."""

[[scene]]
key = "02-idea"
kind = "structure"
title = "The Everyday Idea"
caption = "Friends round a table: after the last seat, the dice carry on to the first"
picture = { type = "linked", nodes = ["Ann", "Ben", "Cat", "Dan"], circular = true, pointers = [[0, "dice"]] }
narration = """Picture friends sitting round a table, playing a board game. [[slnc 400]] When your turn ends, you pass the dice to your left. [[slnc 400]] After the last person, the dice simply carry on to the first person again. [[slnc 400]] A circle has no last seat. [[slnc 500]] Nobody ever has to say, we have reached the end, go back to the start. [[slnc 500]] That is a circular linked list."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["circular: the last node's next is the first", "last: the only pointer the list keeps", "first node = last.next", "do-while: stop when back at the start"]
narration = """The words. [[slnc 400]] Circular: the last node's next pointer is the first node. [[slnc 400]] Last is the only pointer the list keeps. [[slnc 400]] The first node is last dot next. [[slnc 400]] And a traversal is a do while loop, which stops when it is back at the start."""

