speech = """What if a loop waits for null? [[slnc 400]] There is none. [[slnc 300]] The loop went round and round, a thousand steps, until it was stopped. [[slnc 500]] A circular list is traversed with a do while loop, which stops when it is back at the start. [[slnc 400]] And a list of one node points to itself."""
