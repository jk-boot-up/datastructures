narration = """That's the circular linked list. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] The last node points back to the first, so one pointer reaches both ends, and every loop stops back where it started. [[slnc 500]] The full source code, written notes, pictures, and an animated walkthrough are all in the repository. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Find where to sit to win the counting-out game with every second player out. [[slnc 500]] If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching."""
