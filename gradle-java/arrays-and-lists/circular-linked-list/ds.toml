[[scene]]
key = "costs"
kind = "bullets"
title = "Time and Space Complexity"
body = ["insert at beginning or end: O(1)", "delete at beginning: O(1)", "delete at end: O(n), walk to the node before last", "search, display, count: O(n)", "", "next turn: O(1), never a special case"]
narration = """Here are the costs in time and space. [[slnc 400]] Inserting at the beginning or the end is order one. [[slnc 400]] Deleting at the beginning is order one. [[slnc 400]] Deleting at the end is order n, because the node before last must be found. [[slnc 400]] Search, display and count are order n. [[slnc 500]] And the next turn is always one step."""

[[scene]]
key = "compare"
kind = "bullets"
title = "Compared With Related Structures"
body = ["insert at end: circular O(1), singly O(n)", "delete at end: circular O(n), doubly O(1)", "after the last node: circular the first, others null", "", "loops: do-while back to the start, not null"]
narration = """How does it compare? [[slnc 400]] Inserting at the end is order one in a circular list, and order n in a singly list with only a head. [[slnc 400]] Deleting at the end is order n here, and order one in a doubly linked list. [[slnc 400]] After the last node, a circular list goes back to the first, where the others reach null."""

[[scene]]
key = "mistakes"
kind = "bullets"
title = "Common Mistakes"
body = ["while (current != null): never stops", "a while loop that checks first: never starts", "forgetting the one-node list", "deleting the last node without moving last"]
narration = """Four mistakes to watch for. [[slnc 400]] Waiting for null, which never comes. [[slnc 400]] A while loop that checks before its body, and so never starts. [[slnc 400]] Forgetting that a single node points to itself. [[slnc 400]] And deleting the last node without moving the last pointer."""

