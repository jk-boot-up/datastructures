listing_intro = """The operations that make a circular list different, exactly as they appear in `CircularLinkedList.java`. Everything hangs on one pointer, `last`, and on the fact that `last.next` is the first node."""
[[listing]]
op = "Insertion at the beginning"
method = "CircularLinkedList#insertAtBeginning"
note = """The new node goes between `last` and the old first node: it points to `last.next`, and `last` points to it. An empty list is the special case: the new node points to itself and becomes `last`."""
[[listing]]
op = "Insertion at the end"
method = "CircularLinkedList#insertAtEnd"
note = """The textbook trick: in a circle, the beginning and the end are the same place. Insert at the beginning, then move `last` on one node, and the new node is last instead of first. O(1)."""
[[listing]]
op = "Display"
method = "CircularLinkedList#display"
note = """There is no `null` to stop at, so the traversal is a do-while that starts at `last.next` and stops when it comes back to it. The body runs before the check, so a list of one node is displayed once."""
[[listing]]
op = "Deletion at the end"
method = "CircularLinkedList#deleteAtEnd"
note = """The one end operation that is not O(1): the node before `last` must point to the first node and become `last`, and in a singly linked circle it can only be found by walking round."""
[[listing]]
op = "The counting-out game"
method = "CircularLinkedList#countOut"
note = """`prev` counts k - 1 steps round the circle; the node after it is out, and `prev.next = gone.next` removes it. The circle never ends, so counting simply carries on past the last player."""

