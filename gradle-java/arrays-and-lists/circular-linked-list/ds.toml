[[act]]
title = "Counting out, and the bill"
summary = "Five players, every third out: Cat, Ann, Eve, Ben; winner Dan, in 8 steps and 4 pointer changes."
detail = """In the counting-out game, the players count round the circle and every third one leaves: Cat, then Ann, then Eve, then Ben, and Dan wins. Each removal is one pointer change, `prev.next = gone.next`, and the counting simply carries on past the last player, because there is no end: 8 steps and 4 pointer changes for the whole game. The bill: with no end to stop at, every traversal needs a starting node to come back to, and deleting at the end still walks. `java.util` has no circular linked list; `ArrayDeque` goes round a circular array instead."""
