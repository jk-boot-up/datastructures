[project]
slug = "circular-linked-list"
category = "arrays-and-lists"
title = "Circular Linked List"
package = "circularlinkedlist"
main_class = "CircularLinkedListDemo"
example = "Taking turns in a board game, round and round"
tagline = "A list with no end"
bold = "A circular linked list points its last node back at its first, so there is no end: moving on is always one step, which suits anything that goes round and round; the price is that nothing tells a loop when to stop."
analogy_short = "Players sitting round a table, passing the turn to the left"
jdk = "None in `java.util`; `ArrayDeque` goes round a circular array instead (see the circular buffer)"
thumb_lines = ["CIRCULAR", "LINKED LIST"]
thumb_code = "first = last.next"
youtube_title = "Circular Linked List in Java - Insertion, Deletion and the Counting-Out Game"
youtube_tags = ["circular linked list", "linked list java", "round robin", "josephus problem", "circular list buffer"]
youtube_description = """Circular Linked List in Java, explained with players taking turns round a board game. We start with the players in a straight line, where the turn falls off the end after the last player and a special case sends it back to the first. Then we join the ends by hand, as a C textbook does: the last node points back at the first, and the list keeps a single pointer, last, so the first node is last.next and both ends are one step away. We count the real cost of every textbook operation: turns with no special case, insertAtBeginning and insertAtEnd in O(1), insertAtPosition, deleteAtBeginning in one pointer change, deleteAtEnd walking round to the node before last, and deleteByKey. Then a loop waiting for null walks a thousand steps and never finds one, and a do-while traversal stops where it started. We finish with the counting-out game, every third player out until one is left."""

[readme]
intro = """A **circular linked list** is a linked list whose last node points back at its first. There is no `null` at the end, because there is no end: follow the pointers and you go round and round. It suits anything that takes turns, such as players round a table, tasks sharing a processor, or a playlist on repeat. As in C textbooks, the list keeps a single pointer, `last`, to the last node; the first node is `last.next`, so both ends are one step away, and insertion at the beginning and at the end are both O(1). It is built by hand with the textbook operations: insertAtBeginning, insertAtEnd, insertAtPosition, deleteAtBeginning, deleteAtEnd, deleteByKey, search, display and count."""
analogy = """Picture friends sitting round a table playing a board game. When your turn ends, you pass the dice to your left. After the last person, the dice simply carry on to the first person again, because a circle has no last seat. A newcomer squeezes in between two players; someone who is out leaves their seat, and the person before them passes straight to the person after. Nobody ever has to say "we have reached the end, go back to the start"."""
example = """Four players, Ann, Ben, Cat and Dan, take turns round a board game. The demo moves the turn on round the table, lets newcomers join at the beginning, the end and a position, removes players at the beginning, the end and by name, and finally plays a counting-out game in which every third player leaves until one is left."""
why = """In a straight list, the turn falls off the end after the last player: the next pointer is `null`, and a special case has to send the turn back to the first player every round. In a circular list there is no end and no special case: the last node's next simply points to the first, so taking a turn is always the same one step."""
when_use = [
  "Something goes round and round: turns, round-robin scheduling, a looping playlist.",
  "You keep your place in the circular list and move on one step at a time.",
  "Players or tasks join and leave while the circular list keeps turning.",
]
when_not = [
  "The data has a real beginning and end: a plain list is clearer.",
  "You read by position: position n is still n steps.",
  "The code is shared with people who expect `null` at the end: loops that wait for `null` never stop.",
]
met_before = [
  "Players taking turns, a carousel, the hands of a clock.",
  "Operating systems giving each program a turn of the processor (round-robin scheduling).",
  "`java.util.ArrayDeque` and circular buffers use the same wrap-around idea on an array.",
]

[[word]]
term = "circular linked list"
meaning = "A linked list whose last node's next points back to the first node: it has no end and no null."
[[word]]
term = "last"
meaning = "The only pointer the list keeps: the last node. The first node is `last.next`."
[[word]]
term = "node"
meaning = "One element: its `data` and a `next` pointer, which for the last node is the first node."
[[word]]
term = "do-while loop"
meaning = "A loop that runs its body first and checks afterwards; the natural way to go once round a circular list and stop back at the first node."
[[word]]
term = "counting out"
meaning = "A game where every k-th player round the circle leaves; also known as the Josephus problem."

