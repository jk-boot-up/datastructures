youtube_tags = ["generic doubly linked list", "recursion", "java generics", "Node<T>", "call stack", "stack overflow"]
youtube_description = """Generic Recursive Doubly Linked List in Java, explained with a photo viewer of Photo records. We trace a recursive search along prev pointers from the tail, comparing with equals until a separately made Photo("dog", 610) matches. We count Integers and display Strings with the same recursion, insert at both ends with no recursion at all, and find nodes recursively before linking them in O(1): insertAtPosition two calls deep with four pointers, deleteByKey three calls deep with two. We reverse the album recursively, seven calls deep, and finish at the limit: counting a million nodes throws a real StackOverflowError."""

[readme]
intro = """This project combines the two variations of the **doubly linked list**. Like `doubly-linked-list-generic`, each `Node<T>` has `prev`, a **reference** to a `T`, and `next`, and elements are matched with **`equals`**. Like `doubly-linked-list-recursive`, every walk is a **recursion** along `next` from the head or along `prev` from the tail; nodes are **found recursively** and **linked in O(1)**, and the ends need no recursion. The time of every operation equals the loop version's; each recursive walk uses one call-stack **frame** per node."""
analogy = """Picture guards on a train carrying any kind of cargo. Asked whether a carriage holds a certain crate, a guard checks their own carriage and, if not, asks the next guard along, forwards or backwards, and waits. Each guard only needs to know how to compare two crates."""
example = """The photo viewer's album of `Photo(name, kilobytes)` records, beside the same class holding sizes and names. The demo traces a recursive search along prev, counts and displays other types, works at the ends, inserts and deletes in the middle, reverses recursively, and counts a million nodes."""
why = """Generic recursive code over nodes with more than one pointer is exactly the shape of tree code later in the course. The doubly linked list is the gentlest version of it: two pointers, but only one followed at a time."""
when_use = [
  "Learning generic recursion over nodes with two pointers.",
  "Short lists.",
]
when_not = [
  "Long lists: a million nodes overflow the call stack.",
]
met_before = [
  "`doubly-linked-list-generic` and `doubly-linked-list-recursive`.",
]

