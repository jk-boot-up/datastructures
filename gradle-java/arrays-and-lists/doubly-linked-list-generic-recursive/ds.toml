bold = "The generic recursive doubly linked list holds any type T in Node<T>s with prev and next, matches with equals, walks by recursion along next or prev, finds recursively and links in O(1), and works at both ends without recursion; each walk costs a frame per node."
analogy_short = "Guards on a train of any cargo, passing questions along either way"
