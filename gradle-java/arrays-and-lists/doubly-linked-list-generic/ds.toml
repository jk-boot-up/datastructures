[readme]
intro = """A **generic doubly linked list** is the `doubly-linked-list` project written once for **any element type**. Each `Node<T>` has a **prev** pointer, a **reference** to its `T` data, and a **next** pointer; the list keeps **head** and **tail**. The same class holds photo names (`String`), sizes (`Integer`) or `Photo` records, and the compiler checks each use. Nodes are matched with **`equals`**; `T` needs no ordering. Every operation and cost is unchanged: O(1) insertion and deletion at both ends and at a node already reached, O(n) to reach a position. This is, in outline, how `java.util.LinkedList<E>` is built."""
analogy = """Picture a train whose carriages are coupled front and back, and can carry any cargo: passengers, coal, cars. The couplings work the same whatever is inside. A guard can walk either way, carriages can be added or removed at either end, and to ask whether a carriage carries "a dog photo of 610 kilobytes" you look at the cargo's description, not at the carriage."""
example = """The photo viewer from `doubly-linked-list`, now holding `Photo(name, kilobytes)` records, beside the same class holding the names and the sizes. The demo inspects a node, works at both ends, searches for and deletes a separately made `Photo`, inserts at a position, and reverses the sizes and the names with the same code."""
why = """A list of photos, a list of names and a list of sizes should not need three copies of the same doubly-linked-list code. A type parameter gives one class for all of them, checked by the compiler, with no casts: nodes are created as `new Node<>(data)`. Java's own `LinkedList<E>` is exactly this."""
when_use = [
  "Any list of objects of one type that is walked both ways or changed at both ends.",
  "A deque or an LRU cache of any element type.",
]
when_not = [
  "Reading by position: use `ArrayList<E>`.",
  "Memory is tight: each element costs a node with two pointers plus the object.",
]
met_before = [
  "`java.util.LinkedList<E>` and `Deque<E>`.",
  "Browser history and music playlists holding page or track objects.",
]

