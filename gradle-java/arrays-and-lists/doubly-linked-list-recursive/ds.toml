# ---------------------------------------------------------------- act 1
[[act]]
title = "The same recursion in both directions"
summary = "displayBackward starts at the tail and recurses on prev, 5 calls deep; displayForward does the same on next from the head."
detail = """The recursive display backward starts at the tail, mountain, prints it, and calls itself on `mountain.prev`, forest, and so on until `beach.prev`, which is `null`: the base case. Five calls deep for five photos. `displayForward` is the same method with `next` in place of `prev` and `head` in place of `tail`, and also goes five deep. A singly linked list can only recurse forwards; here the recursion can follow either pointer."""
speech = """First, the same recursion in both directions. [[slnc 400]] Display backward starts at the tail, the mountain. [[slnc 300]] It prints it, and calls itself on the previous node. [[slnc 400]] Forest, dog, cake, beach. [[slnc 300]] Then null: the base case. [[slnc 500]] Display forward is the same, following next from the head. [[slnc 300]] Five calls deep, either way."""
console = [["displayBackward(mountain): print it, then displayBackward(prev)", "muted"], ["  ... forest, dog, cake, beach", "muted"], ["    displayBackward(null): past the head   <- base case", "ok"], ["tail -> mountain <-> forest <-> dog <-> cake <-> beach <- head, depth 5", "ok"], ["head -> beach <-> cake <-> dog <-> forest <-> mountain <- tail, depth 5", "ok"]]
[[act.frame]]
caption = "Five displayBackward calls, from the tail along prev pointers"
