# ---------------------------------------------------------------- act 2
[[act]]
title = "Both ends need no recursion"
summary = "Inserting at both ends and deleting at the end: depth 0, through head and tail; count() recurses 6 deep."
detail = """Work at the ends uses `head` and `tail` directly: `insertAtBeginning("airport")` and `insertAtEnd("river")` set 6 pointers between them with no recursion, depth 0, and `deleteAtEnd` goes straight through the tail. Only operations that must visit nodes recurse: `count` goes six calls deep for six photos."""
speech = """Both ends need no recursion. [[slnc 400]] Inserting at the beginning and at the end uses the head and the tail directly. [[slnc 300]] Depth zero. [[slnc 400]] So does deleting at the end. [[slnc 500]] Counting must visit every node, so it recurses six deep."""
console = [["insertAtBeginning(\"airport\") and insertAtEnd(\"river\"): depth 0, 6 pointer changes", "ok"], ["deleteAtEnd() removed \"river\": depth 0, through tail", "ok"], ["count() = 6, depth 6", "amber"]]
[[act.frame]]
caption = "Head and tail reach both ends directly"
say = """Here is the album with its new first photo. [[slnc 300]] Head and tail reach both ends without a walk."""
picture = { type = "linked", nodes = ["airport", "beach", "cake", "dog", "forest", "mountain"], double = true, marks = { "0" = "new" }, pointers = [[0, "head"], [5, "tail"]] }

# ---------------------------------------------------------------- act 3
[[act]]
title = "Find recursively, link in O(1)"
summary = "search(\"forest\") is 5 comparisons at depth 5; insertAtPosition(3) finds the node before at depth 2 and sets 4 pointers; deleteByKey(\"cake\") finds it at depth 3 and changes 2."
detail = """Operations in the middle split into finding and changing. `search("forest")` recurses along next and finds it at position 4, five calls deep. `insertAtPosition(3, "garden")` finds the node before the position, cake, two calls deep, then sets four pointers with no recursion. `deleteByKey("cake")` finds cake three calls deep and unlinks it by pointing beach and garden at each other: two pointer changes, no predecessor search."""
speech = """In the middle, an operation first finds, then changes. [[slnc 400]] Search for the forest recurses five deep. [[slnc 400]] Insert at position three finds the node before it, two calls deep, then sets four pointers. [[slnc 400]] Delete the cake finds it three calls deep, then changes two pointers. [[slnc 500]] Only the finding is recursive."""
console = [["search(\"forest\") = position 4: 5 comparisons, depth 5", "amber"], ["insertAtPosition(3, \"garden\"): the node before found at depth 2, then 4 pointers set", "ok"], ["deleteByKey(\"cake\"): found at depth 3, then 2 pointers changed", "ok"], ["head -> airport <-> beach <-> garden <-> dog <-> forest <-> mountain <- tail", "muted"]]
[[act.frame]]
caption = "deleteByKey(\"cake\"): found recursively, then beach and garden joined"
say = """Here is the album after the deletion. [[slnc 300]] Beach and garden now point at each other."""
picture = { type = "linked", nodes = ["airport", "beach", "garden", "dog"], double = true, marks = { "1" = "ok", "2" = "ok" } }

# ---------------------------------------------------------------- act 4
[[act]]
title = "Reversal, recursively"
summary = "reverse swaps each node's prev and next and recurses on the old next: depth 5, 12 pointer changes with head and tail."
detail = """Each call of `reverse(node)` saves `node.next`, swaps `node.prev` and `node.next`, and recurses on the saved old next. Five calls deep for five photos, 10 pointer changes, and then `head` and `tail` are swapped: 12 in all. The album now runs from mountain to beach."""
speech = """Reversal, recursively. [[slnc 400]] Each call swaps its node's previous and next pointers. [[slnc 300]] Then it recurses on the old next, which it saved first. [[slnc 400]] Five calls deep. [[slnc 300]] Finally the head and the tail are swapped."""
console = [["reverse(): swap this node's prev and next, then reverse from the old next: depth 5, 12 pointer changes", "ok"], ["head -> mountain <-> forest <-> dog <-> cake <-> beach <- tail", "muted"]]
[[act.frame]]
caption = "After reverse: head at mountain, tail at beach"
say = """Here is the reversed album."""
picture = { type = "linked", nodes = ["mountain", "forest", "dog", "cake", "beach"], double = true, pointers = [[0, "head"], [4, "tail"]] }

# ---------------------------------------------------------------- act 5
[[act]]
title = "The limit of recursion"
summary = "A million photos inserted at the end with no recursion; counting them recursively throws StackOverflowError."
detail = """A million `insertAtEnd` calls use the tail pointer and never recurse. Counting the million recursively needs a frame per node, and Java throws `StackOverflowError`. The loops of `doubly-linked-list` do the same walk in O(1) extra space."""
speech = """And the limit. [[slnc 400]] A million photos, inserted at the end, with no recursion. [[slnc 400]] Counting them recursively needs a million frames. [[slnc 300]] The stack overflows. [[slnc 400]] The loop version needs order one extra space."""
console = [["1,000,000 photos, built with insertAtEnd: no recursion, O(1) each", "muted"], ["count(): StackOverflowError, one frame per node", "bad"], ["the loops of the doubly-linked-list project need O(1) extra space", "muted"]]
[[act.frame]]
