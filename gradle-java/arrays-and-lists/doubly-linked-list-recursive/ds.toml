narration = """Here are the costs. [[slnc 400]] Insertion and deletion at both ends are order one, with no recursion. [[slnc 400]] Display, count and search take order n time and stack. [[slnc 400]] In the middle, finding is order n, and linking order one. [[slnc 400]] Reverse is order n time and stack. [[slnc 500]] The loop version takes the same time, with order one space."""

