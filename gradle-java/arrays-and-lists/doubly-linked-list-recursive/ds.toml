# tools/dskit turns it into the README, docs, pictures, animation and video scenes.

[project]
slug = "doubly-linked-list-recursive"
category = "arrays-and-lists"
title = "Doubly Linked List (Recursive)"
package = "doublylinkedlistrecursive"
main_class = "RecursiveDoublyLinkedListDemo"
example = "A photo viewer whose walks are recursive, forwards and backwards"
tagline = "Recurse on next, or recurse on prev"
bold = "The recursive doubly linked list walks by calling itself on node.next, or on node.prev from the tail; it finds nodes recursively and then links or unlinks them in O(1), and works at both ends with no recursion at all; each walk costs one call-stack frame per node visited."
analogy_short = "A train guard who hands the question to the next carriage, in either direction"
jdk = "Nothing: `java.util.LinkedList` uses loops"
thumb_lines = ["DOUBLY LIST", "RECURSIVE"]
thumb_code = "display(node.prev)"
youtube_title = "Doubly Linked List in Java, Recursively - Both Directions and Reverse"
youtube_tags = ["doubly linked list", "recursion", "recursive linked list", "reverse doubly linked list", "call stack", "stack overflow"]
youtube_description = """Doubly Linked List in Java, written recursively, explained with a photo viewer. We trace a recursive display backward from the tail, following prev pointers five calls deep, and see display forward use the same recursion on next. We insert and delete at both ends with no recursion at all, then find nodes recursively and link or unlink them in O(1): insertAtPosition finds the node before it two calls deep and sets four pointers, deleteByKey finds cake three calls deep and changes two. We reverse the list by swapping each node's prev and next and recursing on the old next. We finish at the limit: counting a million photos recursively throws a real StackOverflowError."""

[readme]
intro = """A **doubly linked list** gives every node a **prev** and a **next** pointer and keeps **head** and **tail**. This project writes its walks **recursively**. Forwards, a list is empty or a node followed by the list from `node.next`; backwards, the same with `node.prev`, starting at the tail. So the same recursive shape displays the list in either direction. Finding a node is recursive; linking it in or unlinking it is the usual O(1) pointer work, because a doubly linked list can change a node without searching for its predecessor. Insertion and deletion at the ends need no walk and no recursion. The time of every operation is that of `doubly-linked-list`; a recursive walk costs one call-stack **frame** per node."""
analogy = """Picture a guard on a train asked how many carriages are behind them. They do not walk the train; they ask the guard in the next carriage back and wait, and so on to the last carriage, where the answer is "none behind me". The answers come back up, each guard adding one. The same could be done towards the front. Taking a carriage out, once the right one is found, is still just uncoupling two neighbours."""
example = """The photo album from `doubly-linked-list`: beach, cake, dog, forest and mountain. The demo traces a recursive backward display, displays forward, inserts and deletes at the ends, counts, searches, inserts at a position and deletes by key, reverses the list recursively, and finally counts a million photos."""
why = """A doubly linked list shows that recursion is about the walk, not the structure: the same recursion runs along `next` or along `prev`. It also separates the two costs of an operation, finding and changing, and shows that only the finding needs recursion here. The call stack is the price: one frame per node on every recursive walk."""
when_use = [
  "Learning how recursion follows pointers in either direction.",
  "Short lists, where the recursion depth is small.",
]
when_not = [
  "Long lists: a million nodes overflow the call stack. Use the loops of `doubly-linked-list`.",
]
met_before = [
  "`doubly-linked-list`, the same structure with loops.",
  "`singly-linked-list-recursive`, the same recursions on one direction only.",
]

