listing_intro = """The recursive walks of the doubly linked list. In each, find the base case (`node == null`) and the one recursive call, on `node.next` or on `node.prev`."""
[[listing]]
op = "Display backward"
method = "RecursiveDoublyLinkedList#displayBackward"
note = """The public method starts at `tail`; the private one appends this node and recurses on `node.prev`. It is `displayForward` with `next` replaced by `prev`: the recursion does not care which way the pointers go."""
[[listing]]
op = "Delete by key: find recursively, unlink in O(1)"
method = "RecursiveDoublyLinkedList#deleteByKey,find"
note = """`find` is recursive: the empty list or a match is the base case. Once the node is found, `deleteNode` points its two neighbours at each other, with no predecessor search and no recursion."""
[[listing]]
op = "Reversal"
method = "RecursiveDoublyLinkedList#reverse"
note = """Each call swaps its node's `prev` and `next`, then recurses on the old next, saved before the swap. When the recursion runs past the old tail, the public method swaps `head` and `tail`."""

