[[scene]]
key = "costs"
kind = "bullets"
title = "Time and Space Complexity"
body = ["insert, delete at beginning or end: O(1)", "delete a node already reached: O(1)", "at a position: O(n) to reach, O(1) to link", "search, get, count, display, reverse: O(n)", "", "extra space: O(1) for every operation"]
narration = """Here are the costs in time and space. [[slnc 400]] Insertion and deletion at the beginning or the end are order one. [[slnc 400]] Deleting a node you already hold is order one. [[slnc 400]] At a position, reaching it is order n, and linking is order one. [[slnc 400]] Search, get, count, display and reverse are order n. [[slnc 500]] And every operation uses order one extra space."""

[[scene]]
key = "compare"
kind = "bullets"
title = "Compared With Related Structures"
body = ["delete at end: doubly O(1), singly O(n)", "delete a held node: doubly O(1), singly O(n)", "walk backwards: doubly yes, singly no", "pointers per node: doubly 2, singly 1", "", "access position i: list O(n), array O(1)"]
narration = """How does it compare? [[slnc 400]] Deleting at the end is order one in a doubly linked list, and order n in a singly linked list. [[slnc 400]] So is deleting a node you already hold. [[slnc 400]] A doubly linked list can walk backwards. [[slnc 400]] The price is two pointers per node instead of one. [[slnc 500]] And like every list, it cannot jump to a position the way an array can."""

[[scene]]
key = "mistakes"
kind = "bullets"
title = "Common Mistakes"
body = ["forgetting one of the four insertion pointers", "not updating head or tail at the ends", "reversing without swapping head and tail", "walking on with next after the swap"]
narration = """Four mistakes to watch for. [[slnc 400]] Forgetting one of the four pointers of an insertion. [[slnc 400]] Not updating the head or the tail when working at the ends. [[slnc 400]] Reversing every node, but not swapping the head and the tail. [[slnc 400]] And, in reverse, following next after the swap, which now points backwards."""

