[[scene]]
key = "01-poster"
kind = "poster"
title = "Doubly Linked List"
narration = """Hello, and welcome. [[slnc 400]] This video explains the doubly linked list, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A doubly linked list is a chain of nodes, where every node points to the node after it, and to the node before it. [[slnc 400]] The list keeps both ends, the head and the tail. [[slnc 400]] So you can walk either way, and work at either end in one step. [[slnc 700]] Our example is a photo viewer, with Previous and Next buttons. [[slnc 400]] By the end, you will know every textbook operation on a doubly linked list, what each one costs, and the pointer that is easiest to forget."""

[[scene]]
key = "02-idea"
kind = "structure"
title = "The Everyday Idea"
caption = "A train: every carriage coupled to the one in front and the one behind"
picture = { type = "linked", nodes = ["engine", "coach A", "coach B", "guard"], double = true }
narration = """Think of a train. [[slnc 400]] Every carriage is coupled to the one in front, and the one behind. [[slnc 400]] A guard can walk forwards or backwards, one carriage at a time. [[slnc 500]] To take a carriage out of the middle, you uncouple it from both neighbours, and couple the neighbours to each other. [[slnc 400]] Nothing else moves. [[slnc 500]] That is a doubly linked list."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["node: data, prev and next", "prev: the node before; null at the head", "next: the node after; null at the tail", "head and tail: both ends, kept by the list"]
narration = """The words a textbook uses. [[slnc 400]] A node holds its data, a previous pointer, and a next pointer. [[slnc 400]] The previous pointer points to the node before, and is null at the head. [[slnc 400]] The next pointer points to the node after, and is null at the tail. [[slnc 400]] And the list keeps both ends: the head and the tail."""

