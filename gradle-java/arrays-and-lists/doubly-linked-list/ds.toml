  ["Insert at the end", "O(1) with tail", "O(n) (O(1) with a tail)", "O(1) amortised"],
  ["Delete at the end", "O(1): tail.prev", "O(n): find the second-to-last", "O(1)"],
  ["Delete a node already reached", "O(1)", "O(n): find the node before", "O(n) shifts"],
  ["Walk backwards", "yes", "no", "yes"],
  ["Pointers per node", "2 (prev, next)", "1 (next)", "none"],
  ["Pointers set by an insertion in the middle", "4", "2", "none, but O(n) shifts"],
]

pros = [
  "Walks both ways: display backward, Previous as well as Next.",
  "O(1) insertion and deletion at both ends, and O(1) deletion of any node already reached.",
  "No data is ever moved.",
]
cons = [
  "Two pointers per node: more memory than a singly linked list.",
  "Four pointers to set on every insertion in the middle: more places to make a mistake.",
  "Still no random access: position i is a walk.",
]

[[mistake]]
mistake = "Forgetting one of the four pointers of an insertion"
happens = "Forwards and backwards walks disagree: one direction skips the new node."
fix = "Set all four: `newNode.prev`, `newNode.next`, `node.next`, `following.prev`."
[[mistake]]
mistake = "Not updating head or tail at the ends"
happens = "Deleting the last node leaves `tail` pointing at a deleted node; deleting the only node leaves `head` or `tail` behind."
fix = "When `node.prev` is null, move `head`; when `node.next` is null, move `tail`."
[[mistake]]
mistake = "Reversing without swapping head and tail"
happens = "Every node is reversed, but `head` still points at what is now the last node."
fix = "After the loop, swap `head` and `tail`."
[[mistake]]
mistake = "Walking on with `current.next` after swapping in reverse"
happens = "After the swap, `current.next` is the old prev, so the loop goes backwards and stops at once."
fix = "Save the old next before the swap and continue from it."

[[exercise]]
level = "easy"
question = """Write `String getFromEnd(int k)` that returns the data of the node k places from the end (k = 0 is the tail). What is its time complexity?"""
answer = """```java
String getFromEnd(int k) {
    Node current = tail;
    for (int i = 0; i < k && current != null; i++) {
        current = current.prev;
    }
    if (current == null) throw new IndexOutOfBoundsException("no node " + k + " from the end");
    return current.data;
}
```
O(k) time, O(1) space; a singly linked list would need O(n), or two pointers k apart."""
[[exercise]]
level = "medium"
question = """Write `void moveToFront(Node node)` that moves a node already reached to the head in O(1). Where is this used?"""
answer = """```java
void moveToFront(Node node) {
    if (node == head) return;
    deleteNode(node);                   // unlink: 2 pointers
    node.prev = null;                   // relink at the front
    node.next = head;
    head.prev = node;
    head = node;
}
```
O(1): no search, only pointer changes. An LRU cache does exactly this every time an entry is used, which is why it keeps a doubly linked list."""
[[exercise]]
level = "harder"
question = """Make `get(pos)` walk from whichever end is nearer. What extra field does the list need, which operations must maintain it, and what is the worst case now?"""
answer = """The list needs a `size` field (without it, finding which end is nearer costs a count, O(n)). Every insertion adds one and every deletion subtracts one. Then:
```java
Node nodeAt(int pos) {
    if (pos < size / 2) {
        Node current = head;
        for (int i = 0; i < pos; i++) current = current.next;
        return current;
    }
    Node current = tail;
    for (int i = size - 1; i > pos; i--) current = current.prev;
    return current;
}
```
The worst case is the middle, n / 2 steps: still O(n), but half the walk. `java.util.LinkedList` does exactly this."""

