main_class = "DoublyLinkedListDemo"
example = "A photo viewer with Previous and Next"
tagline = "Pointers both ways"
bold = "A doubly linked list gives every node a prev pointer as well as a next pointer, so you can walk either way and remove a node you are holding without searching for its neighbour; the price is a second pointer in every node and four pointers to set on every insert."
analogy_short = "A train where every carriage is coupled to the one in front and the one behind"
jdk = "`java.util.LinkedList` (a doubly linked list with head and tail)"
thumb_lines = ["DOUBLY", "LINKED LIST"]
thumb_code = "node.prev.next = node.next"
youtube_title = "Doubly Linked List in Java - Insertion, Deletion, Display Backward, Reverse"
youtube_tags = ["doubly linked list", "linked list java", "prev next pointers", "java linkedlist", "linked list remove"]
youtube_description = """Doubly Linked List in Java, explained with a photo viewer that has Previous and Next buttons. We start with one-way pointers and see Previous from the last photo walk three steps from the start. Then we build the list by hand, as a C textbook does: every node holds data, a prev pointer and a next pointer, and the list keeps head and tail. We display it forward and backward, and count every textbook operation: insertAtBeginning and insertAtEnd with no walking, insertAtPosition setting four pointers, deleteAtEnd through the tail in O(1) where a singly list needs O(n), and deleteByKey with no prev pointer to keep. Then we forget one of the four pointers an insertion needs and watch the forward and backward walks disagree. We finish by reversing the list by swapping every node's prev and next, and with the bill: an extra pointer in every node."""

[readme]
intro = """A **doubly linked list** is a linked list where every **node** has its **data** and two pointers: `next`, to the node after it, and `prev`, to the node before it. The list remembers both ends, the **head** and the **tail**. Being able to go back as well as forward changes three things: you can walk the list in either direction, you can add at either end without walking, and you can remove a node you are already holding by joining its two neighbours, with no search for the node before it. This project builds one by hand, as a C textbook does with `struct node { data; struct node *prev, *next; }`, with the textbook operations: insertAtBeginning, insertAtEnd, insertAtPosition, deleteAtBeginning, deleteAtEnd, deleteAtPosition, deleteByKey, deleteNode, search, displayForward, displayBackward, count and reverse."""
analogy = """Think of a train. Every carriage is coupled to the one in front and the one behind. A guard in any carriage can step forwards or backwards one carriage at a time. To take a carriage out of the middle, you uncouple it from both neighbours and couple those neighbours to each other: two couplings, and the rest of the train does not move. To add one, there are four couplings to make, and forgetting one leaves a carriage that can be reached from one direction but not the other."""
example = """A photo viewer shows one photo at a time, with Previous and Next buttons. The album is beach, cake, dog, forest and mountain. The viewer must go back as easily as forward, add new photos at the end as they are taken, and delete the photo on screen. The demo first tries this with one-way pointers, then builds the doubly linked version, inserts and deletes at both ends and in the middle, forgets one pointer during an insertion, and reverses the list."""
why = """With one-way pointers, Previous is a problem: from "mountain", the only way back to "forest" is to start again at "beach" and walk forward, three steps, and further for longer albums. Deleting the photo on screen has the same problem, because the node before it must be found to point past it. A second pointer in every node makes both one step."""
when_use = [
  "You need to move backwards as well as forwards.",
  "You remove or insert next to a node you already hold, such as the item on screen or the item just used.",
  "You add and remove at both ends: the list works as a queue from either side.",
]
when_not = [
  "You only ever go forwards: a singly linked list does the job with one pointer per node.",
  "You read by position: position n is still a walk.",
  "Memory is tight: every node carries two pointers as well as its value.",
]
met_before = [
  "A browser's Back and Forward history, a photo gallery, a music player's previous and next track.",
  "`java.util.LinkedList` is a doubly linked list with a head and a tail.",
  "An LRU cache (later in this course) keeps a doubly linked list so it can move any entry to the front in one step.",
]

