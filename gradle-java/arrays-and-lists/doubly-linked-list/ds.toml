listing_intro = """The operations where a doubly linked list differs from a singly linked one, exactly as they appear in `DoublyLinkedList.java`."""
[[listing]]
op = "Insertion at the end"
method = "DoublyLinkedList#insertAtEnd"
note = """Through the `tail` pointer: the new node's `prev` is the old tail, the old tail's `next` is the new node, and `tail` moves. No walking, so O(1). An empty list is the special case: the new node is both head and tail."""
[[listing]]
op = "Insertion after a node"
method = "DoublyLinkedList#insertAfter"
note = """Four pointers: the new node's `prev` and `next`, then the node before it and the node after it are pointed at the new node. Forgetting the fourth, `following.prev`, leaves a list that looks right walking forwards but skips the new node walking backwards."""
[[listing]]
op = "Deletion of a node"
method = "DoublyLinkedList#deleteNode"
note = """The node knows both neighbours, so no search is needed: the one before is pointed past it with `next`, the one after with `prev`. At the ends, `head` or `tail` moves instead. Every deletion, at the beginning, the end, a position or by key, finishes here."""
[[listing]]
op = "Display backward"
method = "DoublyLinkedList#displayBackward"
note = """Start at `tail` and follow `prev` pointers to `null`. A singly linked list cannot do this without first reversing itself or using a stack."""
[[listing]]
op = "Reversal"
method = "DoublyLinkedList#reverse"
note = """Every node already has pointers both ways, so reversing only swaps each node's `prev` and `next`, then swaps `head` and `tail`. Note `current = t`: after the swap, the old next is in `prev`, so the walk continues through the saved value."""

[compare]
intro = """How a doubly linked list compares with the structures it is usually weighed against (n nodes):"""
columns = ["Operation", "Doubly linked list", "Singly linked list", "Dynamic array"]
rows = [
