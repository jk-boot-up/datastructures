# tools/dskit turns it into the README, docs, pictures, animation and video scenes.

[project]
slug = "dynamic-array-generic-recursive"
category = "arrays-and-lists"
title = "Dynamic Array (Generic, Recursive)"
package = "dynamicarraygenericrecursive"
main_class = "GenericRecursiveDynamicArrayDemo"
example = "A playlist of Song records, with every loop written as a recursion"
tagline = "Any type, growing one call at a time"
bold = "The generic recursive dynamic array holds references to any type T, doubles when full and halves when a quarter full, finds elements with equals, and does every linear pass, including the copy inside a resize, as a recursion: the time is unchanged, the extra space is one frame per element, and a large resize overflows the stack."
analogy_short = "A line of helpers copying a list of addresses, one line each"
jdk = "Nothing: `java.util.ArrayList<E>` resizes with a loop"
thumb_lines = ["DYNAMIC ARRAY", "GENERIC + RECURSIVE"]
thumb_code = "copy(i + 1, newArr)"
youtube_title = "Generic Recursive Dynamic Array in Java - References, equals and a Recursive Resize"
youtube_tags = ["java generics", "dynamic array", "recursion", "arraylist", "call stack", "stack overflow"]
youtube_description = """Generic Recursive Dynamic Array in Java, explained with a playlist of Song records. We trace a recursive resize that copies references, not songs: copy(0) copies the reference to Blue Sky and calls copy(1), down to the base case copy(4), four frames deep, and the Song at index 0 is still the same object afterwards. We grow to 9 songs with 2 resizes, traverse a list of Integers with the same class, insert at the front with 9 recursive shifts, delete with 4, and find a separately made Song with a recursive equals search at depth 7. We shrink to fit with 8 references copied at depth 8, and finish at the limit: a million appends throw a real StackOverflowError inside a resize."""

[readme]
intro = """This project combines the two variations of the **dynamic array**. Like `dynamic-array-generic`, it has a **type parameter** `T`, stores **references** on an `Object[]` cast to `T[]`, and finds elements with **`equals`**; `T` may be any type. Like `dynamic-array-recursive`, every linear pass is a **recursion** with a **base case**: traversal, linear search, the shifts of insertion and deletion, and the **copy inside a resize**. The time of every operation is the same as the plain dynamic array. The extra space is the **recursion depth**: one call-stack frame per element visited, shifted or copied, so a large enough resize overflows the call stack."""
analogy = """Picture a warehouse list of addresses being copied onto a sheet twice as long by a line of helpers. The first helper copies line 0 and asks the next helper to copy the rest, then waits. Each helper copies one address and waits for the others. The furniture never moves; only addresses are copied. When a helper finds no lines left, everyone can go home. A list of a million lines would need a million helpers waiting in the corridor at once."""
example = """The playlist of `Song` records, each a title and a length in seconds, grows from four places. The demo traces the recursive copy of references when the fifth song arrives, grows to nine songs, uses the same class for a list of play counts, inserts and deletes in the middle, searches for a separately made `Song` with a recursive `equals` search, shrinks to fit, and finally tries a million appends."""
why = """Every recursive, generic structure later in the course, from linked lists to trees, combines these two ideas: a type parameter for the element, and a method that handles one element and calls itself for the rest. The dynamic array is the simplest place to see them together, and it carries a warning that applies everywhere: a linear recursion hidden inside a routine operation, such as the copy in a resize, becomes a crash as the data grows."""
when_use = [
  "Learning how generics and recursion combine, on a structure you already know.",
  "Small lists, where the recursion depth stays low.",
]
when_not = [
  "Any list that may grow large: a recursive resize overflows the call stack. Use `dynamic-array-generic`, or `ArrayList<E>`.",
  "Performance-sensitive code: each call costs a frame, a jump and a return.",
]
met_before = [
  "`dynamic-array-generic`: the same class with loops; Java's `ArrayList<E>`.",
  "`dynamic-array-recursive`: the same recursions, for strings only.",
  "`StackOverflowError` from a method that called itself too deeply.",
]

