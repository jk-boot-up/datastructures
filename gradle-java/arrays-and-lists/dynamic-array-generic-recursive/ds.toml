narration = """The words. [[slnc 400]] T is the element type. [[slnc 300]] Each place holds a reference, and a resize copies the reference, not the object. [[slnc 400]] Equals compares contents. [[slnc 400]] The base case is when nothing is left. [[slnc 400]] And the recursion depth is the number of frames at once."""

