kind = "bullets"
title = "Time and Space Complexity"
body = ["get, update: O(1), not recursive", "append: O(1) amortised; a resize O(n) time and stack", "insert, delete at front: O(n) time and stack", "linear search: O(n) time and stack", "", "the loop version: the same time, O(1) extra"]
narration = """Here are the costs. [[slnc 400]] Get and update are order one. [[slnc 400]] Append is order one amortised, but a resize takes order n time and stack. [[slnc 400]] Insertion and deletion at the front take order n time and stack, and so does linear search. [[slnc 500]] The loop version takes the same time, with order one extra space."""

