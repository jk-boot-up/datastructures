narration = """Think of a list of warehouse addresses, being copied onto a longer sheet by a line of helpers. [[slnc 400]] The first helper copies line zero, then asks the next helper to copy the rest, and waits. [[slnc 400]] Each helper copies one address, and waits. [[slnc 500]] The furniture never moves, only the addresses. [[slnc 400]] When no lines are left, everyone can go home. [[slnc 300]] A million lines would need a million helpers in the corridor."""

