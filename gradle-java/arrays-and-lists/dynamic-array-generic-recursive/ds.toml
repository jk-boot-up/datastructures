[[mistake]]
mistake = "Writing `new T[capacity]`"
happens = "It does not compile: T is not known when the program runs."
fix = "`(T[]) new Object[capacity]`, kept inside the class."
[[mistake]]
mistake = "Searching with `==`"
happens = "An equal object made elsewhere is not found."
fix = "Compare with `equals`."
[[mistake]]
mistake = "A recursive copy inside resize"
happens = "An ordinary append overflows the call stack once the array is large."
fix = "Keep hidden linear work as a loop; recurse only where the depth is small."
[[mistake]]
mistake = "Not clearing freed places"
happens = "Deleted objects stay referenced and are never freed."
fix = "Set every place that falls out of use to `null`."

[[exercise]]
level = "easy"
question = """Write a recursive `boolean contains(T key, int i)`. What are its two base cases?"""
answer = """```java
boolean contains(T key, int i) {
    if (i == size) return false;                 // base case: nothing left
    if (arr[i].equals(key)) return true;         // base case: found
    return contains(key, i + 1);
}
```
Called as `contains(key, 0)`. O(n) time and O(n) stack."""
[[exercise]]
level = "medium"
question = """Write a recursive `int count(T key, int i)` that counts the elements equal to `key`. How deep does it go on the 9-song playlist, whatever the key?"""
answer = """```java
int count(T key, int i) {
    if (i == size) return 0;
    return (arr[i].equals(key) ? 1 : 0) + count(key, i + 1);
}
```
It always visits every element, so it goes 9 calls deep on 9 songs, found or not: O(n) time and stack."""
[[exercise]]
level = "harder"
question = """Rewrite the recursive `copy` so that its depth is O(log n): copy the middle reference, then the left half and the right half by recursive calls. Why is the time still O(n)?"""
answer = """```java
void copyRange(int low, int high, T[] newArr) {
    if (low > high) return;
    int mid = low + (high - low) / 2;
    newArr[mid] = arr[mid];
    copyRange(low, mid - 1, newArr);
    copyRange(mid + 1, high, newArr);
}
```
Each call halves the range and only one chain of calls waits at a time, so the depth is about log2(n): 20 for a million. Every reference is still copied once, so the time is O(n)."""

