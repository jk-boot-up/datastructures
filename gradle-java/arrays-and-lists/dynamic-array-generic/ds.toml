# tools/dskit turns it into the README, docs, pictures, animation and video scenes.

[project]
slug = "dynamic-array-generic"
category = "arrays-and-lists"
title = "Dynamic Array (Generic)"
package = "dynamicarraygeneric"
main_class = "GenericDynamicArrayDemo"
example = "A playlist of Song records, beside the same class holding titles and play counts"
tagline = "ArrayList, built by hand"
bold = "A generic dynamic array is the dynamic array written once with a type parameter T: it stores references on an Object[] cast to T[], doubles when full and halves when a quarter full, copies references (not objects) when it resizes, and finds elements with equals; this is how Java's ArrayList<E> is written."
analogy_short = "Moving house with a list of addresses, not the furniture"
jdk = "`java.util.ArrayList<E>`, written on an `Object[]` exactly like this"
thumb_lines = ["DYNAMIC ARRAY", "GENERIC <T>"]
thumb_code = "GenericDynamicArray<T>"
youtube_title = "Generic Dynamic Array in Java - Build Your Own ArrayList<E>"
youtube_tags = ["java generics", "dynamic array", "arraylist", "resizable array", "equals", "amortized"]
youtube_description = """Generic Dynamic Array in Java, explained with a music playlist of Song records, beside the same class holding titles and play counts. We see why the array inside is created as (T[]) new Object[4], then append until it is full and watch a resize copy 4 references, not 4 songs: the Song at index 0 is still the very same object. We grow to 9 songs with 2 resizes, insert an intro at the front with 9 shifts, delete from the middle with 4, and find a separately made Song with equals, because a record's equals compares its fields. We clear freed places so the garbage collector can reclaim deleted songs, shrink to fit, and finish with the bill: 1,020 references copied for 1,000 appends, and the capacity halving when a quarter full. This is how java.util.ArrayList is built."""

[readme]
intro = """A **generic dynamic array** is the `dynamic-array` project written once for **any element type**. The class has a **type parameter** `T`, so `GenericDynamicArray<Song>` holds songs, `GenericDynamicArray<String>` holds titles and `GenericDynamicArray<Integer>` holds numbers. Everything about growing is unchanged: a **size** and a **capacity**, doubling when full, halving when only a quarter is in use, O(1) amortised appends. What changes is what the places hold: **references** to objects. A resize copies the references, not the objects, so every element stays the very same object. Elements are found with **`equals`**. Since no ordering is needed, `T` may be any type at all. This is, almost line for line, how Java's `ArrayList<E>` is written."""
analogy = """Picture moving house again, but instead of carrying the furniture, you carry a list of where each piece is stored in a warehouse. When the list runs out of lines, you copy it onto a sheet twice as long, one address at a time. The furniture never moves: only the addresses are copied. And the list does not care whether the addresses point at chairs, books or bicycles."""
example = """The music app's playlist now holds `Song` records, each with a title and a length in seconds. The same class also holds the titles as strings and the play counts as integers. The demo grows the playlist until it resizes twice, inserts an intro at the front, deletes a song from the middle, searches for a separately made `Song` with `equals`, deletes from the end, shrinks to fit, and measures a thousand appends."""
why = """Without generics, a playlist of songs, a list of titles and a list of play counts would each need their own copy of the dynamic-array code, or one class storing `Object` that accepts anything and needs a cast on every read. One generic class serves every type, and the compiler checks each use. That is why every collection in Java, starting with `ArrayList<E>`, is generic."""
when_use = [
  "A growing list of objects of one type: songs, orders, readings.",
  "Mostly appending at the end and reading by index.",
  "Whenever you would use `ArrayList<E>`; this project shows what it does inside.",
]
when_not = [
  "Frequent insertion and deletion at the front: every element shifts; use a linked list or a deque.",
  "Millions of plain numbers: an `int[]` avoids a reference and an object per element.",
]
met_before = [
  "`java.util.ArrayList<E>`, `List<E>` and `Vector<E>`.",
  "`StringBuilder`, which grows its character array the same way.",
  "C++'s `std::vector<T>` and Python's `list`.",
]

