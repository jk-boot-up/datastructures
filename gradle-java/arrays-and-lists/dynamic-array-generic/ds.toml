[[scene]]
key = "costs"
kind = "bullets"
title = "Time and Space Complexity"
body = ["append: O(1) amortised, O(n) on a resize", "get, update: O(1)", "insertAt, deleteAt: O(n) at the front", "linear search: O(n)", "", "the same as the String-only version"]
narration = """Here are the costs in time and space. [[slnc 400]] Append is order one amortised, and order n when it resizes. [[slnc 400]] Get and update are order one. [[slnc 400]] Insert and delete at the front are order n. [[slnc 400]] Linear search is order n. [[slnc 500]] Every one of them is the same as the string-only version."""

[[scene]]
key = "compare"
kind = "bullets"
title = "Compared With Related Structures"
body = ["String-only dynamic array: the same costs, one type", "generic static array: fixed capacity", "int[]: values, not references: less memory", "", "Java's own: ArrayList<E>"]
narration = """How does it compare? [[slnc 400]] The string-only dynamic array has the same costs, but holds one type. [[slnc 400]] The generic static array holds any type, but cannot grow. [[slnc 400]] A plain int array stores values, not references, so it uses less memory. [[slnc 500]] And Java's own array list is exactly this structure."""

[[scene]]
key = "mistakes"
kind = "bullets"
title = "Common Mistakes"
body = ["writing new T[capacity]", "searching with ==", "not clearing freed places", "growing by a fixed amount"]
narration = """Four mistakes to watch for. [[slnc 400]] Writing new T array, which does not compile. [[slnc 400]] Searching with double equals, which misses equal objects. [[slnc 400]] Not clearing freed places, which leaks memory. [[slnc 400]] And growing by a fixed amount instead of doubling."""

