listing_intro = """The parts that differ from the String-only `dynamic-array` project, exactly as they appear in `GenericDynamicArray.java`. The growing and shrinking logic is unchanged."""
[[listing]]
op = "Creating a T[]"
method = "GenericDynamicArray#newArray"
note = """`new T[capacity]` does not compile, because Java erases `T` when it compiles. An `Object[]` can hold a reference of any type, and the cast is safe because the class only ever stores `T`. `ArrayList` does the same: it keeps an `Object[] elementData`."""
[[listing]]
op = "Resize: copying references"
method = "GenericDynamicArray#resize"
note = """The loop copies `arr[i]`, a reference, into the new array. The objects stay where they are, so after a resize every element is still the very same object."""
[[listing]]
op = "Deletion at a position"
method = "GenericDynamicArray#deleteAt"
note = """After the shift, the last place in use is set to `null`. With objects this matters: a leftover reference would keep the deleted song alive, and the garbage collector could never free it."""
[[listing]]
op = "Linear search with equals"
method = "GenericDynamicArray#linearSearch"
note = """`arr[i].equals(key)` compares contents. A `Song` record's `equals` compares title and length, so a separately made song with the same fields is found."""

[compare]
intro = """The generic dynamic array against its neighbours (n elements):"""
columns = ["Property", "Generic dynamic array", "Dynamic array of String", "Generic static array"]
rows = [
  ["Element types", "any T", "String only", "any Comparable T"],
  ["Access element i", "O(1)", "O(1)", "O(1)"],
  ["Append", "O(1) amortised", "O(1) amortised", "overflow when full"],
  ["Insert or delete at the front", "O(n) shifts", "O(n) shifts", "O(n) shifts"],
  ["A resize copies", "references", "references to strings", "not possible: fixed capacity"],
  ["Finds elements with", "equals", "equals", "equals, and compareTo for binary search"],
  ["Java's own", "ArrayList<E>", "ArrayList<String>", "T[]"],
]

pros = [
  "One class for every element type, checked by the compiler.",
  "O(1) access, O(1) amortised appends, and it shrinks again when mostly deleted.",
  "No ordering is required: T may be any type at all.",
]
cons = [
  "References and separate objects cost more memory than a primitive array.",
  "A resize still pauses for O(n) copies.",
  "Insertion and deletion at the front shift every element.",
  "`new T[n]` is impossible; an `Object[]` is cast to `T[]`.",
]

[[mistake]]
mistake = "Writing `new T[capacity]`"
happens = "It does not compile: T is not known when the program runs."
fix = "`(T[]) new Object[capacity]`, kept inside the class."
[[mistake]]
mistake = "Searching with `==`"
happens = "An equal song made elsewhere is a different object, so it is not found."
fix = "Compare with `equals`."
[[mistake]]
mistake = "Not clearing freed places"
happens = "Deleted objects stay referenced and are never garbage-collected: a memory leak."
fix = "Set every place that falls out of use to `null`."
[[mistake]]
mistake = "Growing by a fixed amount"
happens = "Every append near the limit copies everything: about n squared over 2 copies."
fix = "Grow by a factor: double, or one and a half as `ArrayList` does."

[[exercise]]
level = "easy"
question = """Write `boolean contains(T key)` using the methods the class already has. What does `contains(new Song("Echoes", 201))` return after the demo's act three, and why?"""
answer = """```java
boolean contains(T key) {
    return linearSearch(key) >= 0;
}
```
It returns true: `linearSearch` uses `equals`, and a record's `equals` compares title and length, so a new `Song("Echoes", 201)` equals the one in the playlist. O(n) time, O(1) space."""
[[exercise]]
level = "medium"
question = """Write `boolean deleteByKey(T key)`, which deletes the first element equal to `key`. What does it cost?"""
answer = """```java
boolean deleteByKey(T key) {
    int i = linearSearch(key);
    if (i < 0) return false;
    deleteAt(i);
    return true;
}
```
One comparison per element examined, plus one shift per element after the one deleted: a single pass over the array, O(n)."""
[[exercise]]
level = "harder"
question = """Add a constructor `GenericDynamicArray(T[] values)` that builds the array from an existing array with one resize at most. How many references does it copy for 9 songs, and how does that compare with appending them one by one from capacity 4?"""
answer = """```java
GenericDynamicArray(T[] values) {
    this(values.length);
    for (int i = 0; i < values.length; i++) {
        arr[i] = values[i];
    }
    size = values.length;
}
```
It allocates exactly 9 places and copies 9 references once. Appending one by one from capacity 4 copies 4 + 8 = 12 references in two resizes, then 9 writes. Knowing the size in advance avoids every resize."""

