[[scene]]
key = "01-poster"
kind = "poster"
title = "Dynamic Array (Generic)"
narration = """Hello, and welcome. [[slnc 400]] This video explains the generic dynamic array, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A generic dynamic array is an array that grows by itself, written once for any type of element. [[slnc 400]] It stores references to objects, and doubles its room when it is full. [[slnc 700]] Our example is a music playlist of songs. [[slnc 400]] By the end, you will know how Java's array list is built, what a resize really copies, and why deleted places must be cleared."""

[[scene]]
key = "02-idea"
kind = "structure"
title = "The Everyday Idea"
caption = "Copy the list of addresses, not the furniture"
picture = { type = "group", items = [ { type = "array", cells = ["addr", "addr", "addr", "addr"], title = "old list: full" }, { type = "array", cells = ["addr", "addr", "addr", "addr", "", "", "", ""], size = 4, marks = { "0" = "new", "1" = "new", "2" = "new", "3" = "new" }, title = "new list: twice as long" } ], gap = 50 }
narration = """Think of moving house, but with a warehouse. [[slnc 400]] Your furniture stays in the warehouse, and you keep a list of where each piece is. [[slnc 500]] When the list runs out of lines, you copy it onto a sheet twice as long. [[slnc 400]] Only the addresses are copied. [[slnc 300]] The furniture never moves. [[slnc 500]] And the list does not care whether the addresses point at chairs, or books, or bicycles."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["T: the element type, filled in at each use", "size and capacity: in use, and available", "reference: the address of an object", "resize: copy references, not objects", "", "equals: compare contents"]
narration = """The words. [[slnc 400]] T is the element type, filled in each time the class is used. [[slnc 400]] Size is how many elements are in use, and capacity is how many places there are. [[slnc 400]] Each place holds a reference, the address of an object. [[slnc 400]] A resize copies the references, not the objects. [[slnc 400]] And equals compares contents."""

