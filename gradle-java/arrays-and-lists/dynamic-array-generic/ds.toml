# ---------------------------------------------------------------- act 2
[[act]]
title = "Full? Double it, copying references"
summary = "Appending Paper Moon to 4 songs resizes to 8 and copies 4 references; the Song at index 0 is still the same object; 9 songs take 2 resizes."
detail = """After the fourth song the array is full, so appending "Paper Moon" allocates an array of 8 places and copies the 4 references across, then stores the new one. The songs themselves never move: after the resize, index 0 still holds the very same `Song` object. Four more songs follow; the ninth doubles the capacity again to 16. Nine appends, two resizes, twelve references copied: the same counts as the String-only dynamic array."""
speech = """Now the playlist fills up. [[slnc 400]] Appending a fifth song needs a resize: a new array of eight places. [[slnc 400]] Four references are copied across. [[slnc 300]] Not four songs: four addresses. [[slnc 500]] The song at index zero is still the very same object. [[slnc 400]] Nine songs take two resizes, exactly as before."""
console = [["append(Paper Moon (2:56)): full, new array of 8 places, 4 references copied", "amber"], ["index 0 still holds the very same Song object: true", "ok"], ["9 songs appended, 2 resizes, capacity 16", "ok"]]
[[act.frame]]
caption = "The resize copies references: the Song objects stay where they are"
say = """Here is the resize. [[slnc 300]] The old array of four, and the new array of eight. [[slnc 400]] Each place holds an arrow to a song. [[slnc 300]] The arrows are copied, and the songs stay put."""
picture = { type = "group", items = [ { type = "array", cells = ["ref", "ref", "ref", "ref"], title = "old: 4 references" }, { type = "array", cells = ["ref", "ref", "ref", "ref", "ref", "", "", ""], size = 5, marks = { "0" = "new", "1" = "new", "2" = "new", "3" = "new", "4" = "hi" }, title = "new: 4 copied, 1 written" } ], gap = 50 }

# ---------------------------------------------------------------- act 3
[[act]]
title = "The middle, and equals"
summary = "insertAt(0, Intro) shifts 9 songs; deleteAt(5) shifts 4; a new Song(\"Echoes\", 201) is found at index 6 by equals, although it is a different object."
detail = """Inserting an intro at the front shifts all 9 song references one place right; deleting index 5, "Paper Moon", shifts the 4 after it left. Then a new `Song("Echoes", 201)` is made and searched for. Linear search compares with `equals`, and a record's `equals` compares its fields, title and length, so the search finds it at index 6 after 7 comparisons. It is not the same object as the one stored: `==` would have missed it."""
speech = """Now the middle. [[slnc 400]] Inserting an intro at the front shifts nine songs. [[slnc 300]] Deleting index five shifts four. [[slnc 500]] Then we make a new song called Echoes, with the same length, and search for it. [[slnc 400]] Search uses equals, and a record's equals compares the title and the length. [[slnc 300]] So it is found, at index six, although it is a different object."""
console = [["insertAt(0, Intro (0:42)): 9 songs shifted right", "amber"], ["deleteAt(5) removed Paper Moon (2:56): 4 songs shifted left", "amber"], ["linearSearch(new Song(\"Echoes\", 201)) = index 6 after 7 comparisons: a record's equals compares title and length", "ok"], ["but it is a different object: holdsSameObject = false", "muted"]]
[[act.frame]]
caption = "linearSearch with equals: indexes 0 to 5 do not match, index 6 does"
say = """Here is the search. [[slnc 300]] Six songs compared, and not equal. [[slnc 300]] The seventh, Echoes, is equal: same title, same length. [[slnc 300]] Seven comparisons."""
picture = { type = "array", cells = ["Intro", "Blue Sky", "Rain Dance", "Night Drive", "Sunrise", "Wild Honey", "Echoes", "Firefly", "Last Train"], marks = { "0" = "dim", "1" = "dim", "2" = "dim", "3" = "dim", "4" = "dim", "5" = "dim", "6" = "ok" }, pointers = [[6, "equals"]] }

# ---------------------------------------------------------------- act 4
[[act]]
title = "Deleting clears references"
summary = "16 places, 9 in use, 7 spare and all null; deleteAtEnd sets the freed place to null so the Song can be freed; shrinkToFit copies 8 references."
detail = """Spare places hold `null`: capacity 16, size 9, seven empty. `deleteAtEnd` removes "Last Train" and sets its place to `null`, so no reference to the song remains in the array and the garbage collector can free it. Forgetting that line is a classic memory leak in a hand-written list. `shrinkToFit` then resizes to exactly 8 places, copying 8 references."""
speech = """Deleting is where references matter most. [[slnc 400]] Deleting the last song sets its place to null. [[slnc 400]] If the array kept the reference, the song could never be freed from memory. [[slnc 300]] That is a memory leak. [[slnc 500]] Then shrink to fit copies eight references into exactly eight places."""
console = [["capacity 16, size 9: 7 places spare, all null", "muted"], ["deleteAtEnd() removed Last Train (3:52); its place is set to null so the Song can be freed", "amber"], ["shrinkToFit(): capacity 8, 8 references copied", "ok"]]
[[act.frame]]
caption = "After deleteAtEnd: the freed place holds null, not a leftover reference"
say = """Here is the array after the deletion. [[slnc 300]] Eight songs. [[slnc 300]] The place that held Last Train is now null, like every spare place."""
picture = { type = "array", cells = ["Intro", "Blue Sky", "Rain Dance", "Night Drive", "Sunrise", "Wild Honey", "Echoes", "Firefly", "null", "null"], size = 8, marks = { "8" = "dim", "9" = "dim" } }

# ---------------------------------------------------------------- act 5
[[act]]
title = "The bill"
summary = "1,000 appends copy 1,020 references, about one each; deleting down to 256 of 1,024 halves the capacity; the costs equal the String-only version."
detail = """A thousand appends copy 4 + 8 + ... + 512 = 1,020 references in total, about one per append: O(1) amortised, exactly as in the String-only dynamic array. Deleting from the end down to 256, a quarter of 1,024, halves the capacity to 512. Generics change the element type, not the algorithm or its costs. Java's `ArrayList<E>` is this structure on an `Object[]`, growing by half rather than doubling."""
speech = """And the bill. [[slnc 400]] A thousand appends copy one thousand and twenty references. [[slnc 300]] About one per append. [[slnc 400]] Deleting down to a quarter halves the capacity. [[slnc 500]] Every cost is the same as the string-only version. [[slnc 400]] Generics change the type, not the algorithm. [[slnc 400]] And this is how Java's array list is built."""
console = [["1,000 appends: 1,020 references copied, about 1 per append", "ok"], ["deleteAtEnd down to 256 of capacity 1024: capacity halves to 512", "ok"], ["the same costs as the String-only dynamic array: generics change the type, not the algorithm", "muted"], ["already in Java: java.util.ArrayList<E>, written exactly this way on an Object[]", "muted"]]
[[act.frame]]
