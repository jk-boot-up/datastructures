# ---------------------------------------------------------------- act 1
[[act]]
title = "One class, any element type"
summary = "The same class holds String titles, Integer play counts and Song records; inside each is (T[]) new Object[4]."
detail = """Three playlists use one class. `GenericDynamicArray<String>` holds titles, `GenericDynamicArray<Integer>` holds play counts, and `GenericDynamicArray<Song>` holds records of our own, each a title and a length. Inside each is an array created as `(T[]) new Object[4]`, because Java cannot create `new T[4]`: T is erased when the program runs. Capacity 4, size 3 in each."""
speech = """First, one class for any type. [[slnc 400]] The same dynamic array holds song titles, as strings. [[slnc 300]] It holds play counts, as integers. [[slnc 300]] And it holds songs, a type of our own. [[slnc 500]] Inside each is an ordinary array of four places. [[slnc 300]] It is created as an array of object, because Java cannot create an array of T directly."""
console = [["GenericDynamicArray<String>:  [Blue Sky, Rain Dance, Night Drive]", "ok"], ["GenericDynamicArray<Integer>: [10, 20, 30]", "ok"], ["GenericDynamicArray<Song>:    [Blue Sky (3:34), Rain Dance (3:07), Night Drive (4:03)]", "ok"], ["inside each: (T[]) new Object[4], capacity 4, size 3", "muted"]]
[[act.frame]]
