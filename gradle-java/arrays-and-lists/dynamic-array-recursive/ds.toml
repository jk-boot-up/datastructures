listing_intro = """Each loop of the `dynamic-array` project, written as a recursion. In each one, look for the base case, which returns without calling again, and for the call that moves one step towards it. `steps.enter()` and `steps.exit()` only measure the depth."""
[[listing]]
op = "Resize with a recursive copy"
method = "RecursiveDynamicArray#resize,copy"
note = """`copy(i, newArr)` copies element i, then calls itself for i + 1; the base case is `i == size`, nothing left to copy. The loop `for (i = 0; i < size; i++)` has become the parameter `i`, the base case `i == size`, and the call with `i + 1`. Every frame waits until the last element is copied, so a resize of n elements is n frames deep."""
[[listing]]
op = "Insertion at the end"
method = "RecursiveDynamicArray#append"
note = """Not recursive itself, but when the array is full it calls `resize`, and with it the recursive copy. That is why an ordinary append can throw `StackOverflowError` once the array is large."""
[[listing]]
op = "Insertion at a position"
method = "RecursiveDynamicArray#insertAt,shiftRight"
note = """`shiftRight(i, pos)` moves `arr[i]` one place right and recurses on `i - 1`, starting at the last element so nothing is overwritten; it stops when `i < pos`."""
[[listing]]
op = "Linear search"
method = "RecursiveDynamicArray#linearSearch"
note = """Two base cases: no elements left (-1) and a match (i). Otherwise the rest of the array is searched by the next call."""

