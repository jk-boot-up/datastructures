[[word]]
term = "base case"
meaning = "The call that returns without calling again: `i == size`, nothing left to copy, visit or compare."
[[word]]
term = "call stack and frame"
meaning = "One frame per call that has not yet returned, holding its parameters, such as `i`."
[[word]]
term = "recursion depth"
meaning = "The most frames at once: 4 for a resize of 4 elements, n for a resize of n."
[[word]]
term = "amortised O(1)"
meaning = "The average time per append, counting the rare resize: unchanged by writing the copy recursively."

