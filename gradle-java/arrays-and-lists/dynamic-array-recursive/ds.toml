narration = """That's the dynamic array, written recursively. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A loop becomes a recursion by turning its condition into a base case, and its step into a call, but every waiting call costs a frame. [[slnc 500]] The full source code, written notes, pictures, and an animated walkthrough are all in the repository. [[slnc 500]] Here is one exercise to try. [[slnc 300]] Write a recursive copy that halves the range, and see its depth drop to log n. [[slnc 500]] If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching."""
