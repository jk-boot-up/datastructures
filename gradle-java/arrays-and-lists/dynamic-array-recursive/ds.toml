[[scene]]
key = "01-poster"
kind = "poster"
title = "Dynamic Array (Recursive)"
narration = """Hello, and welcome. [[slnc 400]] This video explains the dynamic array, written recursively, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A dynamic array keeps an ordinary array inside, and moves to a bigger one when it is full. [[slnc 400]] Here, every loop is written as a recursion: a method that handles one element, and calls itself for the rest. [[slnc 700]] Our example is a music playlist that grows one song at a time. [[slnc 400]] By the end, you will know how each loop becomes a recursion, what that costs in memory, and why an ordinary append can crash."""

[[scene]]
key = "02-idea"
kind = "structure"
title = "The Everyday Idea"
caption = "Each helper carries one box, then waits for the rest of the move"
picture = { type = "array", cells = ["box 0", "box 1", "box 2", "box 3", "done"], marks = { "4" = "ok" }, pointers = [[0, "helper 1"], [4, "base case"]], title = "a move, one box per helper" }
narration = """Think of a family moving house, with a line of helpers. [[slnc 400]] The first helper carries box zero, then asks the next helper to carry the rest, and waits. [[slnc 400]] The second carries box one, asks the next, and waits too. [[slnc 500]] The last helper finds no boxes left, and says done. [[slnc 300]] That is the base case. [[slnc 500]] With four boxes, four helpers wait. [[slnc 300]] With a million boxes, the corridor is not long enough. [[slnc 400]] That is a stack overflow."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["size, capacity: in use, and available", "resize: a new array, every element copied", "base case: i == size, nothing left", "recursion depth: frames at once", "", "a resize of n elements: n frames"]
narration = """The words. [[slnc 400]] The size is how many elements are in use, and the capacity is how many places there are. [[slnc 400]] A resize makes a new array, and copies every element. [[slnc 400]] The base case is when nothing is left to copy. [[slnc 400]] And the recursion depth is the number of frames at once. [[slnc 500]] A recursive resize of n elements needs n frames."""

