[[scene]]
key = "costs"
kind = "bullets"
title = "Time and Space Complexity"
body = ["get, update: O(1), not recursive", "append: O(1) amortised; a resize O(n) time and stack", "insert, delete: O(n) time and stack at the front", "traverse, linear search: O(n) time and stack", "", "the loop version: the same time, O(1) extra space"]
narration = """Here are the costs. [[slnc 400]] Get and update are order one, and not recursive. [[slnc 400]] Append is order one amortised, but a resize takes order n time and order n stack. [[slnc 400]] Insertion and deletion at the front take order n time and stack. [[slnc 400]] So do traversal and linear search. [[slnc 500]] The loop version takes the same time, with order one extra space."""

[[scene]]
key = "compare"
kind = "bullets"
title = "Recursive or Loop?"
body = ["the same counts: 12 copies for 9 appends", "recursion: one frame per element copied", "loop: O(1) extra space", "", "a large resize: recursion overflows, the loop finishes"]
narration = """Recursive or loop? [[slnc 400]] The counts are the same: twelve copies for nine appends. [[slnc 400]] But recursion keeps one frame per element copied, and the loop keeps none. [[slnc 500]] For a large resize, the recursion overflows the call stack, and the loop simply finishes."""

[[scene]]
key = "mistakes"
kind = "bullets"
title = "Common Mistakes"
body = ["a copy with no base case", "forgetting that resize is recursive", "shifting from pos upwards", "not clearing a deleted place"]
narration = """Four mistakes to watch for. [[slnc 400]] A recursive copy with no base case. [[slnc 400]] Forgetting that resize is recursive, so an append can overflow. [[slnc 400]] Shifting from the insertion position upwards, which overwrites the data. [[slnc 400]] And not clearing a deleted place, which keeps the old string alive."""

