summary = "Appending 1,000,000 songs throws StackOverflowError inside a resize, long before the end; the loop version finishes."
detail = """Appending a million songs works until a resize has to copy more elements than the call stack has room for frames. Then the recursive copy throws `StackOverflowError`, from inside an `append`, an operation that looks O(1) to its caller. The `dynamic-array` project copies with a loop in O(1) extra space and finishes. This is the lesson of the project: recursion is fine when the depth is small, but a linear recursion hidden inside a routine operation becomes a crash as soon as the data grows."""
