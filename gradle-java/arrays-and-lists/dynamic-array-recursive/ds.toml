# tools/dskit turns it into the README, docs, pictures, animation and video scenes.

[project]
slug = "dynamic-array-recursive"
category = "arrays-and-lists"
title = "Dynamic Array (Recursive)"
package = "dynamicarrayrecursive"
main_class = "RecursiveDynamicArrayDemo"
example = "A growing music playlist, with every loop written as a recursion"
tagline = "A growing array, one element per call"
bold = "The recursive dynamic array doubles when full and halves when a quarter full, like any dynamic array, but copies, shifts, traverses and searches recursively: the time is unchanged, and the extra space is one call-stack frame per element, so a large resize can overflow the stack."
analogy_short = "Moving house one box at a time, each helper waiting for the next"
jdk = "Nothing: Java's `ArrayList` grows with a loop (`Arrays.copyOf`)"
thumb_lines = ["DYNAMIC ARRAY", "RECURSIVE"]
thumb_code = "copy(i + 1, newArr)"
youtube_title = "Dynamic Array in Java, Recursively - Recursive Resize and the Call Stack"
youtube_tags = ["dynamic array", "recursion", "resize", "call stack", "stack overflow", "amortized"]
youtube_description = """Dynamic Array in Java, written recursively, explained with a music playlist that grows one song at a time. We trace a recursive resize call by call: copy(0) copies Blue Sky and calls copy(1), down to the base case copy(4), four copies at depth 4. We grow the playlist to 9 songs with 2 resizes and 12 copies, traverse it at depth 9, insert at the front with 9 recursive shifts, delete from the middle with 4, and search recursively. We shrink to fit with 9 copies at depth 9 and see the capacity halve when deletions leave it a quarter full. We finish at the limit: appending a million songs throws a real StackOverflowError inside a resize, because a recursive copy needs one frame per element. The loop version is in the Dynamic Array project."""

[readme]
intro = """A **dynamic array** keeps a static array inside, with a **size** (elements in use) and a **capacity** (places available): appending writes into the next spare place, a full array is **resized** to twice the capacity, and a quarter-full array is halved. This project is the `dynamic-array` project with every loop written as a **recursion**: traversal, linear search, the shifts of insertion and deletion, and the **copy inside a resize**. Each recursive method handles one element and calls itself for the rest, stopping at a **base case**. The time of every operation is unchanged. The extra space is not: each call still waiting keeps a **frame** on the **call stack**, so a resize of n elements needs n frames, and a large enough resize overflows the stack."""
analogy = """Picture a family moving house, carrying one box at a time down a line of helpers. The first helper carries box 0 and then asks the next helper to carry the rest, and waits there until the whole move is finished. The second helper carries box 1, asks the next, and waits too. The last helper finds no boxes left and says "done", and only then can everyone go home. With four boxes, four helpers wait at once. With a million boxes, you would need a million helpers standing in the corridor at the same time, and the corridor is not that long: that is a stack overflow."""
example = """The playlist from the `dynamic-array` project starts with room for four songs. The demo traces the recursive copy when the fifth song arrives, grows the playlist to nine songs, inserts an intro at the front, deletes a song from the middle, searches, shrinks, and finally tries to append a million songs."""
why = """Writing the loops of a dynamic array as recursions shows two things. First, how a loop becomes a recursion: the loop variable becomes a parameter, the loop condition becomes the base case, and `i++` becomes the call with `i + 1`. Second, why real code does not do this for linear passes: the resize, an operation the programmer never calls directly, suddenly needs as many stack frames as there are elements, and an ordinary `append` can crash the program."""
when_use = [
  "Learning how each loop of a dynamic array becomes a recursion, with its base case.",
  "Small arrays, where the depth stays far below the call-stack limit.",
]
when_not = [
  "Any array that may grow large: a recursive resize of a few tens of thousands of elements can overflow the call stack. Use the loops of `dynamic-array`.",
  "Performance-sensitive code: each call costs a frame, a jump and a return.",
]
met_before = [
  "The `dynamic-array` project: the same structure with loops.",
  "The `static-array-recursive` project: the same recursive shifts and search on a fixed array.",
  "`ArrayList.add`, which resizes with a loop inside `Arrays.copyOf`.",
]

