# ds.toml: everything about this project that is not Java code.
# tools/dskit turns it into the README, docs, pictures, animation and video scenes.

[project]
slug = "dynamic-array"
category = "arrays-and-lists"
title = "Dynamic Array"
package = "dynamicarray"
main_class = "DynamicArrayDemo"
example = "A music playlist that grows as songs are added"
tagline = "An array that grows itself"
bold = "A dynamic array keeps a fixed array inside with some spare places; when it is full it shifts everything into a new array twice as big, so adding at the end stays cheap on average."
analogy_short = "Moving house to a place twice the size, only when you run out of room"
jdk = "`java.util.ArrayList` (starts at 10 places and grows by half each time)"
thumb_lines = ["DYNAMIC", "ARRAY"]
thumb_code = "capacity * 2"
youtube_title = "Dynamic Array in Java - How ArrayList Grows"
youtube_tags = ["dynamic array", "arraylist", "resizable array", "amortized", "capacity vs size"]
youtube_description = """Dynamic Array in Java, explained with a music playlist that grows as songs are added. We start with a fixed array of four songs and see a fifth song fail, then count what growing one place at a time would cost: 499,494 copies for 1,000 songs. Then we build the fix by hand: an array with spare capacity, and when it is full, a new array twice as big with every song copied across. We count the real steps, 1,020 copies for 1,000 songs, about one per song, then insertAt and deleteAt in the middle, find that a spare place is not an element, and see the capacity halve when deletions leave it a quarter full. We finish with the bill: up to half the places unused, and one slow append now and then."""

[readme]
intro = """A **dynamic array** is an array that grows by itself. Inside, it keeps an ordinary fixed array with some spare places at the end. It remembers two numbers: the **size**, how many places are in use, and the **capacity**, how many places the inside array has. Adding a value puts it in the next spare place. When there are no spare places left, it makes a new array twice as big, copies every value across, and carries on. This is exactly what Java's `ArrayList` does, and this project builds it by hand."""
analogy = """Think of a family moving house. They buy a house with a few spare bedrooms. Each new child takes a spare room, and nothing else changes. When every room is full, they move to a house twice the size, carrying every belonging across in one big move. Moving is hard work, but because the new house is twice as big, it will be a long time before they have to move again. That is a dynamic array: cheap to add to almost every time, and an occasional big move."""
example = """A music app keeps a playlist of song titles. The listener appends songs one at a time, and nobody knows in advance how long the playlist will get. The playlist starts with room for four songs. The demo appends songs until it runs out of room, watches it grow, inserts an intro at the front, removes a song from the middle, and measures what a thousand songs cost."""
why = """A static array cannot grow: a fifth song in a four-place array stops the program. The obvious fix, making a new array one place bigger every time, works but is ruinously slow: adding 1,000 songs that way copies 499,494 values, because every append copies everything already there. Doubling the capacity instead means the big copies happen rarely, and 1,000 songs cost only 1,020 copies, about one per song."""
when_use = [
  "You do not know in advance how many values there will be.",
  "You mostly add at the end and read by position.",
  "You want one-step reads by index, like an array, without fixing the length.",
]
when_not = [
  "You often insert or remove at the front or in the middle: every later value moves (a linked list or a deque suits that better).",
  "Every single append must be fast: the rare resize copies everything at once.",
  "Memory is very tight: up to half the places can sit unused.",
]
met_before = [
  "`java.util.ArrayList`, the most used collection in Java, is a dynamic array.",
  "`StringBuilder` grows its character array the same way when you append.",
  "Python's `list` and C++'s `std::vector` work the same way underneath.",
]

[[word]]
term = "size"
meaning = "How many places are in use: how many songs are in the playlist."
[[word]]
term = "capacity"
meaning = "How many places the array inside has, used or not. Always at least the size."
[[word]]
term = "spare places"
meaning = "Capacity minus size: room to add without growing. They are not part of the array."
[[word]]
term = "resize"
meaning = "Making a new, bigger array inside and copying every value across."
[[word]]
term = "copy"
meaning = "Carrying one value from the old array into the new one during a resize. The demo counts them."
[[word]]
term = "amortised cost"
meaning = "The average cost of an operation over many uses, counting the rare expensive one. Adding is amortised one step."

[[operation]]
name = "Traverse"
does = "Visit arr[0] to arr[size-1] once"
time = "O(n) / O(n) / O(n)"
space = "O(1)"
counted = "one read per element"
[[operation]]
name = "Access `get(i)`"
does = "Return arr[i], by address calculation"
time = "O(1) / O(1) / O(1)"
space = "O(1)"
counted = "1 step"
[[operation]]
name = "Update `update(i, x)`"
does = "Replace arr[i]"
time = "O(1) / O(1) / O(1)"
space = "O(1)"
counted = "1 step"
[[operation]]
name = "Insert at end `append(x)`"
does = "Store x at arr[size]; resize to double first when full"
time = "O(1) / O(1) amortised / O(n) when it resizes"
space = "O(1) amortised; O(n) for the new array during a resize"
counted = "1 write usually; 1,020 copies over 1,000 appends"
[[operation]]
name = "Resize (inside append)"
does = "Allocate an array of twice the capacity and copy every element"
time = "O(n) / O(n) / O(n), but rare"
space = "O(n)"
counted = "4 copies at the 5th song, 8 at the 9th, 512 at the 513th"
[[operation]]
name = "Insert `insertAt(pos, x)`"
does = "Shift arr[pos..size-1] right, store x"
time = "O(1) at the end / O(n) / O(n) at the front"
space = "O(1), plus a resize when full"
counted = "9 shifts to insert at the front of 9 songs"
[[operation]]
name = "Delete at end `deleteAtEnd()`"
does = "Clear arr[size-1]; halve the capacity when a quarter full"
time = "O(1) / O(1) amortised / O(n) when it shrinks"
space = "O(1) amortised"
counted = "0 shifts; 1 resize going from 513 songs down to 256"
[[operation]]
name = "Delete `deleteAt(pos)`"
does = "Shift arr[pos+1..size-1] left"
time = "O(1) at the end / O(n) / O(n) at the front"
space = "O(1)"
counted = "4 shifts to delete index 5 of 10"
[[operation]]
name = "Linear search"
does = "Compare each element with the key in turn"
time = "O(1) / O(n) / O(n)"
space = "O(1)"
counted = "one comparison per element looked at"
[[operation]]
name = "Shrink to fit"
does = "Resize to exactly size places"
time = "O(n) / O(n) / O(n)"
space = "O(n)"
counted = "9 copies for 9 songs"

listing_intro = """The operations that make a dynamic array different from a static one, exactly as they appear in `DynamicArray.java`. Access, update, traversal, deletion in the middle and linear search are the same loops as in the static-array project."""
[[listing]]
op = "Insertion at the end"
method = "DynamicArray#append"
note = """If `size == arr.length` the array is full, so it is replaced by a bigger one first; then the value goes into `arr[size]` and the size grows by one. Most appends are one write; the rare one that resizes costs O(n)."""
[[listing]]
op = "Resize"
method = "DynamicArray#newCapacity,resize"
note = """`newCapacity` doubles (or, for the measured comparison, appends one place). `resize` allocates the new array and copies the elements one by one; the old array becomes garbage. Because each resize doubles the room, the copies over n appends add up to less than 2n: O(1) amortised per append."""
[[listing]]
op = "Deletion at the end, and shrinking"
method = "DynamicArray#deleteAtEnd,shrinkIfQuarterFull"
note = """The freed place is set to `null` so the string can be garbage-collected. When only a quarter of the array is in use, the capacity is halved. Halving at a quarter rather than at a half leaves room both ways, so appends and deletions alternating at the boundary cannot resize every time."""
[[listing]]
op = "Insertion at a position"
method = "DynamicArray#insertAt"
note = """Resize first if full, then the same shift as a static array: from the end down to `pos`, so no element is overwritten before it has shifted."""

[compare]
intro = """How a dynamic array compares with the structures it is usually weighed against (n elements):"""
columns = ["Operation", "Dynamic array", "Static array", "Singly linked list"]
rows = [
  ["Access element i", "O(1)", "O(1)", "O(n)"],
  ["Insert at the end", "O(1) amortised, O(n) on a resize", "O(1), overflow when full", "O(1) with a tail pointer"],
  ["Insert or delete at the front", "O(n) shifts", "O(n) shifts", "O(1)"],
  ["Search (unsorted)", "O(n)", "O(n)", "O(n)"],
  ["Size", "grows and shrinks by copying", "fixed at creation", "grows one node at a time"],
  ["Extra memory", "up to half the places spare after a resize", "capacity - n places", "one next pointer per node"],
  ["Memory layout", "consecutive", "consecutive", "scattered nodes"],
]

pros = [
  "O(1) access by index, like any array.",
  "Grows without a limit, and appending is O(1) amortised.",
  "Consecutive memory: fast to read in order, and binary search works when sorted.",
  "Shrinks again when most elements are deleted.",
]
cons = [
  "The occasional append that resizes costs O(n): a pause in a program that must never pause.",
  "Up to half the capacity can be unused just after a resize.",
  "Insertion and deletion at the front or middle still shift O(n) elements.",
  "A resize needs the old and the new array in memory at the same time.",
]

[[mistake]]
mistake = "Growing by one place at a time"
happens = "Every add copies everything already stored: 1,000 songs cost 499,494 copies."
fix = "Grow by a factor (double, or one and a half as Java does), never by a fixed amount."
[[mistake]]
mistake = "Treating capacity as size"
happens = "Reading a spare place returns a value that was never added, or throws."
fix = "Only indexes 0 to size - 1 hold elements; check indexes against the size."
[[mistake]]
mistake = "Forgetting to clear a removed place"
happens = "The old value stays referenced in the array, so Java cannot free its memory."
fix = "Set the place that falls out of use to `null`, as `deleteAt` and `deleteAtEnd` do."
[[mistake]]
mistake = "Deleting from the front in a loop"
happens = "Each remove shifts every other value: removing all 1,000 songs from the front makes about half a million shifts."
fix = "Delete from the end, or use a structure made for the front, such as a deque."

[[exercise]]
level = "easy"
question = """A dynamic array starts with capacity 4 and doubles. What are its size and capacity after 10 appends, and how many resizes happened?"""
answer = """Size 10, capacity 16. It resized at the 5th append (4 to 8) and at the 9th append (8 to 16): two resizes, copying 4 + 8 = 12 values."""
[[exercise]]
level = "medium"
question = """Write `boolean deleteByKey(String key)`, which finds the first element equal to `key` and deletes it, returning whether it found one. Use the methods the class already has."""
answer = """```java
public boolean deleteByKey(String key) {
    int i = linearSearch(key);
    if (i < 0) return false;
    deleteAt(i);
    return true;
}
```
It costs one comparison per element looked at, plus one shift per element after the one deleted: one pass over the array either way, O(n)."""
[[exercise]]
level = "harder"
question = """Change `newCapacity` to grow by one and a half times (`capacity + capacity / 2`, as Java's `ArrayList` does). Starting from 4 places, what capacities does it pass through for the first 20 appends, and why might Java prefer 1.5 to 2?"""
answer = """4, 6, 9, 13, 19, 28. Growing by 1.5 resizes a little more often, so it copies somewhat more in total, but it leaves less capacity unused: at worst about a third of the places are spare instead of a half. Java chose to waste less memory at the price of a few more copies. Both keep adding at an amortised one step, because both grow by a factor."""

[hero]
caption = "size 5, capacity 8: five songs in use and three spare places, dashed"
picture = { type = "array", cells = ["Blue Sky", "Rain Dance", "Night Drive", "Sunrise", "Paper Moon", "", "", ""], size = 5, pointers = [[5, "size = 5"]], title = "the playlist: an array of 8 places inside" }

# ---------------------------------------------------------------- act 1
[[act]]
title = "A playlist in a fixed array"
summary = "Four songs fill a `new String[4]`; the fifth throws, and growing one place at a time would cost 499,494 copies for 1,000 songs."
detail = """The playlist starts in a plain array of four places. Four songs fill it, and the fifth fails with `ArrayIndexOutOfBoundsException: Index 4 out of bounds for length 4`: an array's length never changes. The obvious fix is to make a new array one place bigger for every song, copying everything across each time. It works, but the copies pile up: the fifth song copies four, the sixth copies five, the seventh copies six, and 1,000 songs copy 499,494 values in total. Each append gets slower as the list grows."""
speech = """First, the playlist in a fixed array of four places. [[slnc 400]] Four songs fill it. [[slnc 300]] The fifth song fails, with an index out of bounds exception. [[slnc 500]] The obvious fix is a new array, one place bigger, for every song. [[slnc 400]] But each time, every song already there must be copied across. [[slnc 400]] For a thousand songs, that is almost half a million copies."""
console = [["String[] playlist = new String[4]: Blue Sky, Rain Dance, Night Drive, Sunrise", "muted"], ["a fifth song: ArrayIndexOutOfBoundsException: Index 4 out of bounds for length 4", "bad"], ["growing by one place each time, 1,000 songs cost 499,494 copies", "bad"]]
[[act.frame]]
caption = "Four places, four songs, and no index 4 for the fifth"
say = """Here is the full array. [[slnc 300]] Four places, numbered zero to three, and four songs. [[slnc 400]] The fifth song would need index four, which does not exist. [[slnc 300]] So the program stops."""
picture = { type = "array", cells = ["Blue Sky", "Rain Dance", "Night Drive", "Sunrise", "Paper Moon"], size = 4, marks = { "4" = "bad" }, pointers = [[4, "no index 4"]] }
[[act.frame]]
caption = "Growing by one: the fifth song copies 4, the sixth copies 5, the seventh copies 6"
say = """Growing by one place each time means copying everything, every time. [[slnc 400]] The fifth song copies four. [[slnc 300]] The sixth copies five. [[slnc 300]] The seventh copies six. [[slnc 400]] The copies grow with the array, and a thousand songs cost four hundred and ninety nine thousand, four hundred and ninety four of them."""
picture = { type = "group", items = [ { type = "array", cells = ["S1", "S2", "S3", "S4", "S5"], marks = { "4" = "new" }, title = "5 places: 4 copied" }, { type = "array", cells = ["S1", "S2", "S3", "S4", "S5", "S6"], marks = { "5" = "new" }, title = "6 places: 5 copied" }, { type = "array", cells = ["S1", "S2", "S3", "S4", "S5", "S6", "S7"], marks = { "6" = "new" }, title = "7 places: 6 copied" } ], gap = 40 }

# ---------------------------------------------------------------- act 2
[[act]]
title = "Size and capacity"
summary = "The dynamic array keeps 4 places but only 3 in use: size 3, capacity 4; adding the fourth song is 1 step and fills it."
detail = """The dynamic array holds an ordinary array inside and two numbers about it. The **capacity** is how many places the inside array has; the **size** is how many are in use. After three songs, the capacity is 4 and the size is 3: one spare place, drawn dashed. Adding a song writes it into index `size` and adds one to the size: one step, no copying. After the fourth song the size equals the capacity, and the array is full."""
speech = """Now the dynamic array. [[slnc 400]] Inside, it keeps an ordinary array, with room to spare. [[slnc 400]] It remembers two numbers. [[slnc 300]] The capacity: how many places it has. [[slnc 300]] And the size: how many are in use. [[slnc 500]] With three songs, the capacity is four and the size is three."""
console = [["capacity 4, size 3: [Blue Sky, Rain Dance, Night Drive]", "ok"], ["append(\"Sunrise\"): 1 step, capacity 4, size 4, now full", "amber"]]
[[act.frame]]
caption = "Capacity 4, size 3: one spare place, drawn dashed"
say = """Here it is. [[slnc 300]] Four places inside, and three songs. [[slnc 400]] The dashed place is spare. [[slnc 300]] It is not part of the array yet. [[slnc 300]] The size, three, points at it: that is where the next song will go."""
picture = { type = "array", cells = ["Blue Sky", "Rain Dance", "Night Drive", ""], size = 3, pointers = [[3, "size = 3"]] }
[[act.frame]]
caption = "Add Sunrise: written into index 3, size becomes 4. One step, and now full"
say = """Adding Sunrise writes it into index three, and the size becomes four. [[slnc 400]] One step. [[slnc 300]] No copying. [[slnc 400]] But now the size equals the capacity. [[slnc 300]] There are no spare places left."""
picture = { type = "array", cells = ["Blue Sky", "Rain Dance", "Night Drive", "Sunrise"], size = 4, marks = { "3" = "new" }, note = "size 4 = capacity 4: full" }

# ---------------------------------------------------------------- act 3
[[act]]
title = "Full? Double it"
summary = "The fifth song makes an 8-place array and copies 4; the ninth makes 16 and copies 8. 1,000 songs cost 1,020 copies, not 499,494."
detail = """Adding "Paper Moon" to the full array triggers a resize: a new array of 8 places, twice the capacity, and the four songs copied across one by one, then the new song written. The next three songs each take one step. The ninth song finds the array full again and doubles it to 16, copying 8. Nine songs, two resizes, 12 copies. Because each resize doubles the room, resizes get rarer as the array grows: for 1,000 songs the copies add up to 4 + 8 + 16 + ... + 512 = 1,020, about one per song, against 499,494 when growing by one place. That is why adding is called one step "amortised": an occasional big copy, spread over many cheap appends."""
speech = """Now the fifth song, with the array full. [[slnc 400]] The dynamic array makes a new array, twice as big: eight places. [[slnc 400]] It copies the four songs across, and then writes the new one. [[slnc 500]] The next three songs cost one step each. [[slnc 400]] The ninth song finds it full again, and it doubles to sixteen, copying eight."""
console = [["append(\"Paper Moon\"): full, new array of 8 places, 4 songs copied, then 1 write", "amber"], ["3 more songs: 1 step each, capacity 8, size 8", "ok"], ["append(\"Last Train\"): full again, new array of 16 places, 8 songs copied", "amber"], ["9 songs appended, 2 resizes, 12 copies in total", "ok"], ["1,000 appends by doubling: 1,020 copies, about 1 per song (growing by one: 499,494)", "ok"]]
[[act.frame]]
caption = "The resize: a new array of 8, the 4 songs copied across, then Paper Moon written"
say = """Here is the resize. [[slnc 300]] The old array of four, and the new array of eight. [[slnc 400]] The four songs are copied across, in purple. [[slnc 300]] Paper Moon goes into index four. [[slnc 400]] And now there are three spare places, so the next three songs cost one step each."""
picture = { type = "group", items = [ { type = "array", cells = ["Blue Sky", "Rain Dance", "Night Drive", "Sunrise"], title = "old: 4 places, full" }, { type = "array", cells = ["Blue Sky", "Rain Dance", "Night Drive", "Sunrise", "Paper Moon", "", "", ""], size = 5, marks = { "0" = "new", "1" = "new", "2" = "new", "3" = "new", "4" = "hi" }, title = "new: 8 places, 4 copied, 1 written" } ], gap = 40 }
[[act.frame]]
caption = "Doubling: copies of 4, then 8, then 16 ... 1,000 songs cost 1,020 copies, about 1 each"
say = """Why is doubling so much cheaper? [[slnc 400]] Because each resize buys as much room as everything copied so far. [[slnc 400]] Four copies buy four free appends. [[slnc 300]] Eight copies buy eight. [[slnc 400]] For a thousand songs, the copies add up to one thousand and twenty. [[slnc 300]] About one per song. [[slnc 400]] Growing by one place cost almost five hundred times as much."""
picture = { type = "grid", rows = [[4, 8, 16, 32, 64, 128, 256, 512]], col_labels = ["5th", "9th", "17th", "33rd", "65th", "129th", "257th", "513th"], cell_w = 80, cell_h = 52, note = "copies at each resize: 1,020 in total for 1,000 songs" }

# ---------------------------------------------------------------- act 4
[[act]]
title = "The middle, and the spare places"
summary = "insertAt(0) shifts 9 songs; deleteAt(5) shifts 4; a spare place cannot be read; shrinkToFit gives 7 places back."
detail = """Adding at the end is cheap, but the middle is as costly as in any array. Inserting "Intro" at the front shifts all nine songs one place to the right. Deleting index 5, "Paper Moon", shifts the four songs after it one place to the left. After that the capacity is 16 and the size is 9, so 7 places are spare. Those spare places are not part of the array: `get(9)` throws `IndexOutOfBoundsException: Index 9 out of bounds for length 9`, because the array holds nine songs even though the array inside has sixteen places. When no more songs are coming, `shrinkToFit` makes an array of exactly 9 places and copies the 9 songs into it, giving the spare memory back."""
speech = """Now the middle of the array. [[slnc 400]] Inserting an intro at the front shifts all nine songs one place to the right. [[slnc 400]] Deleting index five shifts the four songs after it one place to the left. [[slnc 500]] Now the capacity is sixteen, and the size is nine. [[slnc 300]] Seven spare places."""
console = [["insertAt(0, \"Intro\"): 9 songs shifted right", "amber"], ["deleteAt(5) removed \"Paper Moon\": 4 songs shifted left", "amber"], ["capacity 16, size 9: 7 places spare", "muted"], ["get(9), a spare place: IndexOutOfBoundsException: Index 9 out of bounds for length 9", "bad"], ["shrinkToFit(): capacity 9, 9 songs copied", "ok"]]
[[act.frame]]
caption = "Insert Intro at index 0: all 9 songs shifted one place right"
say = """To put the intro in index zero, every song must shift one place to the right, starting from the last. [[slnc 400]] Nine shifts. [[slnc 300]] The dynamic array made adding at the end cheap, but the front is still expensive."""
picture = { type = "array", cells = ["Intro", "Blue Sky", "Rain Dance", "Night Drive", "Sunrise", "Paper Moon", "Wild Honey", "Echoes", "Firefly", "Last Train"], marks = { "0" = "new", "1" = "hi", "2" = "hi", "3" = "hi", "4" = "hi", "5" = "hi", "6" = "hi", "7" = "hi", "8" = "hi", "9" = "hi" } }
[[act.frame]]
caption = "Size 9, capacity 16: the 7 dashed places are spare, and get(9) is refused"
say = """After deleting one song, nine remain, in an array of sixteen places. [[slnc 400]] The seven dashed places are spare. [[slnc 300]] Asking for index nine is refused, because the array only holds nine songs, numbered zero to eight. [[slnc 400]] Capacity is room. [[slnc 300]] Size is what is stored."""
picture = { type = "array", cells = ["Intro", "Blue Sky", "Rain Dance", "Night Drive", "Sunrise", "Wild Honey", "Echoes", "Firefly", "Last Train", "", "", "", "", "", "", ""], size = 9, marks = { "9" = "bad" }, pointers = [[9, "get(9): not an element"]] }

# ---------------------------------------------------------------- act 5
[[act]]
title = "The bill"
summary = "The one append that resizes at 512 songs copies all 512; at 513 songs 511 of 1,024 places are spare; deleting down to 256 halves the capacity."
detail = """Doubling has two costs. The first is memory: just after a resize, almost half the places are spare. At 513 songs the capacity is 1,024, so 511 places hold nothing. The second is the occasional slow append: most appends are one step, but the one that finds the array full copies everything. Adding the 513th song copies all 512 before it. Averaged over all the appends it is still about one step each, but a program that must never pause, such as live audio, may notice that one append. Deleting gives memory back: when `deleteAtEnd` leaves only a quarter of the array in use, 256 of 1,024, the capacity halves to 512. Java's `ArrayList` makes the same trade when growing, starting at 10 places and growing by half each time rather than doubling, which wastes less memory at the price of a few more copies; it never shrinks by itself."""
speech = """And the bill. [[slnc 400]] Doubling leaves room to spare. [[slnc 300]] At five hundred and thirteen songs, the array has one thousand and twenty four places. [[slnc 300]] Five hundred and eleven are empty. [[slnc 500]] And most appends take one step, but the one that resizes copies everything. [[slnc 400]] At five hundred and twelve songs, one append copies all five hundred and twelve. [[slnc 500]] Deleting gives memory back. [[slnc 300]] When only a quarter of the places are in use, the capacity is halved."""
console = [["the one append that resizes at 512 songs copies 512 of them", "bad"], ["513 songs: capacity 1024, 511 places spare, almost half", "amber"], ["deleteAtEnd down to 256 songs, a quarter of 1024: capacity halves to 512 (1 resize)", "ok"], ["already in Java: java.util.ArrayList, which starts at 10 places and grows by half each time", "muted"]]
[[act.frame]]
caption = "Just after a resize, nearly half the places are spare"
say = """Here is the memory cost, drawn small. [[slnc 300]] Five songs, just after a resize to eight places: three are spare. [[slnc 400]] At five hundred and thirteen songs, it is five hundred and eleven. [[slnc 400]] Doubling trades memory for speed."""
picture = { type = "array", cells = ["S1", "S2", "S3", "S4", "S5", "", "", ""], size = 5, pointers = [[5, "3 of 8 spare"]], note = "at 513 songs: capacity 1,024, 511 spare" }

[animation]
subtitle = "A playlist that grows: size and capacity, doubling when full, the cost of the middle, and the spare places doubling leaves behind."

