required = ["The static array project, or knowing what an array and its index are", "Java basics: classes, methods, `for` loops"]
not_required = ["Java generics (the dynamic-array-generic project)", "Any maths beyond doubling"]

[docs.session]
objectives = [
  "Explain the difference between size and capacity.",
  "Show why growing by one place costs about n squared over 2 copies and doubling about n.",
  "Count the shifts for an insertion or deletion in the middle.",
  "Say what amortised one step means, and when the rare slow append matters.",
]
walkthrough = """Begin with the house-moving analogy. Run the demo and pause after act one: ask the class to guess how many copies 1,000 songs cost when growing by one place, then reveal 499,494. In act three, add up 4 + 8 + 16 + ... + 512 on the board and compare with 1,020. In act four, act out the insert with people standing in a row, everyone stepping right. Close with act five and the memory trade-off, and compare Java's choice of 1.5."""

[docs.explained]
sentence = """A dynamic array is an ordinary array with spare places, which it swaps for one twice as big and copies across whenever it runs out of room, so adding at the end costs one step on average."""
verdict = """Use a dynamic array as your default sequence: fast reads by position, cheap appends at the end, and compact memory. In real Java code that means `ArrayList`. Reach for something else when you work at the front or the middle a lot, or when no single operation may ever pause."""
recognise = [
  "A field array plus a `size` or `count` field that is smaller than the array's length.",
  "`if (size == data.length) grow();` before storing a value.",
  "A new array of `length * 2` (or `length + length / 2`) and a copy loop.",
]

[spec]
purpose = """Teach the dynamic array to a complete beginner: size versus capacity, doubling when full, the cost of copying, and why an append is amortised one step."""
requirements = [
  "Built by hand on a `String[]`: no Java collections or `Arrays` helpers.",
  "`append` writes one element, resizing to double the capacity first when full, and counts every copy.",
  "Growing by one place (`doubling = false`) exists only as the measured comparison.",
  "`get` and `update` refuse indexes outside 0 to size - 1, even where capacity exists.",
  "`insertAt` and `deleteAt` count the elements shifted; deletions clear the place they free and halve the capacity when a quarter full.",
  "`shrinkToFit` shrinks the capacity to the size.",
  "The demo prints five acts whose numbers the tests assert, including 1,020 and 499,494 copies.",
]
nongoals = ["Recursive versions (the dynamic-array-recursive project)", "Generic element types (the dynamic-array-generic project)", "Thread safety"]

