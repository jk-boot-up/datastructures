[[scene]]
key = "01-poster"
kind = "poster"
title = "Dynamic Array"
narration = """Hello, and welcome. [[slnc 400]] This video explains the dynamic array, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A dynamic array is an array that grows by itself. [[slnc 300]] Inside, it keeps an ordinary array with some spare places. [[slnc 400]] When it runs out of room, it shifts everything into a new array, twice as big. [[slnc 700]] Our example is a music playlist that grows, one song at a time. [[slnc 400]] By the end, you will know the difference between size and capacity, why doubling is so much cheaper than growing by one, and what the spare room costs."""

[[scene]]
key = "02-idea"
kind = "structure"
title = "The Everyday Idea"
caption = "Moving to a house twice the size, only when every room is full"
picture = { type = "group", items = [ { type = "array", cells = ["Ann", "Ben", "Cat", "Dan"], title = "house with 4 rooms: full" }, { type = "array", cells = ["Ann", "Ben", "Cat", "Dan", "", "", "", ""], size = 4, marks = { "0" = "new", "1" = "new", "2" = "new", "3" = "new" }, title = "the move: 8 rooms, 4 spare" } ], gap = 60 }
narration = """Think of a family moving house. [[slnc 400]] They buy a house with a few spare bedrooms. [[slnc 300]] Each new child takes a spare room, and nothing else changes. [[slnc 500]] When every room is full, they move to a house twice the size, carrying everything across in one big move. [[slnc 400]] Moving is hard work. [[slnc 300]] But the new house is so much bigger that they will not move again for a long time. [[slnc 500]] That is a dynamic array."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "Two Numbers To Keep Apart"
body = ["size: how many elements are stored", "capacity: how many places the array inside has", "", "spare places = capacity - size", "", "resize: a new, bigger array, every element copied"]
narration = """Two numbers, and it is important to keep them apart. [[slnc 400]] The size is how many songs are stored. [[slnc 400]] The capacity is how many places the array inside has, used or not. [[slnc 500]] The difference is the spare room. [[slnc 400]] And a resize means a new, bigger array, with every element copied across."""

[[scene]]
key = "acts"
kind = "acts"
title = "acts"
narration = ""

[[scene]]
key = "costs"
kind = "bullets"
title = "Time and Space Complexity"
body = ["append: O(1) amortised, O(n) on a resize", "get, update: O(1)", "insertAt, deleteAt: O(n) at the front, O(1) at the end", "linear search: O(n)", "", "extra space: O(1); a resize needs O(n)"]
narration = """Here are the costs in time and space. [[slnc 400]] Append is order one amortised. [[slnc 300]] That means one step on average, counting the rare resize, which costs order n. [[slnc 400]] Get and update are order one. [[slnc 400]] Insert and delete at a position are order n at the front, because of the shifts, and order one at the end. [[slnc 400]] Linear search is order n. [[slnc 500]] Every operation uses order one extra space, except a resize, which needs a whole new array."""

[[scene]]
key = "mistakes"
kind = "bullets"
title = "Common Mistakes"
body = ["growing by a fixed amount: copies pile up", "treating capacity as size", "not clearing a removed place", "deleting from the front in a loop"]
narration = """Four mistakes to watch for. [[slnc 400]] Growing by a fixed amount, such as one place: the copies pile up. [[slnc 300]] Always grow by a factor. [[slnc 400]] Treating the capacity as the size: spare places are not elements. [[slnc 400]] Forgetting to clear a deleted place, so its memory is never freed. [[slnc 400]] And deleting from the front in a loop, which shifts every other element each time."""

[[scene]]
key = "verdict"
kind = "bullets"
title = "When To Use It"
body = ["use it: your default list", "use it: add at the end, read by position", "", "avoid it: lots of work at the front or middle", "avoid it: no single append may ever pause", "", "already in Java: java.util.ArrayList"]
narration = """So, when should you use a dynamic array? [[slnc 400]] Almost always, as your default choice. [[slnc 300]] It is fast to read by position, cheap to add to at the end, and compact. [[slnc 500]] Avoid it when you work at the front or the middle a lot, or when no single append may ever pause. [[slnc 500]] And you have used it already. [[slnc 300]] Java's array list is exactly this, growing by half each time instead of doubling."""

