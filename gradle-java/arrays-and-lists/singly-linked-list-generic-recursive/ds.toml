summary = "Counting a million nodes recursively throws StackOverflowError."
detail = """A million-node list built with `insertAtBeginning` needs no recursion. Counting it recursively needs a frame per node, and Java throws `StackOverflowError`. Generics change what each node refers to; recursion changes how much stack each walk needs."""
speech = """And the limit. [[slnc 400]] A million nodes. [[slnc 300]] Counting them recursively needs a million frames. [[slnc 300]] The stack overflows. [[slnc 500]] Generics change what a node refers to. [[slnc 300]] Recursion changes how much stack a walk needs."""
