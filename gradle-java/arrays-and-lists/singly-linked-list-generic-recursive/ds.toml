# tools/dskit turns it into the README, docs, pictures, animation and video scenes.

[project]
slug = "singly-linked-list-generic-recursive"
category = "arrays-and-lists"
title = "Singly Linked List (Generic, Recursive)"
package = "singlylinkedlistgenericrecursive"
main_class = "GenericRecursiveSinglyLinkedListDemo"
example = "A treasure hunt of Clue records, every operation recursive"
tagline = "Node<T>, then a smaller list"
bold = "The generic recursive singly linked list holds any type T in Node<T>s, matches with equals, and writes every walk as a recursion on node.next, returning the new first node when it changes the list; the time is that of the loop version and the extra space is one frame per node visited."
analogy_short = "A line of finders comparing cards of any kind"
jdk = "Nothing: `java.util.LinkedList<E>` uses loops"
thumb_lines = ["LINKED LIST", "GENERIC + RECURSIVE"]
thumb_code = "search(node.next, key)"
youtube_title = "Generic Recursive Linked List in Java - Node<T>, equals and Recursion"
youtube_tags = ["generic linked list", "recursive linked list", "java generics", "recursion", "Node<T>", "call stack"]
youtube_description = """Generic Recursive Singly Linked List in Java, explained with a treasure hunt of Clue records. We trace a recursive search for a separately made Clue("the red gate", 60): each call asks equals, and on no match searches the rest, until the match at depth 3. We count and print backwards a list of Integers with the same recursion, insert at the end by replacing the empty list at the end with a new node, delete by key by returning node.next from the matching call, delete at the end, and reverse a list of Strings recursively. We finish at the limit: counting a million nodes throws a real StackOverflowError."""

[readme]
intro = """This project combines the two variations of the **singly linked list**. Like `singly-linked-list-generic`, the class has a **type parameter** `T`: each `Node<T>` holds a **reference** to a `T` and a `next` pointer, and elements are matched with **`equals`**. Like `singly-linked-list-recursive`, every walk is a **recursion**: a list is empty or a node followed by a smaller list, so each operation handles one node and calls itself on `node.next`, stopping at a **base case**; operations that change the list **return the new first node**. The time of every operation is that of the loop version; the extra space is one call-stack **frame** per node visited."""
analogy = """Picture the line of finders from the recursive list, one per clue, but now each holds a card that could be anything: a place, a number, a photograph. You hand the first finder a card and ask where the matching one is. They compare their card with yours; if it does not match, they pass the question to the next finder and wait. Each finder only needs to know how to compare two cards of that kind."""
example = """The treasure hunt of `Clue(place, metres)` records, beside the same class holding distances and place names. The demo traces a recursive search, counts and prints backwards, inserts, deletes by key and at the end, reverses, and finally counts a million nodes recursively."""
why = """Generic recursive code over nodes is the form of almost every tree algorithm later in the course: `insert(node.left, key)`, `search(node.right, key)`, with `compareTo` or `equals` on a type parameter. Seeing it first on a list, where there is only one recursive call per node, makes those algorithms easier to read."""
when_use = [
  "Learning the generic recursive style used for trees.",
  "Short lists, or operations whose work is on the way back, such as display in reverse.",
]
when_not = [
  "Long lists: one frame per node overflows the call stack. Use `singly-linked-list-generic`.",
]
met_before = [
  "`singly-linked-list-generic` and `singly-linked-list-recursive`.",
  "Generic recursive methods such as `<T> int count(Node<T> node)` in textbooks.",
]

