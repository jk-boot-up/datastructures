[readme]
intro = """A **generic singly linked list** is the `singly-linked-list` project written once for **any element type**. The class is `GenericSinglyLinkedList<T>` and each node is a `Node<T>`: its `data` is a **reference** to an object of type `T`, and its `next` is a pointer to the following `Node<T>`. The same class holds place names (`String`), distances (`Integer`) or clues of our own (`Clue`), and the compiler refuses anything else. Nodes are matched with **`equals`**, which compares contents; `T` needs no ordering, so it may be any type. Every operation and every cost is unchanged: insertion and deletion at the beginning in O(1), reaching a position in O(n)."""
analogy = """Picture the treasure-hunt trail again, but now each signpost holds a slip that says where the prize for this stop is kept, rather than the prize itself, plus the direction to the next signpost. The trail does not care whether the prizes are coins, books or maps: the signposts work the same for all. To ask whether a stop has "the fountain, 50 metres", you compare what the slip describes, not the slip itself."""
example = """The treasure hunt from `singly-linked-list`, held three ways by one class: the six place names, the distances between clues in metres, and `Clue(place, metres)` records. The demo counts nodes, searches for a separately made `Clue`, inserts and deletes by key, deletes at both ends, and reverses the distances and the names with the same code."""
why = """Without generics, a list of place names, a list of distances and a list of clues would need three copies of the same linked-list code, or one list of `Object` that accepts anything and needs a cast on every read. A type parameter gives one class for every type, checked by the compiler. Every later structure in the course that is built from nodes, stacks, queues and trees, is written this way."""
when_use = [
  "A linked list of objects of one type, when inserting and deleting at the beginning is common.",
  "The building block for generic stacks and queues.",
]
when_not = [
  "Reading by position: use an array or `ArrayList<E>`.",
  "Deleting at the end or walking backwards often: use a doubly linked list.",
]
met_before = [
  "`java.util.LinkedList<E>` and every other generic collection.",
  "`Node<T>` in almost every textbook's generic list, stack and queue.",
]

