[[scene]]
key = "costs"
kind = "bullets"
title = "Time and Space Complexity"
body = ["insert, delete at beginning: O(1)", "insert, delete at end: O(n)", "at a position: O(n) to reach, O(1) to link", "search, get, count, display, reverse: O(n)", "", "the same as the String-only list"]
narration = """Here are the costs. [[slnc 400]] Insertion and deletion at the beginning are order one. [[slnc 400]] At the end, order n. [[slnc 400]] At a position, order n to reach it, and order one to link. [[slnc 400]] Search, get, count, display and reverse are order n. [[slnc 500]] Exactly the same as the string-only list."""

[[scene]]
key = "compare"
kind = "bullets"
title = "Compared With Related Structures"
body = ["String-only list: the same costs, one type", "generic dynamic array: O(1) access, a cast inside", "generic list: no cast, nodes are Node<T>", "", "Java's own: LinkedList<E>, linked both ways"]
narration = """How does it compare? [[slnc 400]] The string-only list has the same costs, for one type. [[slnc 400]] The generic dynamic array reaches any position in one step, but needs a cast inside. [[slnc 400]] The generic list needs no cast at all. [[slnc 400]] And Java's own linked list is generic in the same way, linked in both directions."""

