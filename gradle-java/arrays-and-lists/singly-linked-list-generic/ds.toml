narration = """Hello, and welcome. [[slnc 400]] This video explains the generic singly linked list, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] It is a chain of nodes, written once for any type of data. [[slnc 300]] Each node holds a reference to its data, and a pointer to the next node. [[slnc 700]] Our example is a treasure hunt, held as place names, as distances, and as clues. [[slnc 400]] By the end, you will know how to write a generic node and list, what a node really holds, and why elements are matched with equals."""

[[scene]]
key = "02-idea"
kind = "structure"
title = "The Everyday Idea"
caption = "Each signpost says where this stop's prize is kept, and where the next signpost is"
picture = { type = "linked", nodes = ["sign 1", "sign 2", "sign 3", "sign 4"], pointers = [[0, "start"]] }
narration = """Think of the treasure trail again. [[slnc 400]] Each signpost holds a slip saying where this stop's prize is kept, and points to the next signpost. [[slnc 500]] The trail does not care whether the prizes are coins, books, or maps. [[slnc 400]] The signposts work the same for all of them. [[slnc 500]] That is a generic linked list."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["T: the element type", "Node<T>: data of type T, and next", "reference: the node points at its data", "equals: compare contents, not references"]
narration = """The words. [[slnc 400]] T is the element type, filled in at each use. [[slnc 400]] A node of T holds data of type T, and a next pointer. [[slnc 400]] The data is a reference: the node points at the object. [[slnc 400]] And equals compares contents, not references."""

