speech = """First, one class for any type. [[slnc 400]] The same linked list holds the place names, as strings. [[slnc 300]] It holds the distances, as integers. [[slnc 300]] And it holds clues, a type of our own. [[slnc 500]] The compiler checks each one. [[slnc 300]] Putting a word into the list of distances does not compile."""
