# ---------------------------------------------------------------- act 2
[[act]]
title = "Node<T>: data is a reference"
summary = "count() takes 6 steps; each Node<Clue> holds a reference to a Clue and a next pointer, not a copy of the Clue."
detail = """Each `Node<Clue>` holds two references: `data`, to a `Clue` object stored elsewhere, and `next`, to the following node. Counting still means following next pointers from the head: 6 steps for 6 clues. The head's `data` is the very `Clue` object that was inserted; the node refers to it and holds no copy. Unlike a generic array, a linked list needs no cast: every node is created as `new Node<>(data, null)`."""
speech = """What does a node hold? [[slnc 400]] Two references. [[slnc 300]] One to the clue, which lives elsewhere in memory. [[slnc 300]] And one to the next node. [[slnc 500]] The node does not contain a copy of the clue. [[slnc 300]] It points at it. [[slnc 400]] Counting is still six steps along the next pointers."""
console = [["count() = 6: 6 steps; each Node<Clue> holds a reference to a Clue and a next pointer", "ok"], ["head.data is the Clue object the oak tree (40 m); the node points at it, it does not contain a copy", "muted"]]
[[act.frame]]
caption = "A Node<Clue>: data refers to a Clue object; next refers to the following node"
say = """Here is one node. [[slnc 300]] Its data arrow goes to the clue. [[slnc 300]] Its next arrow goes to the next node."""
picture = { type = "linked", nodes = ["node: data", "Clue: oak tree, 40 m"], null_end = false, title = "data is a reference" }

# ---------------------------------------------------------------- act 3
[[act]]
title = "Search and deletion with equals"
summary = "A separately made Clue(\"the fountain\", 50) is found at position 4 with 5 equals comparisons, though it is a different object; insertAtPosition changes 2 pointers; deleteByKey finds the red gate in 4 comparisons."
detail = """A new `Clue("the fountain", 50)` is made and searched for. Search compares each node's data with `equals`, and a record's `equals` compares its fields, so it is found at position 4 after 5 comparisons, although `==` says it is a different object. Insertion and deletion are the plain list's pointer work: `insertAtPosition(1, the mill)` changes 2 pointers, and `deleteByKey(new Clue("the red gate", 60))` walks with `prev` and `current`, matching with `equals`, and changes 1 pointer."""
speech = """Now search. [[slnc 400]] We make a new clue: the fountain, fifty metres. [[slnc 400]] Search compares with equals, and a record's equals compares its fields. [[slnc 300]] So it is found, at position four. [[slnc 400]] But it is a different object: double equals would have missed it. [[slnc 500]] Insertion and deletion change pointers exactly as before."""
console = [["search(new Clue(\"the fountain\", 50)) = position 4: 5 comparisons; a record's equals compares place and metres", "ok"], ["the same object? false: equals, not ==, is what matches", "amber"], ["insertAtPosition(1, the mill (30 m)): 2 pointers changed", "ok"], ["deleteByKey(new Clue(\"the red gate\", 60)) = true: 4 comparisons, 1 pointer changed", "ok"]]
[[act.frame]]
caption = "search with equals: positions 0 to 3 differ, position 4 equals the new Clue"
say = """Here is the search. [[slnc 300]] Four clues that are not equal. [[slnc 300]] The fifth, the fountain at fifty metres, is equal. [[slnc 300]] Five comparisons."""
picture = { type = "linked", nodes = ["oak tree", "old well", "red gate", "bridge", "fountain"], marks = { "0" = "dim", "1" = "dim", "2" = "dim", "3" = "dim", "4" = "ok" }, pointers = [[4, "equals"]] }

# ---------------------------------------------------------------- act 4
[[act]]
title = "Deleting at both ends"
summary = "deleteAtBeginning changes 1 pointer; deleteAtEnd walks 3 steps; the removed nodes and Clues can be garbage-collected; an empty list is an underflow."
detail = """`deleteAtBeginning` moves `head` on one node: the oak tree is gone, 1 pointer changed. `deleteAtEnd` walks to the second-to-last node, 3 steps on 5 nodes, and sets its next to null: the chest is gone. Nothing refers to the removed nodes any more, so the garbage collector can free them, and the `Clue` objects too if nothing else refers to them. Deleting from an empty list is refused as an underflow."""
speech = """Deleting at both ends. [[slnc 400]] Deleting at the beginning moves the head: one pointer. [[slnc 400]] Deleting at the end walks to the node before the last: three steps. [[slnc 500]] Nothing refers to the removed nodes now, so Java can free them. [[slnc 400]] And deleting from an empty list is an underflow."""
console = [["deleteAtBeginning() = the oak tree (40 m): 1 pointer changed", "ok"], ["deleteAtEnd() = the chest (20 m): 3 steps to the second-to-last node", "amber"], ["no node refers to them now, so the garbage collector can free both nodes and both Clues", "muted"], ["an empty list, deleteAtEnd(): underflow: the list is empty", "bad"]]
[[act.frame]]
caption = "After both deletions: the mill is the head, the fountain the last node"
say = """Here is the list now. [[slnc 300]] The mill is at the head, and the fountain's next is null."""
picture = { type = "linked", nodes = ["mill 30", "old well 25", "bridge 35", "fountain 50"], pointers = [[0, "head"]] }

# ---------------------------------------------------------------- act 5
[[act]]
title = "The same algorithm for every type"
summary = "reverse() makes 7 pointer changes on six Integers and on six Strings, with the very same code."
detail = """`reverse` is the three-pointer loop of the plain list. On the six distances it turns six next pointers around and moves `head`: 7 pointer changes, giving 20, 50, 35, 60, 25, 40. On the six place names it does exactly the same, 7 changes. Every cost of the generic list equals the String-only list: generics change the element type, not the algorithm. Java's `java.util.LinkedList<E>` is generic in the same way, though it links both ways."""
speech = """One algorithm for every type. [[slnc 400]] Reverse turns every next pointer around. [[slnc 400]] On the distances, seven pointer changes. [[slnc 300]] On the place names, the very same seven. [[slnc 500]] Generics change the type of the data. [[slnc 300]] They do not change the algorithm, or its cost."""
console = [["<Integer> reverse(): 7 pointer changes; head -> 20 -> 50 -> 35 -> 60 -> 25 -> 40 -> null", "ok"], ["<String>  reverse(): 7 pointer changes, the very same code", "ok"], ["every cost equals the String-only list: generics change the type, not the algorithm", "muted"], ["already in Java: java.util.LinkedList<E>, generic the same way (and linked both ways)", "muted"]]
[[act.frame]]
