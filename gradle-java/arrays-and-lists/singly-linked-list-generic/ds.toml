narration = """Four mistakes to watch for. [[slnc 400]] Matching with double equals. [[slnc 400]] Using the raw types without angle brackets. [[slnc 400]] Setting the insertion pointers in the wrong order. [[slnc 400]] And changing an object after inserting it, forgetting that the list shares it."""

