listing_intro = """Each operation is a public method and a private recursive one that takes a node. In each, find the base case first, then the one call on `node.next`. `steps.enter()` and `steps.exit()` only measure the depth."""
[[listing]]
op = "Count"
method = "RecursiveSinglyLinkedList#count"
note = """The recursive definition, word for word: the empty list has 0 nodes; any other list has 1 plus the count of the rest. The addition waits for the call, so every node's frame is on the stack at the deepest point."""
[[listing]]
op = "Display in reverse"
method = "RecursiveSinglyLinkedList#displayReverse"
note = """The only change from `display` is the order of two lines: the recursive call comes first, and the node's data is appended afterwards, on the way back. A loop would need its own stack to do this; the call stack is that stack."""
[[listing]]
op = "Insertion at the end"
method = "RecursiveSinglyLinkedList#insertAtEnd"
note = """The textbook pattern for a changing operation: the method returns the first node of the list it was given. At the end, the empty list is replaced by the new node (the base case); every other call stores the result in `node.next` and returns `node` unchanged."""
[[listing]]
op = "Deletion by key"
method = "RecursiveSinglyLinkedList#deleteByKey"
note = """No `prev` pointer is needed. The call that finds the key returns `node.next` instead of `node`, and its caller stores that in its own `next`: the node is skipped. The earlier calls just return themselves."""
[[listing]]
op = "Reversal"
method = "RecursiveSinglyLinkedList#reverse"
note = """Reverse the rest first; its last node is `node.next`, still reachable from `node`. Then `node.next.next = node` hangs this node after it, and `node.next = null` makes it the end. The old last node, the base case, is returned all the way up as the new head."""

