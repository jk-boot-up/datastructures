# ---------------------------------------------------------------- act 4
[[act]]
title = "Deletion and reversal, recursively"
summary = "deleteByKey finds the red gate at depth 4 and returns node.next in its place; deleteAtEnd is 6 deep; reverse is 5 deep on 6 nodes."
detail = """`deleteByKey` needs no `prev` pointer. Each call compares its node with the key; the call holding "the red gate" returns `node.next`, the bridge, instead of itself, and the call before it, the old well, stores that as its next: the red gate is skipped. 4 comparisons, depth 4. `deleteAtEnd` recurses to the last node, "the island", whose call returns `null`, so the chest's next becomes null: depth 6. `reverse` reverses the rest first, then hangs this node on its end with `node.next.next = node; node.next = null`; on 6 nodes it goes 5 deep, and the old last node, the chest, comes back as the new head."""
speech = """Deletion and reversal. [[slnc 400]] Delete by key needs no previous pointer. [[slnc 300]] The call holding the red gate returns the node after it, instead of itself. [[slnc 400]] The call before stores that, and the red gate is skipped. [[slnc 500]] Reverse reverses the rest of the list first. [[slnc 300]] Then it hangs this node on the end. [[slnc 400]] The chest comes back up as the new head."""
