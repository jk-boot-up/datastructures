[project]
slug = "singly-linked-list-recursive"
category = "arrays-and-lists"
title = "Singly Linked List (Recursive)"
package = "singlylinkedlistrecursive"
main_class = "RecursiveSinglyLinkedListDemo"
example = "A treasure hunt of clues, every operation written recursively"
tagline = "A list is a node, then a smaller list"
bold = "Seen recursively, a list is either empty or a node followed by a smaller list, so every operation handles one node and calls itself on node.next until the empty list or its target; changing operations return the new first node, as in node.next = deleteByKey(node.next, key); the time is the same as with loops, the extra space is one frame per node visited."
analogy_short = "Each clue-finder asks the next finder to handle the rest of the trail"
jdk = "Nothing: `java.util.LinkedList` uses loops"
thumb_lines = ["LINKED LIST", "RECURSIVE"]
thumb_code = "1 + count(node.next)"
youtube_title = "Singly Linked List in Java, Recursively - Count, Reverse, Delete by Key"
youtube_tags = ["recursive linked list", "linked list recursion", "reverse linked list recursively", "singly linked list", "call stack", "stack overflow"]
youtube_description = """Singly Linked List in Java, written recursively, explained with a treasure hunt of clues. We start from the recursive definition, a list is empty or a node followed by a smaller list, and trace count(the oak tree) = 1 + count(rest) down to count(null) = 0, six calls deep. We display the hunt forwards and, by printing after the recursive call instead of before it, backwards. We search, get, insert at the end and at a position recursively, delete by key by returning node.next in place of the matching node, delete at the end, and reverse the list by reversing the rest and hanging each node on its end. We finish at the limit: counting a million nodes recursively throws a real StackOverflowError, where the loop version needs O(1) extra space."""

[readme]
intro = """A **singly linked list** is a chain of **nodes**, each holding its **data** and a **next pointer**, reached from a **head** pointer. This project writes every operation **recursively**, from the recursive view of a list: a list is either **empty** (`null`) or a **node followed by a smaller list** (`node.next`). Every operation therefore has a **base case**, the empty list or the node it is looking for, and a **recursive case** that handles one node and calls itself on `node.next`. Operations that change the list follow the textbook pattern: the private method returns the new first node of the list it was given, and the caller stores it, as in `node.next = deleteByKey(node.next, key)`. The time of every operation is the same as in the loop version, `singly-linked-list`; the extra space is one call-stack **frame** per node visited."""
analogy = """Picture the treasure hunt run by a team of finders, one per clue. You ask the first finder how many clues are left. They do not walk the trail; they say "one, plus however many the next finder counts", and wait. The next finder says the same, and waits. The finder after the last clue finds nothing and says "zero": that is the base case. Then the answers come back up the line, each finder adding one. While the question travels down, every finder asked is standing there waiting: that is the call stack."""
example = """The treasure hunt from `singly-linked-list`: six clues from the oak tree to the chest. The demo traces a recursive count, displays the hunt forwards and backwards, searches, gets, inserts at the end and at a position, deletes by key and at the end, reverses the list, and finally counts a million nodes recursively."""
why = """Linked lists are defined recursively in most textbooks, and many list algorithms are simplest written that way: counting, printing in reverse, deleting by key without a separate `prev` pointer, and reversing. Recursion on lists is also the step between recursion on arrays and recursion on trees, where a node has two smaller structures instead of one. The cost, one frame per node, is exactly what makes long lists dangerous to recurse over."""
when_use = [
  "Printing a list in reverse, or any operation whose work happens on the way back.",
  "Short lists, where the depth is small.",
  "Learning: the same patterns are used on trees, where the depth is only the height.",
]
when_not = [
  "Long lists: a million nodes overflow Java's call stack. Use the loops of `singly-linked-list`.",
  "When O(1) extra space matters.",
]
met_before = [
  "Lisp and Haskell lists: `(cons head rest)` and `x : xs`, defined exactly this way.",
  "The recursive reverse, a classic interview question.",
  "Tree traversals, which recurse on two children instead of one next pointer.",
]

