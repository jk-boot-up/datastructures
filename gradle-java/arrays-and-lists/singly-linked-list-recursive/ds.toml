# ---------------------------------------------------------------- act 5
[[act]]
title = "The limit of recursion"
summary = "A million nodes built with insertAtBeginning (no recursion); a recursive count() throws StackOverflowError."
detail = """Building a million-node list with `insertAtBeginning` is fine: each insertion is two pointer changes with no recursion. Counting it recursively is not: one frame per node, and the call stack runs out long before a million, so Java throws `StackOverflowError`. The loop in `singly-linked-list` counts the same list with O(1) extra space. On lists, recursion depth equals the length; on balanced trees, later in the course, it is only the height, which is why recursion is the natural tool there."""
speech = """And the limit. [[slnc 400]] We build a million nodes, inserting at the beginning, with no recursion at all. [[slnc 400]] Then we count them recursively. [[slnc 300]] One frame per node. [[slnc 300]] The call stack runs out, and Java throws a stack overflow error. [[slnc 500]] The loop version counts them with order one extra space."""
