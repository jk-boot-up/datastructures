[[mistake]]
mistake = "Forgetting to store the returned node"
happens = "Writing `insertAtEnd(node.next, data);` without `node.next =` drops the new node: it is never linked in."
fix = "Always `node.next = insertAtEnd(node.next, data);` and `head = insertAtEnd(head, data);`."
[[mistake]]
mistake = "No base case for the empty list"
happens = "`node.next` on `null` throws NullPointerException."
fix = "Check `node == null` first in every recursive method."
[[mistake]]
mistake = "In reverse, forgetting `node.next = null`"
happens = "The old first node still points to the second, which now points back to it: a two-node cycle."
fix = "After `node.next.next = node`, set `node.next = null`."
[[mistake]]
mistake = "Recursing over long lists"
happens = "One frame per node: a million nodes overflow the call stack."
fix = "Use loops for long lists; recursion where the depth is small."

[[exercise]]
level = "easy"
question = """Write a recursive `int countOccurrences(Node node, String key)`. What is its base case, and its extra space?"""
answer = """```java
int countOccurrences(Node node, String key) {
    if (node == null) return 0;                               // base case
    return (node.data.equals(key) ? 1 : 0) + countOccurrences(node.next, key);
}
```
Base case: the empty list. O(n) time and O(n) stack."""
[[exercise]]
level = "medium"
question = """Write a recursive `String getLast(Node node)` that returns the data of the last node. How deep does it go on the six clues?"""
answer = """```java
String getLast(Node node) {
    if (node == null) return null;                             // an empty list has no last node
    if (node.next == null) return node.data;                   // base case: this is the last node
    return getLast(node.next);
}
```
It makes one call per node before the last: 5 waiting calls on six clues, returning "the chest". O(n) time and stack."""
[[exercise]]
level = "harder"
question = """Write a recursive `Node insertSorted(Node node, String data)` that inserts into a list kept in alphabetical order, returning the new first node. Use it to build the six clues in alphabetical order."""
answer = """```java
Node insertSorted(Node node, String data) {
    if (node == null || data.compareTo(node.data) <= 0) {
        return new Node(data, node);                           // base case: it goes in front of this list
    }
    node.next = insertSorted(node.next, data);
    return node;
}
```
Called as `head = insertSorted(head, clue)` for each clue. The list becomes: the bridge, the chest, the fountain, the oak tree, the old well, the red gate. Each insertion is O(n) time and stack in the worst case."""

