[[scene]]
key = "01-poster"
kind = "poster"
title = "Singly Linked List (Recursive)"
narration = """Hello, and welcome. [[slnc 400]] This video explains the singly linked list, written recursively, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] Seen recursively, a list is either empty, or a node followed by a smaller list. [[slnc 400]] So every operation handles one node, and calls itself on the rest, until it reaches the empty list. [[slnc 700]] Our example is a treasure hunt of clues. [[slnc 400]] By the end, you will know how to count, print backwards, delete and reverse a list recursively, and what the call stack costs."""

[[scene]]
key = "02-idea"
kind = "structure"
title = "The Everyday Idea"
caption = "Each finder says: one, plus whatever the next finder counts"
picture = { type = "linked", nodes = ["finder 1", "finder 2", "finder 3", "nobody"], marks = { "3" = "ok" }, pointers = [[0, "you ask"], [3, "says 0"]] }
narration = """Think of a treasure hunt run by a team of finders, one for each clue. [[slnc 400]] You ask the first finder how many clues are left. [[slnc 400]] They say: one, plus however many the next finder counts. [[slnc 300]] And they wait. [[slnc 400]] The next finder says the same, and waits. [[slnc 500]] After the last clue there is nobody, and the answer is zero. [[slnc 300]] That is the base case. [[slnc 400]] Then the answers come back, each finder adding one."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["a list: empty (null), or a node + a smaller list", "base case: the empty list, or the target", "recursive case: this node, then node.next", "changing a list: return the new first node", "", "recursion depth: one frame per node visited"]
narration = """The words. [[slnc 400]] A list is either empty, or a node followed by a smaller list. [[slnc 400]] The base case is the empty list, or the node you are looking for. [[slnc 400]] The recursive case handles this node, and calls itself on the next. [[slnc 400]] A method that changes the list returns the new first node. [[slnc 400]] And the depth is one frame per node visited."""

