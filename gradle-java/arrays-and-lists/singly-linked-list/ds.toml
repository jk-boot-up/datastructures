# ---------------------------------------------------------------- act 5
[[act]]
title = "Reversal, and the bill"
summary = "reverse turns 6 next pointers around and moves head: 7 pointer changes, no data moved; get(999) takes 999 steps and insertAtEnd on 1,000 nodes takes 999."
detail = """Reversal is the classic three-pointer loop: `next` saves the rest of the list, `current.next` is turned to point back at `prev`, and all three move on one node. Six next pointers are turned around, then `head` moves to the old last node: 7 pointer changes, and no clue is moved. The costs show at scale. Reaching position 999 of 1,000 follows 999 pointers, where an array takes one step, and `insertAtEnd` walks 999 steps when only `head` is kept. Each node also holds a next pointer and an object header, about 24 bytes, where an `int` in an array takes 4. Java's `java.util.LinkedList` is a linked list that links both ways."""
speech = """Now reversal. [[slnc 400]] Three pointers walk the list: previous, current, and next. [[slnc 400]] Each node's next pointer is turned around to point backwards. [[slnc 400]] Seven pointer changes, and no clue moves. [[slnc 500]] And the bill. [[slnc 300]] Reaching position nine hundred and ninety nine takes nine hundred and ninety nine steps. [[slnc 300]] An array takes one."""
