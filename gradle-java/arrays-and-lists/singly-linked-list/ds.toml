[[scene]]
key = "01-poster"
kind = "poster"
title = "Singly Linked List"
narration = """Hello, and welcome. [[slnc 400]] This video explains the singly linked list, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A singly linked list is a chain of nodes. [[slnc 300]] Each node holds its data, and a next pointer to the following node. [[slnc 400]] The list remembers only the first node, called the head. [[slnc 400]] Inserting or deleting changes a pointer or two, and no data moves. [[slnc 700]] Our example is a treasure hunt, where each clue says where the next one is. [[slnc 400]] By the end, you will know every textbook operation on a linked list, what each one costs, and the one mistake that loses half the list."""

[[scene]]
key = "02-idea"
kind = "structure"
title = "The Everyday Idea"
caption = "Each clue only knows where the next one is"
picture = { type = "linked", nodes = ["start", "oak tree", "old well", "chest"], pointers = [[0, "you begin here"]] }
narration = """Think of a treasure hunt. [[slnc 400]] You are handed the first clue. [[slnc 300]] It says: the next clue is under the oak tree. [[slnc 400]] Under the oak tree, a clue sends you to the old well. [[slnc 400]] Nobody has a map of every clue. [[slnc 300]] Each clue only knows where the next one is. [[slnc 500]] To add a clue, you rewrite one clue to point at the new spot. [[slnc 400]] But to reach the last clue, you must walk the whole trail. [[slnc 500]] That is a linked list."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["node: data and a next pointer", "head: the first node, the only one stored", "null: the next of the last node", "current, prev: the pointers used to walk"]
narration = """The words a textbook uses. [[slnc 400]] A node holds its data, and a next pointer. [[slnc 400]] The head is the first node, and it is the only one the list stores. [[slnc 400]] Null is the next pointer of the last node, and marks the end. [[slnc 400]] And current and prev are the two pointers used to walk the list."""

