# ---------------------------------------------------------------- act 3
[[act]]
title = "Search, insertion and deletion"
summary = "search finds the fountain in 5 comparisons; get(3) takes 3 steps; insertAtPosition and insertAtBeginning change 2 pointers each; deleteByKey, deleteAtBeginning and deleteAtEnd change 1."
detail = """There is no jumping: `search("the fountain")` compares node after node and finds it at position 4 after 5 comparisons, and `get(3)` follows 3 next pointers. Insertion changes pointers only: `insertAtPosition(1, "the mill")` walks to the oak tree, points the mill at the old well, then points the oak tree at the mill: 2 pointer changes, nothing shifted. `insertAtBeginning("the start")` points the new node at the old head and moves `head`: 2 changes. Deletion changes one pointer: `deleteByKey("the red gate")` walks with `prev` and `current` and sets the old well's next past the red gate; `deleteAtBeginning` moves `head` on one node; `deleteAtEnd` walks 4 steps to the second-to-last node, the fountain, and sets its next to null."""
speech = """Now the textbook operations. [[slnc 400]] Search compares node after node: five comparisons to find the fountain. [[slnc 400]] Inserting the mill at position one walks to the oak tree, then changes two pointers. [[slnc 300]] Nothing shifts. [[slnc 500]] Inserting at the beginning also changes two pointers. [[slnc 400]] Deleting the red gate points the old well past it: one pointer. [[slnc 400]] Deleting at the beginning moves the head. [[slnc 300]] And deleting at the end walks to the node before the last."""
