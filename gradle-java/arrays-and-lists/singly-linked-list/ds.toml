listing_intro = """The operations every textbook chapter on linked lists shows, exactly as they appear in `SinglyLinkedList.java`. Each walks the list with a `current` pointer, or with `prev` one node behind it when the node before must change."""
[[listing]]
op = "Insertion at the beginning"
method = "SinglyLinkedList#insertAtBeginning"
note = """Two pointer changes: the new node points to the old head, then the head points to the new node. No traversal, so O(1) however long the list is. On an empty list `head` is `null`, and the same two lines still work."""
[[listing]]
op = "Insertion at the end"
method = "SinglyLinkedList#insertAtEnd"
note = """With only a head pointer, the last node must be found by walking: `while (current.next != null) current = current.next;`. That is O(n). Keeping a `tail` pointer makes it O(1); exercise two adds one."""
[[listing]]
op = "Insertion at a position"
method = "SinglyLinkedList#insertAtPosition"
note = """Walk to `prev`, the node before the position. Then the order of the two pointer changes matters: first the new node points to the rest (`newNode.next = prev.next`), and only then does `prev` point to the new node. The other order loses the rest of the list, as act four shows."""
[[listing]]
op = "Deletion by key"
method = "SinglyLinkedList#deleteByKey"
note = """`prev` follows one node behind `current`. When `current` holds the key, `prev.next = current.next` points past it, and the node is no longer reachable. Deleting the head is the special case: `head = current.next`."""
[[listing]]
op = "Reversal"
method = "SinglyLinkedList#reverse"
note = """The classic three-pointer loop. `next` saves the rest of the list before `current.next` is turned to point backwards at `prev`; then all three move one node on. At the end, `prev` is the old last node, which becomes the head."""

