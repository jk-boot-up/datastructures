youtube_title = "Singly Linked List in Java - Insertion, Deletion, Search and Reverse"
youtube_tags = ["singly linked list", "linked list java", "node next pointer", "linked list insert", "linked list vs array"]
youtube_description = """Singly Linked List in Java, explained with a treasure hunt where each clue says where the next one is hidden. We start with the hunt in an array, where one new clue near the front shifts five others. Then we build the list by hand, the way a C textbook does: a Node with data and a next pointer, and a head. We run every textbook operation and count the real cost: insertAtEnd walking to the last node, count by traversal, search in 5 comparisons, insertAtPosition and insertAtBeginning changing 2 pointers and shifting nothing, deleteByKey, deleteAtBeginning and deleteAtEnd. Then we set the two pointers of an insertion in the wrong order and watch a clue point at itself and four clues vanish. We finish by reversing the list with three pointers, prev, current and next, and with the bill: 999 steps to reach position 999, where an array takes one."""

[readme]
intro = """A **singly linked list** keeps its values in separate **nodes** that can sit anywhere in memory. Each node holds its **data** and a **next pointer** (in Java, a reference) to the next node. The last node's pointer is `null`: it points nowhere. The list itself remembers only the first node, the **head**. Because nothing is side by side, inserting or deleting means changing a pointer or two, and no data moves. This project builds one by hand, the way a C textbook does with `struct node { data; struct node *next; }`, with the textbook operations: insertAtBeginning, insertAtEnd, insertAtPosition, deleteAtBeginning, deleteAtEnd, deleteAtPosition, deleteByKey, search, display, count and reverse."""
analogy = """Think of a treasure hunt. The first clue is handed to you. It says: the next clue is under the oak tree. Under the oak tree, a clue says: the next one is in the old well. Nobody gives you a map of every clue; each one only knows where the next is. To add a clue, you rewrite just one clue to point at the new spot, and the new clue points on to where that one used to lead. To reach the sixth clue, though, you have to walk the whole trail from the start."""
example = """A treasure hunt has six clues, in order: the oak tree, the old well, the red gate, the bridge, the fountain and the chest. The organisers keep adding and removing clues as they plan the route. The demo stores the hunt first in an array and then as a linked list, searches it, inserts a clue at a position and at the front, deletes by key, at the beginning and at the end, sets two pointers in the wrong order to see what is lost, and reverses the list."""
why = """In an array, a new clue near the front means every later clue shifts one place to make room: five shifts for a hunt of six, a million for a list of a million. A linked list never moves data. Once you have reached the right node, inserting is two pointer changes and deleting is one, however long the list is."""
when_use = [
  "You insert and delete a lot, especially at the beginning, and rarely jump to a position.",
  "You do not know the size in advance and do not want spare places.",
  "You build other structures: stacks and queues are often a linked list inside.",
]
when_not = [
  "You read by position: node n is n steps away, where an array takes one step.",
  "Memory matters: each node carries a pointer and an object header as well as its value.",
  "You need to walk backwards: a singly linked list only points forwards (see the doubly linked list).",
]
met_before = [
  "A treasure hunt, a chain of emails replying to each other, a train of carriages.",
  "`java.util.LinkedList` is a linked list that links both ways.",
  "Every Java object reference is a pointer of this kind; a linked list is just objects pointing at objects.",
]

[[word]]
term = "node"
meaning = "One element of the list: its `data` and a `next` pointer to the following node. Here it is the class `Node`."
[[word]]
term = "next pointer"
meaning = "The field `next` in every node: a reference (in C, a pointer) to the following node."
[[word]]
term = "head"
meaning = "The first node. The list only remembers this one; every other node is found by following pointers."
[[word]]
term = "null"
meaning = "A pointer that points nowhere. The last node's `next` is `null`, which marks the end."
[[word]]
term = "traverse"
meaning = "To visit the nodes one by one by following next pointers. Each move to the next node is one step, and the demo counts them."
[[word]]
term = "pointer change"
meaning = "Setting one pointer (head or a next) to a different node. Inserting takes two; deleting takes one."
[[word]]
term = "prev and current"
meaning = "The two pointers used to walk a list: `current` is the node being looked at, `prev` the one before it, needed to delete `current` or insert before it."

