  ["Insert at the end", "O(n), or O(1) with a tail pointer", "O(1) with a tail pointer", "O(1) amortised"],
  ["Delete at the end", "O(n): needs the second-to-last node", "O(1): tail.prev", "O(1)"],
  ["Insert / delete in the middle, once reached", "O(1)", "O(1)", "O(n) shifts"],
  ["Search", "O(n)", "O(n)", "O(n); O(log n) if sorted"],
  ["Walk backwards", "not possible", "yes", "yes"],
  ["Extra memory per element", "one next pointer and an object header", "two pointers and a header", "spare capacity"],
]

pros = [
  "Insertion and deletion at the beginning in O(1), and anywhere in O(1) once the node is reached.",
  "No data ever moves, and no spare capacity is needed: the list grows one node at a time.",
  "Simple: one pointer per node.",
]
cons = [
  "No random access: position i is i steps from the head.",
  "Deleting at the end, or deleting a node, needs the node before it, which means walking from the head.",
  "One pointer and an object header per node: several times the memory of an int in an array.",
  "Nodes scattered in memory are slower to walk than a consecutive array.",
]

[[mistake]]
mistake = "Setting the two pointers of an insertion in the wrong order"
happens = "`prev.next = newNode` first makes the rest of the list unreachable, and `newNode.next = prev.next` then points the new node at itself."
fix = "First `newNode.next = prev.next`, then `prev.next = newNode`."
[[mistake]]
mistake = "Losing the head"
happens = "Walking with `head = head.next` instead of a separate `current` pointer throws away the start of the list."
fix = "Walk with `Node current = head;` and leave `head` alone."
[[mistake]]
mistake = "Forgetting the empty list and the one-node list"
happens = "`head.next` on an empty list throws `NullPointerException`; deleting the only node must set `head` to `null`."
fix = "Check `head == null` first (underflow), and handle `head.next == null` in deleteAtEnd."
[[mistake]]
mistake = "Deleting a node without the node before it"
happens = "With only `current`, there is no way to change the previous node's `next`."
fix = "Walk with `prev` one node behind `current`, or stop at the node before."

[[exercise]]
level = "easy"
question = """Write `int countOccurrences(String key)` that counts the nodes holding `key`. What are its time and space complexity?"""
answer = """```java
int countOccurrences(String key) {
    int c = 0;
    Node current = head;
    while (current != null) {
        if (current.data.equals(key)) c++;
        current = current.next;
    }
    return c;
}
```
One pass over n nodes: O(n) time, O(1) extra space."""
[[exercise]]
level = "medium"
question = """Add a `tail` pointer that always refers to the last node, so `insertAtEnd` takes no steps. Which other operations must now keep `tail` up to date?"""
answer = """`insertAtEnd` becomes: if the list is empty, `head = tail = newNode`; otherwise `tail.next = newNode; tail = newNode;`, O(1). `insertAtBeginning` must set `tail` when the list was empty; `insertAtPosition` when the new node is the last; `deleteAtBeginning` when the list becomes empty; `deleteAtEnd`, `deleteAtPosition` and `deleteByKey` when they delete the last node; and `reverse`, which makes the old head the new tail. `deleteAtEnd` is still O(n): the second-to-last node must be found by walking."""
[[exercise]]
level = "harder"
question = """Write `String middle()` that returns the data of the middle node in one pass, without counting first."""
answer = """```java
String middle() {
    Node slow = head, fast = head;
    while (fast != null && fast.next != null) {
        slow = slow.next;          // one step
        fast = fast.next.next;     // two steps
    }
    return slow == null ? null : slow.data;
}
```
When `fast` reaches the end, `slow` has gone half as far: the middle. One pass, O(n) time, O(1) space. On the six clues it returns "the bridge", position 3."""

