# ---------------------------------------------------------------- act 4
[[act]]
title = "Two pointers in the wrong order"
summary = "prev.next = newNode first: the mill points at itself and 4 of 7 clues become unreachable; deleting from an empty list is an underflow."
detail = """Insertion's two pointer changes must happen in the right order. Done the other way round, `prev.next = newNode` comes first: the old well now points at the mill, and nothing points at the red gate any more. Then `newNode.next = prev.next` copies that same pointer into the mill, so the mill points at itself. Walking from the head now reaches the oak tree, the old well and the mill, and then goes round in a circle: only 3 of 7 clues are reachable, and the red gate, the bridge, the fountain and the chest are lost. Deleting from an empty list is refused as an underflow."""
speech = """What happens if the two pointers are set in the wrong order? [[slnc 400]] First, the old well is pointed at the mill. [[slnc 300]] Now nothing points to the red gate. [[slnc 400]] Then the mill copies the old well's pointer, which points at the mill itself. [[slnc 500]] The mill points at itself. [[slnc 300]] Only three clues can be reached. [[slnc 300]] The other four are lost."""
console = [["prev.next = newNode first, then newNode.next = prev.next", "amber"], ["\"the mill\" now points at itself", "bad"], ["3 of 7 clues reachable; the other 4 are lost", "bad"], ["an empty list, deleteAtBeginning(): underflow: the list is empty", "bad"]]
[[act.frame]]
caption = "The mill points at itself; the red gate, bridge, fountain and chest are unreachable"
say = """Here is the broken list. [[slnc 300]] The oak tree, the old well, and the mill, which points back at itself. [[slnc 400]] The four clues after it, in red, still exist, but no pointer leads to them."""
