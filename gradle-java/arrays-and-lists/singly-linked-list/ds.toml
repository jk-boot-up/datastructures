tagline = "Change two pointers, move nothing"
bold = "A singly linked list is a chain of nodes, each holding a value and a pointer to the next node; inserting or removing changes a pointer or two and moves nothing, but reaching node number n means following n pointers."
analogy_short = "A treasure hunt: each clue tells you where the next one is"
jdk = "`java.util.LinkedList` (which links both ways: see the doubly linked list)"
thumb_lines = ["SINGLY", "LINKED LIST"]
