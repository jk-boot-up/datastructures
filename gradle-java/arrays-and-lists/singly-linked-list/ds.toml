[[scene]]
key = "costs"
kind = "bullets"
title = "Time and Space Complexity"
body = ["insert, delete at beginning: O(1)", "insert at end, delete at end: O(n)", "at a position: O(n) to reach, O(1) to link", "search, get, count, display, reverse: O(n)", "", "extra space: O(1) for every operation"]
narration = """Here are the costs in time and space. [[slnc 400]] Insertion and deletion at the beginning are order one. [[slnc 400]] Insertion and deletion at the end are order n, because only the head is stored. [[slnc 400]] At a position, reaching it is order n, and linking is order one. [[slnc 400]] Search, get, count, display and reverse are order n. [[slnc 500]] And every operation uses order one extra space."""

[[scene]]
key = "compare"
kind = "bullets"
title = "Compared With Related Structures"
body = ["access position i: list O(n), array O(1)", "insert at beginning: list O(1), array O(n)", "delete at end: singly O(n), doubly O(1)", "walk backwards: singly no, doubly yes", "", "memory: a pointer and a header per node"]
narration = """How does it compare? [[slnc 400]] Reaching position i is order n in a list, and order one in an array. [[slnc 400]] Inserting at the beginning is order one in a list, and order n in an array. [[slnc 400]] Deleting at the end is order n in a singly linked list, and order one in a doubly linked list. [[slnc 400]] And every node carries a pointer, so a list uses more memory than an array."""

[[scene]]
key = "mistakes"
kind = "bullets"
title = "Common Mistakes"
body = ["the two insertion pointers in the wrong order", "walking with head instead of current", "forgetting the empty and one-node lists", "deleting without the node before"]
narration = """Four mistakes to watch for. [[slnc 400]] Setting the two pointers of an insertion in the wrong order, which loses the rest of the list. [[slnc 400]] Walking with the head instead of a current pointer. [[slnc 400]] Forgetting the empty list, and the list of one node. [[slnc 400]] And trying to delete a node without holding the node before it."""

