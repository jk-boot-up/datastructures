[docs.problem]
scenario = """A railway line keeps sixteen stations in order of distance and answers "which station is at kilometre k?", while stations are added and removed."""
naive = """A sorted linked list inserts cheaply but can only be searched by walking: thirteen steps to reach Marden, and 500 on average for a line of a thousand. A sorted array can be halved but moves everything on every insert."""
deliver = [
  "A `SkipList` built by hand: nodes with a key, a value and an array of forward pointers, and a head on every level.",
  "Search that rides each level and drops down, counting steps: 3 for Marden against 13.",
  "Insert and remove on every level a station stands on, counting pointers.",
  "A hand-written, seeded `Coin` (no `java.util.Random`) so heights and counts are the same on every run.",
  "The unlucky always-tails coin, and a 1,000-station line averaging 9.7 steps.",
]

[docs.prerequisites]
required = ["The singly linked list project", "Java arrays of objects, and `for` loops counting down"]
not_required = ["Probability beyond tossing a coin", "Logarithms (the README explains log2 as 'how many times you can halve')"]

[docs.session]
objectives = [
  "Draw a skip list with its levels and head.",
  "Search it by riding each level and dropping down, and count the steps.",
  "Insert and remove on every level a node stands on.",
  "Explain why the coin makes it fast on average, and what an unlucky coin does.",
]
walkthrough = """Start with the railway analogy and a drawn line of stations with an express above it. Run the demo; in act one, count the thirteen steps. In act two, draw the four levels. In act three, trace the search for Marden with a finger and say out loud 'too far, change down' at each drop. In act four, toss a real coin for a few stations to show how heights come about, then imagine it always landing tails. Close with act five's numbers and the harder exercise's argument for two pointers per station."""

[docs.explained]
sentence = """A skip list is a sorted linked list with extra express levels, chosen by coin tosses, so a search rides the highest level as far as it can, then drops down, taking about log2(n) steps on average."""
verdict = """Use a skip list when you need ordered data with fast search, insert and delete and would rather not write a balanced tree, or when many threads must change it at once, which is where the JDK uses it. When you need a guaranteed worst case, use a balanced tree; when the data never changes, a sorted array searched by halving is smaller and just as fast."""
recognise = [
  "A node with an array of next pointers, often `Node[] next` or `forward`.",
  "A `randomLevel()` method that loops while a random bit is set.",
  "A search loop over levels counting down, with an inner `while` riding each level.",
]

[spec]
purpose = """Teach the skip list to a complete beginner: express levels over a sorted linked list, searching by riding and dropping, coin-toss heights, and average versus worst case."""
requirements = [
  "Built by hand: nodes with a kilometre key, a station name and a `Node[] next`; a head on every level; no Java collections.",
  "A hand-written seeded `Coin` for heights, and an always-tails coin for the worst case.",
  "`find`, `insert` and `remove` count steps and pointers; a duplicate kilometre is refused.",
  "The regular line finds Marden in 3 steps; the stopping line in 13.",
  "1,000 stations with seed 2026 average 9.7 steps per search, with 2,031 pointers.",
  "The demo prints five acts whose numbers the tests assert.",
]
