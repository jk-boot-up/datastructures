[[scene]]
key = "costs"
kind = "bullets"
title = "What Each Operation Costs"
body = ["search: about log2(n) steps on average", "insert: the search, plus 2 pointers per level", "remove: the search, plus 1 pointer per level", "memory: about 2 pointers per value", "", "O(log n) expected   O(n) with bad luck"]
narration = """Let's put the costs side by side. [[slnc 400]] A search takes about log two of n steps, on average. [[slnc 300]] Log two of n just means how many times you can halve n: about ten for a thousand. [[slnc 400]] Inserting is a search, plus two pointers per level. [[slnc 400]] Removing is a search, plus one pointer per level. [[slnc 400]] And the memory is about two pointers per value. [[slnc 600]] Order log n, expected. [[slnc 300]] Order n, with bad luck."""

[[scene]]
key = "mistakes"
kind = "bullets"
title = "Common Mistakes"
body = ["not recording the station before, on every level", "pointers in the wrong order", "an unseeded coin in tests", "no cap on the height"]
narration = """Four mistakes to watch for. [[slnc 400]] Not recording the last station before the target on every level, so the insert links in the wrong place. [[slnc 400]] Setting the pointers in the wrong order, which loses the rest of a level. [[slnc 400]] Using an unseeded coin in tests, so the counts change every run. [[slnc 400]] And letting the height grow without a cap."""

[[scene]]
key = "verdict"
kind = "bullets"
title = "When To Use It"
body = ["use it: ordered data, fast search and change, simple code", "use it: many threads changing it at once", "", "avoid it: you need a guaranteed worst case", "avoid it: the data never changes", "", "already in Java: ConcurrentSkipListMap"]
narration = """So, when should you use a skip list? [[slnc 400]] When you need ordered data, with fast search and change, and simple code. [[slnc 400]] And when many threads change it at once, which is why Java's concurrent skip list map exists. [[slnc 500]] Avoid it when you need a guaranteed worst case, or when the data never changes."""

