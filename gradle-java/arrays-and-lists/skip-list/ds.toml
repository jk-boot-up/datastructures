[[scene]]
key = "01-poster"
kind = "poster"
title = "Skip List"
narration = """Hello, and welcome. [[slnc 400]] This video explains the skip list, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A skip list is a sorted linked list with express lanes. [[slnc 300]] Some values also stand on higher levels, which skip over the ones in between. [[slnc 400]] A search rides the express as far as it can, then changes down. [[slnc 400]] And a coin toss decides which values get the express stops. [[slnc 700]] Our example is a train line, with a stopping service and express services. [[slnc 400]] By the end, you will know how to search, add and remove, why coins make it fast, and why fast only on average."""

[[scene]]
key = "02-idea"
kind = "structure"
title = "The Everyday Idea"
caption = "Ride the express as far as it goes, then change to the stopping train"
picture = { type = "skiplist", stations = ["Ashford", "Bexley", "Carlton", "Denby", "Elstow", "Farley"], heights = [1, 1, 1, 2, 1, 1], marks = { "Elstow" = "ok" }, path = [[2, "head", "Denby"], [1, "Denby", "Elstow"]] }
narration = """Think of a railway line with two kinds of train. [[slnc 400]] The stopping train calls at every station. [[slnc 300]] The express calls only at a few. [[slnc 500]] To reach a small station near the end, you ride the express as far as it goes without overshooting. [[slnc 400]] Then you change to the stopping train, for the last few stops. [[slnc 500]] That is a skip list."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "Words First"
body = ["level: one lane of pointers", "height: how many levels a station stands on", "head: a dummy start on every level", "coin toss: how tall each new station is", "", "fast on average, not in every case"]
narration = """A few words, before we start. [[slnc 400]] A level is one lane of pointers. [[slnc 300]] Level one calls everywhere; higher levels skip. [[slnc 400]] A station's height is how many levels it stands on. [[slnc 400]] The head is a dummy start, on every level. [[slnc 400]] And a coin toss decides how tall each new station is."""

