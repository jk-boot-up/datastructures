listing_intro = """Each operation is a public method that starts the recursion and a private method that calls itself. Compare them with `static-array-recursive`: the recursion is identical, and only the comparisons have changed, from `==` and `<` to `equals` and `compareTo`."""
[[listing]]
op = "Linear search with equals"
method = "GenericRecursiveStaticArray#linearSearch"
note = """Two base cases: no elements left (-1), and a match, found with `equals`, which compares contents. Otherwise the call passes the rest of the array, `i + 1`, to the next call. One frame per element examined."""
[[listing]]
op = "Binary search with compareTo"
method = "GenericRecursiveStaticArray#binarySearch"
note = """`compareTo` returns negative, zero or positive, which decides the half. The base case is an empty range. Each call halves the range, so the depth is about log2(n): 3 for 7 names, 20 for a million."""
[[listing]]
op = "Find maximum"
method = "GenericRecursiveStaticArray#findMax"
note = """The base case is the last element. Every other call first finds the maximum of the rest, then compares it with its own element using `compareTo`, on the way back up. The element's own `compareTo` decides the order: temperature for readings, alphabetical for names."""
[[listing]]
op = "Deletion"
method = "GenericRecursiveStaticArray#deleteAt,shiftLeft"
note = """`shiftLeft` moves `arr[i + 1]` into `arr[i]` and recurses on `i + 1`, stopping at the last element. Afterwards the freed place is set to `null`, so the deleted object is not kept alive by the array."""

