[[scene]]
key = "costs"
kind = "bullets"
title = "Time and Space Complexity"
body = ["get, update: O(1), not recursive", "traverse, linear search, max: O(n) time, O(n) stack", "binary search: O(log n) time and stack", "insert, delete: O(n) time and stack at the front", "", "the loop versions: the same time, O(1) space"]
narration = """Here are the costs. [[slnc 400]] Get and update are order one, and not recursive. [[slnc 400]] Traversal, linear search and find max take order n time, and order n stack. [[slnc 400]] Binary search takes order log n time and stack. [[slnc 400]] Insertion and deletion at the front take order n time and stack. [[slnc 500]] The loop versions take the same time, with order one extra space."""

[[scene]]
key = "compare"
kind = "bullets"
title = "The Four Static Arrays"
body = ["int, loops: the fastest, the smallest", "int, recursive: O(depth) stack", "generic, loops: any type, references", "generic, recursive: any type, O(depth) stack", "", "generics: what is compared; recursion: how much stack"]
narration = """How do the four static arrays compare? [[slnc 400]] The int array with loops is the fastest and the smallest. [[slnc 400]] The recursive int array adds a stack frame per waiting call. [[slnc 400]] The generic array with loops holds any type, through references. [[slnc 400]] And this one does both. [[slnc 500]] Generics change what is compared. [[slnc 300]] Recursion changes how much stack is used."""

[[scene]]
key = "mistakes"
kind = "bullets"
title = "Common Mistakes"
body = ["== or < on elements", "no base case, or no progress", "leaving the deleted reference", "linear recursion on large data"]
narration = """Four mistakes to watch for. [[slnc 400]] Using double equals or less than on elements, instead of equals and compare to. [[slnc 400]] A recursion with no base case, or no progress towards it. [[slnc 400]] Leaving the deleted reference in the array. [[slnc 400]] And linear recursion on large data, which overflows the stack."""

