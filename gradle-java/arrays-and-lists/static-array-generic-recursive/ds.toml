main_class = "GenericRecursiveStaticArrayDemo"
example = "One week held as day names, temperatures and readings, every operation recursive"
tagline = "Any element type, one element at a time"
bold = "The generic recursive static array holds any comparable type T, compares elements with equals and compareTo, and writes every operation as a method that handles one element or one half and calls itself for the rest; its time is the same as the loop version, and its extra space is the recursion depth."
analogy_short = "A queue of people passing a question back, whatever the question is about"
jdk = "Nothing: Java's generic collections and `java.util.Arrays` are iterative"
thumb_lines = ["STATIC ARRAY", "GENERIC + RECURSIVE"]
thumb_code = "search(key, i + 1)"
youtube_title = "Generic Recursive Static Array in Java - equals, compareTo and the Call Stack"
youtube_tags = ["java generics", "recursion", "recursive binary search", "comparable", "call stack", "static array"]
youtube_description = """Generic Recursive Static Array in Java, explained with one week held as String day names, Integer temperatures and Reading records by the same class. We trace a recursive linear search for "Thu" call by call, each call asking equals and passing the rest of the array to the next call, until the match at depth 4. We traverse all three element types at depth 7, find a separately made "Fri" that == would miss, binary search the sorted day names with compareTo in 3 calls, and find the hottest reading with compareTo on the way back up the call stack. We insert, delete and reverse recursively, clearing the freed place for the garbage collector, and finish at the limit: binary search on a million Integers goes only 20 calls deep, while linear search throws a real StackOverflowError."""

[readme]
intro = """This project combines the two variations of the **static array**. Like `static-array-generic`, the element type is a **type parameter** `T extends Comparable<T>`, so the same class holds day names, temperatures or readings, stores **references**, and compares elements with **`equals`** and **`compareTo`**. Like `static-array-recursive`, every operation that can be recursive is: it handles one element or one half, **calls itself** for the rest, and stops at a **base case**, so each call still waiting keeps a **frame** on the **call stack**. The time of every operation is unchanged from the plain static array; the extra space of each recursive operation is its **recursion depth**: O(n) for traversal, linear search, maximum and shifting, O(log n) for binary search."""
analogy = """Picture a queue of seven people, each holding a card. You want to know who holds a card that matches yours. You ask the first person to compare their card with yours. If it does not match, they ask the person behind them the same question and wait. The cards may be anything, numbers, names, photographs: each person just knows how to compare two cards of that kind. When someone finds a match, or the queue runs out, the answer travels back up the queue to you. While the question travels down, everyone asked is standing there waiting: that is the call stack."""
example = """The weather station's week is stored three ways by the same class: day names as `String`, temperatures as `Integer`, and `Reading(day, celsius)` records ordered by temperature. The demo traces a recursive search for "Thu", traverses all three arrays, binary searches the sorted day names, finds the hottest reading and the last day name with one recursive `findMax`, inserts, deletes and reverses recursively, and finally runs out of call stack on a million elements."""
why = """The generic version answers "how do I write the structure once for every type?"; the recursive version answers "how do the textbook's recursive definitions run?". Real code needs both at once: every recursive algorithm later in the course, on trees, heaps and graphs, is written generically, comparing elements with `compareTo`. Seeing the two together on the simplest structure makes those later projects easier to read."""
when_use = [
  "The structure must hold several element types, and the algorithm is naturally recursive.",
  "The recursion depth is logarithmic, as in binary search.",
  "Learning: this is how the tree and divide-and-conquer code later in the course is written.",
]
when_not = [
  "Linear recursion over large arrays: a million elements overflow Java's call stack; use the loops of `static-array-generic`.",
  "Millions of plain numbers: `int[]` avoids a reference and an object per element.",
]
met_before = [
  "Recursive generic methods in textbooks, such as `<T extends Comparable<T>> int binarySearch(T[] a, T key, int low, int high)`.",
  "`Comparable<T>` on `String`, `Integer` and `LocalDate`.",
  "Any `StackOverflowError` from a method that called itself too deeply.",
]

