[[scene]]
key = "01-poster"
kind = "poster"
title = "Static Array (Generic, Recursive)"
narration = """Hello, and welcome. [[slnc 400]] This video explains the generic, recursive static array, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] It is a static array written once for any element type, whose operations call themselves. [[slnc 400]] Each call handles one element, compares it with equals or compare to, and passes the rest to the next call, until a base case stops it. [[slnc 700]] Our example is a weather station's week, as day names, temperatures, and readings. [[slnc 400]] By the end, you will know how generics and recursion work together, and what each one costs."""

[[scene]]
key = "02-idea"
kind = "structure"
title = "The Everyday Idea"
caption = "Each person compares their card, or passes the question back and waits"
picture = { type = "array", cells = ["you", "card", "card", "card", "card", "card", "last"], marks = { "6" = "ok" }, pointers = [[0, "asks"], [6, "base case"]], title = "a queue of seven people holding cards" }
narration = """Think of a queue of seven people, each holding a card. [[slnc 400]] You want to find a card that matches yours. [[slnc 400]] The first person compares their card with yours. [[slnc 300]] If it does not match, they ask the person behind them, and wait. [[slnc 500]] The cards could be numbers, names, or photographs. [[slnc 300]] Each person just knows how to compare two cards of that kind. [[slnc 500]] When someone finds a match, or the queue runs out, the answer travels back up. [[slnc 400]] Everyone waiting is the call stack."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["T: the element type, filled in at each use", "equals: same contents?  compareTo: which is larger?", "base case: no call; recursive case: call on the rest", "", "recursion depth = frames at once = extra space"]
narration = """The words. [[slnc 400]] T is the element type, filled in each time the class is used. [[slnc 400]] Equals asks whether two elements have the same contents. [[slnc 300]] Compare to asks which one is larger. [[slnc 400]] The base case answers without calling again. [[slnc 300]] The recursive case handles one element and calls itself on the rest. [[slnc 500]] And the recursion depth, the number of frames at once, is the extra memory used."""

