# ---------------------------------------------------------------- act 5
[[act]]
title = "The limit of recursion"
summary = "On 1,000,000 Integers, recursive binary search is 20 compareTo calls deep; recursive linear search throws StackOverflowError."
detail = """Generics do not change the depth. Binary search on a million sorted Integers makes 20 `compareTo` calls, 20 frames deep, and is always safe. Linear search on the same array needs one frame per element, and the call stack runs out long before a million: Java throws `StackOverflowError`. The loop version in `static-array-generic` searches the million with O(1) extra space. Generics change what is compared; recursion changes how much stack is used; neither changes the time."""
speech = """And the limit. [[slnc 400]] Binary search on a million integers is only twenty calls deep. [[slnc 500]] Linear search needs one frame per element, and the call stack runs out: a stack overflow error. [[slnc 500]] So, generics change what is compared. [[slnc 300]] Recursion changes how much stack is used. [[slnc 300]] Neither changes the time."""
