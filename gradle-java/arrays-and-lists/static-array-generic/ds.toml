[[scene]]
key = "01-poster"
kind = "poster"
title = "Static Array (Generic)"
narration = """Hello, and welcome. [[slnc 400]] This video explains the generic static array, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A generic array is written once, with a type parameter called T. [[slnc 300]] Each time it is used, T is filled in: integers, strings, or any type of our own. [[slnc 400]] Everything else is the static array you already know. [[slnc 700]] Our example is a weather station's week, stored three different ways by the same class. [[slnc 400]] By the end, you will know how to write a generic array, what it really stores, and why objects are compared with equals and compare to."""

[[scene]]
key = "02-idea"
kind = "structure"
title = "The Everyday Idea"
caption = "Each locker holds a label pointing at the thing, so the row works for anything"
picture = { type = "array", cells = ["label", "label", "label", "", ""], size = 3, title = "lockers of labels: books only, or bicycles only" }
narration = """Think of the row of numbered lockers again. [[slnc 400]] But now each locker holds a label, with an address, and the thing itself is kept somewhere else. [[slnc 400]] The lockers do not care what the things are, so the same row works for books, or for bicycles. [[slnc 500]] When the manager says, this row is for books only, nobody may store a bicycle's label there. [[slnc 400]] That is a generic array: one design, any type, and a rule that is checked."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["T: the type parameter, filled in at each use", "reference: what each place really stores", "equals: same contents?", "compareTo: smaller, equal or larger?", "", "T extends Comparable<T>: any type that can be ordered"]
narration = """The words. [[slnc 400]] T is the type parameter, filled in each time the class is used. [[slnc 400]] Each place stores a reference, the address of an object. [[slnc 400]] Equals asks whether two objects have the same contents. [[slnc 400]] Compare to asks whether one is smaller, equal, or larger. [[slnc 500]] And T extends comparable means: any type whose elements can be put in order."""

[[scene]]
key = "acts"
kind = "acts"
title = "acts"
narration = ""

[[scene]]
key = "costs"
kind = "bullets"
title = "Time and Space Complexity"
body = ["access, update: O(1)", "traverse, linear search, max, reverse: O(n)", "binary search (sorted): O(log n)", "insert, delete: O(n) at the front, O(1) at the end", "", "the same as the int array; extra space O(1)"]
narration = """Here are the costs in time and space. [[slnc 400]] They are exactly the same as the int array. [[slnc 400]] Access and update are order one. [[slnc 400]] Traversal, linear search, maximum and reverse are order n. [[slnc 400]] Binary search is order log n. [[slnc 400]] Insertion and deletion are order n at the front. [[slnc 500]] Generics change the element type, not the algorithm."""

[[scene]]
key = "compare"
kind = "bullets"
title = "Compared With Related Structures"
body = ["int[]: values; generic: references to objects", "int[]: 4 bytes each; generic: reference + object", "int[]: == and <; generic: equals and compareTo", "", "static generic: fixed; dynamic generic: grows"]
narration = """How does it compare? [[slnc 400]] An int array stores the values themselves, four bytes each. [[slnc 400]] A generic array stores references, and every value is a separate object, so it uses more memory. [[slnc 400]] An int array compares with double equals and less than. [[slnc 300]] A generic array uses equals and compare to. [[slnc 500]] And like every static array, its capacity is fixed. [[slnc 300]] A generic dynamic array grows."""

[[scene]]
key = "mistakes"
kind = "bullets"
title = "Common Mistakes"
body = ["comparing objects with ==", "writing new T[capacity]", "leaving a reference in a freed place", "using the raw type without <T>"]
narration = """Four mistakes to watch for. [[slnc 400]] Comparing objects with double equals, which only checks for the very same object. [[slnc 400]] Writing new T array, which does not compile. [[slnc 400]] Leaving a reference in a freed place, which keeps the object alive. [[slnc 400]] And using the class without a type in angle brackets, which switches the compiler's checks off."""

