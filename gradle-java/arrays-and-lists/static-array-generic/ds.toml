  "Stores references: more memory than `int[]`, and one more step to reach each value.",
  "`new T[n]` is impossible; the array is created as `Comparable[]` and cast.",
  "Elements must be compared with equals and compareTo; `==` and `<` are easy mistakes.",
  "The capacity is still fixed; a full array overflows.",
]

[[mistake]]
mistake = "Comparing objects with `==`"
happens = "`==` asks whether two references point at the same object, so an equal string made elsewhere is not found."
fix = "Use `equals` for equality and `compareTo` for order."
[[mistake]]
mistake = "Writing `new T[capacity]`"
happens = "It does not compile: Java does not know `T` when the program runs."
fix = "`(T[]) new Comparable[capacity]` (or `new Object[capacity]` when no bound is needed), with the cast kept inside the class."
[[mistake]]
mistake = "Leaving a reference in a freed place"
happens = "The deleted object stays reachable from the array, so the garbage collector cannot free it."
fix = "Set the place to `null` when it falls out of use."
[[mistake]]
mistake = "Using a raw type: `GenericStaticArray a`"
happens = "The compiler stops checking the element type, and the wrong type is only caught at run time, if at all."
fix = "Always give the type argument: `GenericStaticArray<Integer>`."

[[exercise]]
level = "easy"
question = """Write `int count(T key)`, which returns how many elements are equal to `key`. Why must it use `equals` and not `==`?"""
answer = """```java
int count(T key) {
    int c = 0;
    for (int i = 0; i < n; i++) {
        if (arr[i].equals(key)) c++;
    }
    return c;
}
```
`==` compares references: two equal strings or readings created separately are different objects, so `==` would miss them. O(n) time, O(1) space."""
[[exercise]]
level = "medium"
question = """Make `Reading` order by day name instead of temperature. What does `findMax` then return on the week, and did you change `GenericStaticArray`?"""
answer = """```java
public int compareTo(Reading other) {
    return day.compareTo(other.day);
}
```
`findMax` now returns the reading whose day name is last alphabetically, "Wed" (19 C). `GenericStaticArray` is unchanged: the algorithm asks the element for its order, so changing the element's `compareTo` changes the answer."""
[[exercise]]
level = "harder"
question = """Write `boolean isSorted()`, true when the elements are in ascending order by `compareTo`. Then explain why `binarySearch` may give a wrong answer if `isSorted()` is false."""
answer = """```java
boolean isSorted() {
    for (int i = 1; i < n; i++) {
        if (arr[i - 1].compareTo(arr[i]) > 0) return false;
    }
    return true;
}
```
Binary search discards the half that "cannot" hold the key, which is only true when the elements are sorted. On unsorted data it may discard the half that holds the key and return -1. O(n) time, O(1) space."""

