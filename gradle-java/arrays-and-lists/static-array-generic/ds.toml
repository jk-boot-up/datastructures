listing_intro = """The generic version of each operation, exactly as it appears in `GenericStaticArray.java`. Compare them with the `static-array` project: the loops are identical; only the element type, and the way elements are compared, have changed."""
[[listing]]
op = "Creating the array"
method = "GenericStaticArray#GenericStaticArray"
note = """`new T[capacity]` does not compile, because Java erases `T` when it compiles. Every `T` is a `Comparable`, so an array of `Comparable` can hold them, and the cast to `T[]` is safe because the class only ever stores `T`. This is the standard textbook way to build a generic array in Java."""
[[listing]]
op = "Linear search with equals"
method = "GenericStaticArray#linearSearch"
note = """`arr[i].equals(key)` compares the contents of two objects. `arr[i] == key` would only be true for the very same object, so a search for `new String("Fri")` would fail although "Fri" is in the array."""
[[listing]]
op = "Binary search with compareTo"
method = "GenericStaticArray#binarySearch"
note = """`<` and `>` only work on numbers, so the generic version asks the element: `arr[mid].compareTo(key)` is negative, zero or positive. The halving, and the 20 comparisons for a million elements, are unchanged."""
[[listing]]
op = "Deletion"
method = "GenericStaticArray#deleteAt"
note = """The same shifts as the int version, plus one line: the place that falls out of use is set to `null`. Otherwise the array would keep a reference to the deleted object and Java could never free it."""

