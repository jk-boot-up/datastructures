# ---------------------------------------------------------------- act 2
[[act]]
title = "Inside: an array of references"
summary = "new T[10] is not allowed, so the array is created as (T[]) new Comparable[10]; copying it copies 7 references, and both arrays share the same objects."
detail = """Java removes type parameters when it compiles, which is called type erasure, so `new T[10]` cannot be written: the program would not know what T is. The array is created as `new Comparable[10]` and cast to `T[]`, which is safe because only T is ever stored. Each place holds a **reference**, the address of an object stored elsewhere. So when `copyWithCapacity(31)` grows the array, it copies 7 references, not 7 objects: index 0 of the old and the new array point at the very same object."""
speech = """What does the array really hold? [[slnc 400]] Java cannot create an array of T directly, because T is forgotten when the program runs. [[slnc 400]] So the class creates an array of comparable things, and casts it. [[slnc 500]] Each place holds a reference: the address of an object stored elsewhere. [[slnc 400]] Copying the array copies seven references, not seven objects. [[slnc 300]] Both arrays point at the same objects."""
console = [["new T[10] is not allowed: T is erased when the program runs", "bad"], ["so arr = (T[]) new Comparable[10]: 10 references, n = 7", "ok"], ["copyWithCapacity(31): 7 references copied; index 0 is the same object: true", "amber"]]
[[act.frame]]
caption = "Each place holds a reference; the objects live elsewhere in memory"
say = """Here is the picture. [[slnc 300]] The array holds references, drawn as arrows. [[slnc 400]] The objects themselves are elsewhere. [[slnc 300]] Following the arrow is one more step than reading an int."""
picture = { type = "linked", nodes = ["arr[0]", "Mon 21 C"], null_end = false, title = "arr[0] refers to a Reading object" }

# ---------------------------------------------------------------- act 3
[[act]]
title = "Searching with equals and compareTo"
summary = "Linear search finds 24 with 5 equals comparisons and finds a separately made \"Fri\" that == would miss; binary search finds 24 and \"Thu\" with 3 compareTo comparisons each."
detail = """With objects, `==` asks only whether two references point at the same object. A new string "Fri", made separately, is a different object from the one in the array, so `==` says false. Linear search therefore uses `equals`, which compares contents: it finds 24 at index 4 after 5 comparisons, and finds the new "Fri" at index 4. Binary search needs order, and `<` works only on numbers, so it uses `compareTo`, negative, zero or positive. On the sorted temperatures it finds 24 in 3 comparisons; on the sorted day names [Fri, Mon, Sat, Sun, Thu, Tue, Wed] it finds "Thu" in 3 comparisons too, because String's compareTo is alphabetical."""
speech = """Now searching. [[slnc 400]] With objects, double equals only asks: is this the very same object? [[slnc 400]] A new string, Fri, made separately, is a different object, so double equals says false. [[slnc 500]] So linear search uses the equals method, which compares the contents. [[slnc 400]] Binary search needs order, so it uses compare to. [[slnc 400]] It finds twenty four in three comparisons, and Thursday among the sorted day names in three as well."""
console = [["linearSearch(24) = index 4: 5 comparisons with equals", "amber"], ["linearSearch(new String(\"Fri\")) = index 4: equals compares the text", "ok"], ["days.get(4) == new String(\"Fri\") is false: == compares references", "bad"], ["sorted [19, 20, 21, 23, 24, 25, 26]: binarySearch(24) = index 4, 3 comparisons with compareTo", "ok"], ["sorted [Fri, Mon, Sat, Sun, Thu, Tue, Wed]: binarySearch(\"Thu\") = index 4, 3 comparisons", "ok"]]
[[act.frame]]
caption = "Binary search on day names: Sun (go right), Tue (go left), Thu: 3 compareTo calls"
say = """Binary search on the sorted day names. [[slnc 300]] The middle is Sunday. [[slnc 300]] Thursday comes after it alphabetically, so go right. [[slnc 400]] The middle of the right half is Tuesday. [[slnc 300]] Thursday comes before it, so go left. [[slnc 400]] And there is Thursday. [[slnc 300]] Three comparisons."""
picture = { type = "array", cells = ["Fri", "Mon", "Sat", "Sun", "Thu", "Tue", "Wed"], marks = { "0" = "dim", "1" = "dim", "2" = "dim", "3" = "hi", "5" = "hi", "4" = "ok", "6" = "dim" }, pointers = [[3, "1st"], [5, "2nd"], [4, "3rd"]] }

# ---------------------------------------------------------------- act 4
[[act]]
title = "Insertion, deletion, overflow"
summary = "Inserting a reading at index 2 shifts 5; deleting index 0 shifts 7 and sets the freed place to null; at 10 of 10 the next insert is an overflow."
detail = """Insertion and deletion are the same loops as in the int version, moving references instead of numbers. A corrected reading, "Wed* 18 C", goes in at index 2: five references shift right. Deleting index 0 removes "Mon 21 C": seven references shift left, and then the last place, no longer in use, is set to `null`. That line matters for objects: if the array kept the old reference, the garbage collector could never free the object. Three more readings fill the array to 10 of 10, and the next insertion is an overflow."""
speech = """Insertion and deletion work exactly as before. [[slnc 400]] Inserting a reading at index two shifts five references right. [[slnc 400]] Deleting index zero shifts seven references left. [[slnc 500]] Then one extra step: the freed place is set to null. [[slnc 300]] Otherwise the array would keep the deleted object alive. [[slnc 500]] And when all ten places are used, the next insertion is an overflow."""
console = [["insertAt(2, Wed* 18 C): 5 shifts, n = 8", "amber"], ["deleteAt(0) removed Mon 21 C: 7 shifts; the freed place is set to null", "amber"], ["[Tue 23 C, Wed* 18 C, Wed 19 C, Thu 25 C, Fri 24 C, Sat 22 C, Sun 20 C]", "muted"], ["n = 10, insertAt(0, Thu 30 C): overflow: the array is full (10 of 10)", "bad"]]
[[act.frame]]
caption = "deleteAt(0): seven references shift left, and the freed place becomes null"
say = """Here is the array after the deletion. [[slnc 300]] Seven references, in amber, shifted one place to the left. [[slnc 400]] The place after them, which used to hold a copy of the last reference, is now null."""
picture = { type = "array", cells = ["Tue 23", "Wed* 18", "Wed 19", "Thu 25", "Fri 24", "Sat 22", "Sun 20", "null", "", ""], size = 7, marks = { "0" = "hi", "1" = "hi", "2" = "hi", "3" = "hi", "4" = "hi", "5" = "hi", "6" = "hi", "7" = "dim" } }

# ---------------------------------------------------------------- act 5
[[act]]
title = "One algorithm, many orders"
summary = "The same findMax returns Thu 25 C for readings (by temperature) and Wed for day names (alphabetically); reverse swaps 3 pairs; there is no sum, because T need not be a number."
detail = """`findMax` is written once and asks each element for its order through `compareTo`. For readings, whose `compareTo` compares temperatures, it returns "Thu 25 C" after 6 comparisons. For day names, String's `compareTo` is alphabetical, so the same method returns "Wed". Reverse swaps references: 3 swaps for 7 readings. One operation from the int version is missing: `sum()`, because adding needs numbers and `T` can be any type. Java's own `ArrayList<E>` and `Arrays.binarySearch(T[], key)` are generic in exactly this way."""
speech = """One algorithm, many orders. [[slnc 400]] Find max is written once. [[slnc 300]] For readings, it compares temperatures, and returns Thursday, twenty five degrees. [[slnc 400]] For day names, it compares alphabetically, and returns Wednesday. [[slnc 500]] Each type brings its own order. [[slnc 400]] And there is no sum here, because adding needs numbers, and T can be any type."""
console = [["readings, findMax by temperature: Thu 25 C, 6 comparisons", "ok"], ["day names, findMax alphabetically: Wed", "ok"], ["reverse: 3 swaps; [Sun 20 C, Sat 22 C, Fri 24 C, Thu 25 C, Wed 19 C, Tue 23 C, Mon 21 C]", "muted"], ["no sum(): adding needs numbers, and T can be any type", "amber"], ["already in Java: java.util.ArrayList<E> and Arrays.binarySearch(T[], key) are generic the same way", "muted"]]
[[act.frame]]
