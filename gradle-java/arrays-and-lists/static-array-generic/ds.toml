title = "Static Array (Generic)"
package = "staticarraygeneric"
main_class = "GenericStaticArrayDemo"
example = "One week of temperatures held as numbers, as day names, and as readings"
tagline = "One array class, any element type"
bold = "A generic static array is written once with a type parameter T and used for any element type: it stores references to objects, compares them with equals and compareTo instead of == and <, and keeps every cost of the static array: O(1) access, O(n) shifting, a fixed capacity."
analogy_short = "A row of lockers that can hold whatever you are told to store"
jdk = "`java.util.ArrayList<E>` and the generic methods of `java.util.Arrays`, such as `binarySearch(T[], key)`"
thumb_lines = ["STATIC ARRAY", "GENERIC <T>"]
thumb_code = "GenericStaticArray<T>"
youtube_title = "Generic Static Array in Java - Type Parameters, equals and compareTo"
youtube_tags = ["java generics", "generic array", "static array", "comparable", "equals vs ==", "binary search"]
youtube_description = """Generic Static Array in Java, explained with one week of temperatures stored three ways by the same class: as Integer temperatures, as String day names, and as Reading records of our own. We see why Java cannot create new T[10] and what the array really stores, references to objects, so copying the array copies references and not objects. We search with equals, which compares contents, and see == fail on two equal strings; we binary search numbers and day names with compareTo in 3 comparisons each. We insert and delete with the same shifts as the plain array, clearing the freed place so the object can be garbage-collected, and hit the same overflow. We finish with one findMax algorithm giving the hottest reading and the last day name alphabetically, because each type brings its own order. The int-only version is in the Static Array project."""

[readme]
intro = """A **generic static array** is the static array written once for **any element type**. Instead of `int`, the class has a **type parameter** `T`: `GenericStaticArray<Integer>` holds integers, `GenericStaticArray<String>` holds strings, `GenericStaticArray<Reading>` holds objects of our own, and the compiler refuses anything else. The structure and every cost are the same as the `static-array` project: consecutive places, O(1) access by index, O(n) shifting on insertion and deletion, a fixed capacity and overflow. Three things change, and they are what this project teaches. The array stores **references** to objects, not the values themselves. Equality is tested with **`equals`**, which compares contents, not `==`, which compares references. And order is tested with **`compareTo`**, so `T` must be a type whose elements can be put in order: `T extends Comparable<T>`."""
analogy = """Picture the same row of numbered lockers, but now every locker holds a **label with an address** on it rather than the thing itself: the thing is kept somewhere else, and the label tells you where. The lockers do not care what the things are, parcels, books, bicycles, so the same row works for anything. When the manager says "this row is for books only", nobody may put a bicycle's label in it. To ask "is this the same book?" you compare the books, not the labels: two labels can point at two copies of the same book."""
example = """The weather station from the `static-array` project stores its week three ways with the same class: the temperatures as `Integer`, the day names as `String`, and each day as a `Reading(day, celsius)` record that orders readings by temperature. The demo searches each, inserts and deletes readings, and runs the same `findMax` on readings and on day names to show that each type brings its own order."""
why = """Without generics, the course would need a separate array class for every element type: one for `int`, one for `String`, one for readings, all with identical code. The old alternative, an array of `Object`, accepts anything, so a string can end up in an array of temperatures and the mistake is only found when the program crashes. A type parameter gives one class for every type, and the compiler checks each use: putting `"hot"` into a `GenericStaticArray<Integer>` does not even compile."""
when_use = [
  "The same structure is needed for more than one element type.",
  "You want the compiler to check the element type, instead of casting from `Object`.",
  "The elements are objects already, such as strings or records.",
]
when_not = [
  "Millions of plain numbers: `int[]` stores 4 bytes per element; an array of `Integer` stores a reference per element and a separate object for each value.",
  "The number of elements changes: use a dynamic array (`dynamic-array-generic`).",
]
met_before = [
  "`ArrayList<String>`, `HashMap<String, Integer>` and every other Java collection.",
  "`Comparable<T>`, implemented by `String`, `Integer`, `LocalDate` and many more.",
  "Templates in C++ and generics in C# and TypeScript.",
]

[[word]]
term = "type parameter T"
meaning = "A placeholder for the element type, written in angle brackets: `GenericStaticArray<T>`. Each use fills it in: `GenericStaticArray<Integer>`."
[[word]]
term = "reference"
meaning = "What an array of objects stores in each place: the address of an object that lives elsewhere in memory."
[[word]]
term = "equals"
meaning = "The method that compares two objects' contents. `==` on objects only asks whether two references point at the same object."
[[word]]
term = "compareTo"
meaning = "The method of `Comparable<T>` that orders two objects: negative if smaller, zero if equal, positive if larger."
[[word]]
term = "bounded type"
meaning = "`T extends Comparable<T>`: T may be any type, as long as its elements can be compared."
[[word]]
term = "type erasure"
meaning = "Java removes type parameters when it compiles, so at run time `T` is unknown and `new T[10]` is not allowed."
[[word]]
term = "overflow and underflow"
meaning = "Inserting into a full array (overflow) or deleting from an empty one (underflow), as in any static array."

