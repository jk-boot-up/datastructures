]
walkthrough = """Start with the queue analogy. Trace sum(0) on the board, writing each call beneath the last, then return the values upwards. Run the demo; in act two, draw the call stack for traverse. In act three, trace recursive binary search and note that the depth equals the number of comparisons. In act four, ask why shiftRight must start from the end. In act five, show the StackOverflowError and compare it with the loop in the static-array project."""

[docs.explained]
sentence = """A recursive array operation handles one element, or one half, and calls itself for the rest until a base case; it does the same work as the loop but keeps one stack frame per waiting call, so its extra space is the recursion depth: O(n) for linear passes and O(log n) for binary search."""
verdict = """Learn recursion here, where it is easiest to trace, because trees, graphs and divide-and-conquer algorithms depend on it. In real code on arrays, use recursion when the depth is logarithmic, as in binary search, and loops for linear passes, which in Java would overflow the stack on large inputs."""
recognise = [
  "A method that calls itself with `i + 1`, or with `low` and `high` for half the range.",
  "An `if` at the top returning without a call: the base case.",
  "A public method with fewer parameters that starts the recursion, such as `sum()` calling `sum(0)`.",
]

