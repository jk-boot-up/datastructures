slug = "static-array-recursive"
category = "arrays-and-lists"
title = "Static Array (Recursive)"
package = "staticarrayrecursive"
main_class = "RecursiveStaticArrayDemo"
example = "A week of daily temperatures, every operation written recursively"
tagline = "The same array, solved one element at a time"
bold = "A recursive operation solves the problem for one element and calls itself for the rest, stopping at a base case; it does the same work as the loop, but every call still waiting uses a frame on the call stack, so its extra space is the depth of the recursion: O(n) for traversal and search, O(log n) for binary search."
analogy_short = "A queue of people each asking the one behind"
jdk = "Nothing: Java's arrays and `java.util.Arrays` are all iterative; recursion is how the textbooks teach the operations"
thumb_lines = ["STATIC ARRAY", "RECURSIVE"]
thumb_code = "sum(i) = arr[i] + sum(i+1)"
youtube_title = "Static Array in Java, Recursively - Base Case, Call Stack and Complexity"
youtube_tags = ["recursion", "static array", "recursive binary search", "call stack", "stack overflow", "space complexity"]
youtube_description = """Static Array in Java, written recursively, explained with a week of daily temperatures stored in int arr[10] with n = 7 elements. We trace sum(0) = 21 + sum(1) all the way down to the base case and see seven calls waiting on the call stack at once. We then write every textbook operation recursively, counting both the steps and the recursion depth: traversal and sum at depth 7, finding the maximum in 6 comparisons, linear search for 24 in 5 comparisons at depth 5, binary search in 3 comparisons at depth 3, insertion and deletion shifting 5 and 7 elements recursively, and reversal in 3 swaps. We finish at the limit of recursion: binary search on a million elements goes only 20 calls deep, while linear search on a million elements throws a real StackOverflowError. The same operations written with loops are in the Static Array project."""

[readme]
intro = """A **static array** stores elements of one type in **consecutive memory locations**, with a fixed **capacity**, and keeps `n` elements in `arr[0..n-1]`. This project is the same array as the `static-array` project, but every operation that can be written **recursively** is: the method handles one element (or one half), then **calls itself** for the rest, and stops at a **base case** where there is nothing left to do. The answers are the same as the loops' answers, and the number of steps is the same too. What changes is memory: every call that is still waiting for the call below it keeps a **frame** on the **call stack**, so a recursive operation's extra space is its **recursion depth**: O(n) for traversal, search, sum, maximum and shifting, n / 2 for reversal, and only O(log n) for binary search. Access and update are one address calculation and stay non-recursive."""
analogy = """Picture a queue of seven people, and you want the total of the money in their pockets. You ask the first person. They do not count everyone; they ask the person behind them "what is the total from you to the end?", and wait. That person asks the next, and waits too. The last person has nobody behind, so they answer straight away with their own amount: that is the base case. Then the answers travel back up the queue, each person adding their own amount before passing it on. While the question travels down, everyone is standing there waiting: seven people waiting is seven frames on the call stack."""
example = """The same weather station as the `static-array` project stores one whole-number temperature a day in `int arr[10]`: Monday at index 0 through Sunday at index 6, so n = 7. The demo first traces `sum(0)` call by call to the base case, then runs every operation recursively and prints both what it counted (reads, comparisons, shifts, swaps) and how deep the recursion went. Finally it runs binary search and linear search on an array of a million elements, and linear search runs out of call stack."""
why = """Many textbook algorithms are defined recursively: "the sum is the first element plus the sum of the rest", "binary search searches one half". Writing them that way makes the code match the definition, and it is the only practical way to write the tree, graph and divide-and-conquer algorithms later in the course. The array is the simplest place to learn how recursion runs: the base case, the recursive case, the call stack, the depth, and the cost in memory that a loop does not pay."""
when_use = [
  "The problem is naturally defined in terms of a smaller copy of itself, such as binary search on one half.",
  "The recursion depth is small: O(log n), as in binary search, is always safe.",
  "Learning: tracing a recursion on an array is the best preparation for trees and divide-and-conquer.",
]
when_not = [
  "The recursion depth grows with n, as in linear search or traversal, and n can be large: Java has no tail-call elimination, so a million elements overflow the call stack. Use the loops of the `static-array` project.",
  "Performance matters: each call costs a frame, a jump and a return, which a loop does not.",
]
met_before = [
  "The definition of factorial: n! = n x (n - 1)!, with 0! = 1 as the base case.",
  "Any `StackOverflowError` from a method that called itself with no base case.",
  "Merge sort and quicksort, which recurse on halves of an array.",
]

[[word]]
term = "recursion"
meaning = "A method solving a problem by calling itself on a smaller part of the same problem."
[[word]]
term = "base case"
meaning = "The smallest input, answered directly without another call: `i == n`, no elements left. Without it the recursion never stops."
[[word]]
term = "recursive case"
meaning = "The part that handles one element and calls the method again for the rest: `arr[i] + sum(i + 1)`."
[[word]]
term = "call stack"
meaning = "The memory where Java keeps one frame for every method call that has not yet returned."
[[word]]
term = "stack frame"
meaning = "One call's parameters and local variables, pushed when the call starts and popped when it returns."
[[word]]
term = "recursion depth"
meaning = "The largest number of calls waiting on the stack at once. The extra space of a recursive operation is proportional to it."
[[word]]
term = "stack overflow"
meaning = "Too many frames for the call stack: Java throws `StackOverflowError`."
[[word]]
term = "tail recursion"
meaning = "The recursive call is the last thing the method does. Some languages then reuse the frame; Java does not."

