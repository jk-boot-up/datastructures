[[scene]]
key = "01-poster"
kind = "poster"
title = "Static Array (Recursive)"
narration = """Hello, and welcome. [[slnc 400]] This video explains the static array, written recursively, in Java. [[slnc 300]] This video is presented by Jayasekhar Konduru. [[slnc 600]] First, a simple definition. [[slnc 300]] A recursive method solves a problem by handling one small piece, and calling itself for the rest. [[slnc 400]] It stops at a base case, where nothing is left to do. [[slnc 400]] Every call that is still waiting uses memory on the call stack. [[slnc 700]] Our example is a weather station, storing one temperature a day in an array. [[slnc 400]] By the end, you will know how to write every textbook array operation recursively, what each one costs in time and in memory, and when a loop is the better choice."""

[[scene]]
key = "02-idea"
kind = "structure"
title = "The Everyday Idea"
caption = "Each person asks the one behind, and waits; the last one answers at once"
picture = { type = "array", cells = ["you", "", "", "", "", "", "last"], marks = { "6" = "ok" }, pointers = [[0, "asks the next"], [6, "base case"]], title = "a queue of seven people" }
narration = """Think of a queue of seven people. [[slnc 300]] You want the total money in their pockets. [[slnc 400]] You ask the first person. [[slnc 300]] They ask the person behind them for the total from there to the end, and wait. [[slnc 400]] That person asks the next, and waits too. [[slnc 500]] The last person has nobody behind, so they answer at once. [[slnc 300]] That is the base case. [[slnc 400]] Then the answers travel back up, each person adding their own amount. [[slnc 500]] While everyone waits, they are all standing in the queue. [[slnc 300]] That is the call stack."""

[[scene]]
key = "03-words"
kind = "bullets"
title = "The Words"
body = ["base case: answered without another call", "recursive case: one element + a call for the rest", "call stack: one frame per waiting call", "recursion depth: frames at once = extra space", "", "stack overflow: too deep for the call stack"]
narration = """The words a textbook uses. [[slnc 400]] The base case is the smallest input, answered without calling again. [[slnc 400]] The recursive case handles one element and calls the method for the rest. [[slnc 400]] The call stack holds one frame for every call that is still waiting. [[slnc 400]] The recursion depth is how many frames there are at once, and that is the extra memory used. [[slnc 500]] If the depth is too great, the stack overflows."""

