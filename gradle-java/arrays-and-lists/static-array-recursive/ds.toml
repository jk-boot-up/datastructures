# ---------------------------------------------------------------- act 5
[[act]]
title = "The limit of recursion"
summary = "On 1,000,000 elements, recursive binary search goes only 20 calls deep; recursive linear search throws a real StackOverflowError."
detail = """The depth decides whether recursion is safe. On a sorted array of a million elements, recursive binary search needs 20 comparisons and 20 frames, because each call halves the range: O(log n) depth is always safe. Recursive linear search on the same array needs one frame per element, a million frames, and the call stack runs out first: Java throws a real `StackOverflowError`. The loop in the `static-array` project searches the million with O(1) extra space and finishes. Java does not remove tail calls, so even a tail-recursive method keeps every frame. The rule: recurse when the depth is logarithmic; loop over long linear passes."""
speech = """And the limit of recursion. [[slnc 400]] Binary search on a million elements goes only twenty calls deep, because each call halves the range. [[slnc 500]] Linear search on the same million needs one frame per element. [[slnc 400]] The call stack runs out, and Java throws a stack overflow error. [[slnc 500]] The loop version finishes, with order one extra memory. [[slnc 400]] So, recurse when the depth is small, and use a loop for long linear passes."""
console = [["binarySearch on 1,000,000: 20 comparisons, depth 20: halving keeps the stack small", "ok"], ["linearSearch on 1,000,000: StackOverflowError, one frame per element", "bad"], ["the same loop in the static-array project needs O(1) extra space and finishes", "muted"], ["Java does not remove tail calls, so even tail-recursive code keeps every frame", "muted"]]
[[act.frame]]
caption = "Depth 20 against depth 1,000,000: the call stack holds the first, not the second"
say = """Here are the two depths side by side. [[slnc 300]] Binary search, twenty frames. [[slnc 300]] Linear search, a million frames, far more than the call stack can hold. [[slnc 400]] The work is similar in style. [[slnc 300]] The depth is what matters."""
picture = { type = "group", items = [ { type = "stack", cells = ["binarySearch(0..999999)", "...", "binarySearch: call 20"], width = 280, marks = { "2" = "ok" }, top_label = "depth 20" }, { type = "stack", cells = ["linearSearch(0)", "linearSearch(1)", "...", "StackOverflowError"], width = 280, marks = { "3" = "bad" }, top_label = "overflow" } ], gap = 60 }

