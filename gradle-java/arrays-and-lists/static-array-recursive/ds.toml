[[scene]]
key = "costs"
kind = "bullets"
title = "Time and Space Complexity"
body = ["access, update: O(1), not recursive", "traverse, linear search, max, sum: O(n) time, O(n) stack", "binary search: O(log n) time, O(log n) stack", "insert, delete: O(n) shifts, O(n) stack", "", "the loop versions: the same time, O(1) space"]
narration = """Here are the costs. [[slnc 400]] Access and update are order one, and are not recursive. [[slnc 400]] Traversal, linear search, maximum and sum take order n time, and order n stack space, one frame per element. [[slnc 400]] Binary search takes order log n time, and order log n stack space. [[slnc 400]] Insertion and deletion shift up to n elements, with up to n frames. [[slnc 500]] The loop versions take the same time, with order one extra space."""

[[scene]]
key = "compare"
kind = "bullets"
title = "Recursive or Iterative?"
body = ["same answers, same number of steps", "recursive: O(depth) stack; loop: O(1)", "binary search: 20 frames for a million, safe", "linear recursion: a million frames, overflow", "", "recurse when the depth is logarithmic"]
narration = """Recursive or iterative? [[slnc 400]] Both give the same answers, with the same number of steps. [[slnc 400]] But recursion keeps a frame for every waiting call, and a loop does not. [[slnc 400]] Binary search on a million elements needs only twenty frames, which is safe. [[slnc 400]] Linear recursion on a million elements needs a million frames, and overflows. [[slnc 500]] So recurse when the depth is logarithmic, and use a loop for long linear passes."""

[[scene]]
key = "mistakes"
kind = "bullets"
title = "Common Mistakes"
body = ["no base case: infinite recursion", "no progress towards the base case", "base case i == n - 1: fails on an empty array", "shifting from pos upwards", "linear recursion on large data"]
narration = """Five mistakes to watch for. [[slnc 400]] Forgetting the base case, so the recursion never stops. [[slnc 400]] Calling again without making the problem smaller. [[slnc 400]] A base case that an empty array never reaches. [[slnc 400]] Shifting from the insertion position upwards, which overwrites the data. [[slnc 400]] And linear recursion on large data, which overflows the stack."""

