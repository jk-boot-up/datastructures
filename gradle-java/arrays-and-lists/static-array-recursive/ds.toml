listing_intro = """Each recursive operation is a short public method that starts the recursion, and a private method that calls itself. Look for the two parts in every one: the **base case**, which returns without calling again, and the **recursive case**, which does one element's work and calls itself on a smaller part. `steps.enter()` and `steps.exit()` only measure the depth; they are not part of the algorithm."""
[[listing]]
op = "Sum: the simplest recursion"
method = "RecursiveStaticArray#sum"
note = """The base case is `i == n`: the sum of no elements is 0. The recursive case adds `arr[i]` to the sum of the rest. The addition cannot happen until `sum(i + 1)` returns, so all seven calls wait on the stack together: depth 7, O(n) extra space, where the loop needed one variable."""
[[listing]]
op = "Traversal"
method = "RecursiveStaticArray#traverse"
note = """The same shape as sum: visit element i, then traverse the rest. The recursive call is the last statement (tail recursion), but Java still keeps every frame."""
[[listing]]
op = "Insertion at a position"
method = "RecursiveStaticArray#insertAt,shiftRight"
note = """`shiftRight(i, pos)` moves `arr[i]` one place right and then shifts the elements before it; it starts at the last element, `n - 1`, so every element moves before its old place is overwritten, just as the loop runs from the end. The base case is `i < pos`: everything from `pos` onwards has moved. n - pos shifts, n - pos frames deep."""
[[listing]]
op = "Deletion at a position"
method = "RecursiveStaticArray#deleteAt,shiftLeft"
note = """The mirror image: `shiftLeft(i)` moves `arr[i + 1]` into `arr[i]` and recurses on `i + 1`, stopping at the last element."""
[[listing]]
op = "Linear search"
method = "RecursiveStaticArray#linearSearch"
note = """Two base cases: `i == n` (searched everything, return -1), and a match (return i). Otherwise search from i + 1. Finding 24 at index 4 takes 5 calls; searching a million elements needs a million frames, and overflows."""
[[listing]]
op = "Binary search"
method = "RecursiveStaticArray#binarySearch"
note = """The base case is an empty range, `low > high`. Each call compares with the middle and calls itself on one half only, so the depth is at most about log2(n) + 1: 20 for a million elements. This is the recursion that is always safe to use."""
[[listing]]
op = "Find maximum"
method = "RecursiveStaticArray#findMax"
note = """The base case is the last element, which is its own maximum. Every other call first finds the maximum of the rest, then compares it with its own element on the way back up, so the comparisons happen as the calls return."""
[[listing]]
op = "Reversal"
method = "RecursiveStaticArray#reverse"
note = """Swap the two ends, then reverse the part between them. The base case is `i >= j`: zero or one element left in the middle. n / 2 swaps, n / 2 frames."""

