<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ — Animated Walkthrough</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: #0f172a; color: #e2e8f0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { color: #94a3b8; margin: 0 0 18px; max-width: 75ch; }
  .wrap { max-width: 1180px; margin: 0 auto; }
  .narration { background: #1e293b; border: 1px solid #334155; border-radius: 10px;
               padding: 14px 18px; margin-bottom: 16px; min-height: 3.2em; }
  .step-label { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em;
                color: #a78bfa; font-weight: 700; margin-bottom: 4px; }
  #narration { font-size: 1.02rem; line-height: 1.55; }
  .stage { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
  @media (max-width: 860px) { .stage { grid-template-columns: minmax(0, 1fr); } }
  .picture { background: #020617; border: 1px solid #334155; border-radius: 10px; padding: 14px;
             min-height: 320px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  .picture svg { max-width: 100%; height: auto; animation: pic .45s ease-out; }
  @keyframes pic { from { opacity: .2; transform: scale(.985); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .picture svg { animation: none; } }
  .caption { color: #fbbf24; font-weight: 700; text-align: center; min-height: 1.4em; }
  .console { background: #020617; border: 1px solid #334155; border-radius: 10px; padding: 14px;
             font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .84rem;
             line-height: 1.55; overflow-y: auto; min-height: 160px; white-space: pre-wrap; }
  .console .ttl { color: #94a3b8; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase;
                  margin-bottom: 8px; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  #console-lines span.ok { color: #34d399; }
  #console-lines span.bad { color: #f87171; }
  #console-lines span.amber { color: #fbbf24; }
  #console-lines span.muted { color: #94a3b8; }
  .legend { color: #94a3b8; font-size: .82rem; margin: 0 0 14px; }
  .legend b.hi { color: #fbbf24; } .legend b.ok { color: #34d399; } .legend b.bad { color: #f87171; } .legend b.new { color: #a78bfa; }
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button { background: #334155; color: #e2e8f0; border: 1px solid #475569; border-radius: 8px;
           padding: 10px 18px; font-size: .92rem; cursor: pointer; min-height: 40px; }
  button:hover { background: #475569; }
  button:disabled { opacity: .45; cursor: default; }
  button#play { background: #7c3aed; border-color: #7c3aed; color: #ffffff; }
  button#play:hover { background: #8b5cf6; }
  #progress { color: #94a3b8; font-size: .85rem; margin-left: auto; }
</style>
</head>
<body>
<div class="wrap">
  <h1>__TITLE__ — Step by Step</h1>
  <p class="sub">__SUBTITLE__</p>
  <p class="legend">Colours in the pictures: <b class="hi">amber</b> just changed ·
    <b class="ok">green</b> correct or found · <b class="bad">red</b> wrong or removed · <b class="new">purple</b> new.</p>
  <div class="narration">
    <div class="step-label" id="step-label">Ready</div>
    <div id="narration">Press Step or Play to begin.</div>
  </div>
  <div class="stage">
    <div class="picture" id="picture"><div id="svg-slot"></div><div class="caption" id="caption"></div></div>
    <div class="console"><div class="ttl">What the demo printed</div><div id="console-lines"></div></div>
  </div>
  <div class="controls">
    <button id="step">Step ▸</button>
    <button id="play">Play ▶</button>
    <button id="reset">Reset ↺</button>
    <span id="progress">0 / 0</span>
  </div>
</div>
<script>
const STEPS = __STEPS__;
const START_SVG = __START_SVG__;
const stepLabel = document.getElementById("step-label");
const narrationEl = document.getElementById("narration");
const slot = document.getElementById("svg-slot");
const captionEl = document.getElementById("caption");
const consoleEl = document.getElementById("console-lines");
const progressEl = document.getElementById("progress");
const playBtn = document.getElementById("play");
let i = -1, timer = null;
function esc(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function render() {
  if (i < 0) {
    stepLabel.textContent = "Ready";
    narrationEl.textContent = "Press Step or Play to begin.";
    slot.innerHTML = START_SVG;
    captionEl.textContent = "";
    consoleEl.innerHTML = "";
    progressEl.textContent = "0 / " + STEPS.length;
    return;
  }
  const s = STEPS[i];
  stepLabel.textContent = s.label;
  narrationEl.textContent = s.narration;
  slot.innerHTML = s.svg;
  captionEl.textContent = s.caption || "";
  consoleEl.innerHTML = s.console.map(([t, c]) => '<span class="' + c + '">' + esc(t) + "</span>").join("\n");
  progressEl.textContent = (i + 1) + " / " + STEPS.length;
}
function step() { if (i >= STEPS.length - 1) { stopPlay(); return; } i += 1; render(); }
function reset() { stopPlay(); i = -1; render(); }
// While a step's narration is playing, Play waits for it to finish.
function speaking() { return typeof window.vkSpeaking === "function" && window.vkSpeaking(); }
function startPlay() {
  if (timer) return;
  playBtn.textContent = "Pause ❚❚";
  let quiet = 0;
  timer = setInterval(() => {
    if (speaking()) { quiet = 0; return; }
    if (++quiet < 8) return;                     // 8 × 500 ms to look at the picture
    quiet = 0;
    if (i >= STEPS.length - 1) { stopPlay(); return; }
    step();
  }, 500);
  if (i < 0) step();
}
function stopPlay() { if (timer) clearInterval(timer); timer = null; playBtn.textContent = "Play ▶"; }
document.getElementById("step").addEventListener("click", () => { stopPlay(); step(); });
document.getElementById("reset").addEventListener("click", reset);
playBtn.addEventListener("click", () => { if (timer) stopPlay(); else startPlay(); });
render();
</script>
</body>
</html>
