# ds.toml: everything about this project that is not Java code.
# tools/dskit turns it into the README, docs, pictures, animation and video scenes.
#
# Write for a complete beginner (PLAN.md section 2): picture first, words
# second, code last; count steps before naming a cost; explain every new word
# where it first appears; use the numbers the demo actually prints.
#
# Pictures (hero, and every act frame) use tools/dskit/dskit/structure.py:
#   { type = "array", cells = [...], size = 3, marks = { "2" = "hi" }, pointers = [[3, "size"]] }
#   types: array, stack, linked, tree, graph, buckets, grid, plane, group
#   marks: hi (just changed), ok, bad, new, cold, dim

